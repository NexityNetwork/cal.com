<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#1d1d1d;font-family:"Inter",sans-serif;color:#fafafa;-webkit-font-smoothing:antialiased}
.badge{position:absolute;top:60px;left:75px;width:88px;height:50px;background:#3a3a3a;border-radius:1000px;display:flex;align-items:center;justify-content:center;color:#fafafa;font-family:"Geist",sans-serif;font-size:24px;font-weight:700}
.handle{position:absolute;top:70px;right:75px;font-family:"Geist",sans-serif;font-size:32px;font-weight:500;color:#fafafa}
.center{position:absolute;top:50%;left:75px;right:75px;transform:translateY(-50%);text-align:center}
.headline{font-size:128px;font-weight:800;line-height:1;letter-spacing:-4px;margin-bottom:36px;color:#fafafa}
.headline .accent{color:#9ca3af}
.body{font-size:32px;font-weight:500;line-height:1.4;color:#9ca3af;max-width:840px;margin:0 auto 56px}
.btn{display:inline-block;padding:24px 56px;background:#fafafa;color:#1d1d1d;border-radius:50px;font-size:26px;font-weight:600}
.handle-foot{position:absolute;bottom:85px;left:75px;font-family:"Geist",sans-serif;font-size:24px;color:#9ca3af}
.save{position:absolute;bottom:85px;right:75px;display:flex;align-items:center;gap:10px;font-family:"Geist",sans-serif;font-size:22px;color:#9ca3af}
</style></head>
<body>
<div class="badge">{{number}}</div>
<div class="handle">{{handle}}</div>
<div class="center">
  <div class="headline">{{headlineLine1}}<br><span class="accent">{{headlineLine2}}</span></div>
  <div class="body">{{body}}</div>
  <div class="btn">{{buttonLabel}} →</div>
</div>
<div class="handle-foot">{{pageOf}}</div>
<div class="save">🔖 Save</div>
</body></html>
