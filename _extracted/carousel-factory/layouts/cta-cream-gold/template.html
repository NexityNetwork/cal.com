<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#1a1410;font-family:"Montserrat",sans-serif;color:#faf8f2;-webkit-font-smoothing:antialiased;}
  .marble{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,rgba(184,150,12,0.12) 0%,transparent 50%),radial-gradient(ellipse at 75% 70%,rgba(184,150,12,0.08) 0%,transparent 40%);}
  .top-border{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#b8960c 30%,#d4af37 50%,#b8960c 70%,transparent);}
  .brand-row{position:absolute;top:54px;left:70px;right:70px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-size:16px;font-weight:600;letter-spacing:0.18em;color:rgba(250,248,242,0.35);text-transform:uppercase;}
  .page{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:20px;color:rgba(250,248,242,0.35);}
  .center{position:absolute;top:50%;left:70px;right:70px;transform:translateY(-50%);text-align:center;}
  .eyebrow{font-size:16px;font-weight:600;letter-spacing:0.22em;color:#b8960c;text-transform:uppercase;margin-bottom:28px;}
  .gold-rule{width:80px;height:1px;background:#b8960c;margin:0 auto 28px;}
  .headline{font-family:"Cormorant Garamond",serif;font-size:140px;font-weight:700;line-height:0.85;letter-spacing:-1px;margin-bottom:16px;}
  .headline-italic{font-style:italic;color:#d4af37;}
  .ornament{font-size:28px;color:#b8960c;letter-spacing:0.3em;margin-bottom:36px;}
  .body{font-size:28px;font-weight:400;line-height:1.5;color:rgba(250,248,242,0.65);max-width:700px;margin:0 auto 48px;}
  .btn{display:inline-block;padding:20px 48px;border:1px solid #b8960c;border-radius:3px;font-size:20px;font-weight:600;letter-spacing:0.1em;color:#d4af37;text-transform:uppercase;}
  .bottom-border{position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#b8960c 30%,#d4af37 50%,#b8960c 70%,transparent);}
</style></head>
<body>
  <div class="marble"></div>
  <div class="top-border"></div>
  <div class="brand-row">
    <div class="brand">{{brand}}</div>
    <div class="page">{{pageOf}}</div>
  </div>
  <div class="center">
    <div class="eyebrow">{{eyebrow}}</div>
    <div class="gold-rule"></div>
    <div class="headline">{{headlineMain}}<br><span class="headline-italic">{{headlineItalic}}</span></div>
    <div class="ornament">— ✦ —</div>
    <div class="body">{{body}}</div>
    <div class="btn">{{buttonLabel}}</div>
  </div>
  <div class="bottom-border"></div>
</body></html>
