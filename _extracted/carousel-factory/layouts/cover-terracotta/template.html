<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#f5ede3;font-family:"Lato",sans-serif;color:#1e1209;-webkit-font-smoothing:antialiased;}
  .arch-bg{position:absolute;top:0;left:0;right:0;height:820px;background:#c4541f;clip-path:ellipse(600px 820px at 50% 0);}
  .texture{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,0.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(0,0,0,0.06) 0%,transparent 40%);}
  .author-row{position:absolute;top:60px;left:60px;right:60px;display:flex;align-items:center;justify-content:space-between;z-index:5;}
  .author{font-size:22px;font-weight:700;letter-spacing:0.08em;color:#f5ede3;text-transform:uppercase;}
  .count{font-family:"Playfair Display",serif;font-style:italic;font-size:22px;color:rgba(245,237,227,0.7);}
  .headline{position:absolute;top:140px;left:70px;right:70px;z-index:5;text-align:center;}
  .eyebrow{font-size:20px;font-weight:700;letter-spacing:0.15em;color:rgba(245,237,227,0.75);text-transform:uppercase;margin-bottom:24px;}
  .title{font-family:"Playfair Display",serif;font-size:116px;font-weight:900;line-height:0.92;letter-spacing:-2px;color:#f5ede3;margin-bottom:0;}
  .title-italic{font-style:italic;color:#ffe8b0;}
  .card{position:absolute;bottom:80px;left:60px;right:60px;background:#f5ede3;border-radius:28px;padding:54px 60px;box-shadow:0 30px 80px rgba(30,18,9,0.18);}
  .sub{font-family:"Playfair Display",serif;font-style:italic;font-size:34px;line-height:1.3;color:#1e1209;margin-bottom:28px;}
  .pill-row{display:flex;align-items:center;gap:16px;}
  .pill{display:inline-block;padding:12px 28px;background:#c4541f;border-radius:50px;font-size:20px;font-weight:700;color:#f5ede3;letter-spacing:0.04em;}
  .slides-note{font-size:20px;color:rgba(30,18,9,0.45);}
</style></head>
<body>
  <div class="arch-bg"></div>
  <div class="texture"></div>
  <div class="author-row">
    <div class="author">{{author}}</div>
    <div class="count">{{slideCount}} ideas</div>
  </div>
  <div class="headline">
    <div class="eyebrow">{{eyebrow}}</div>
    <div class="title">{{titleLine1}}<br><span class="title-italic">{{titleLine2}}</span><br>{{titleLine3}}</div>
  </div>
  <div class="card">
    <div class="sub">{{subtitle}}</div>
    <div class="pill-row">
      <div class="pill">{{ctaLabel}}</div>
      <div class="slides-note">{{handle}}</div>
    </div>
  </div>
</body></html>
