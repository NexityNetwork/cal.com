<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,wght@1,400;1,600;1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a;font-family:"Inter",sans-serif;color:#f5f5f5;-webkit-font-smoothing:antialiased}
.outline{position:absolute;inset:24px;border:1px solid rgba(255,255,255,0.05);border-radius:32px;pointer-events:none}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.025) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.glow-bg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:920px;height:560px;background:radial-gradient(ellipse at center,rgba(255,87,34,0.18) 0%,transparent 65%);filter:blur(40px);pointer-events:none}
.tag-pill{position:absolute;top:64px;right:64px;display:inline-flex;align-items:center;gap:8px;padding:10px 22px;background:rgba(255,87,34,0.08);border:1px solid rgba(255,87,34,0.4);border-radius:50px;color:#ff7a3c;font-size:18px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase}
.tag-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:#ff7a3c;box-shadow:0 0 12px #ff7a3c}
.center{position:absolute;top:50%;left:80px;right:80px;transform:translateY(-50%);text-align:center}
.eyebrow{font-family:"Fraunces",serif;font-style:italic;font-weight:400;font-size:36px;letter-spacing:-0.5px;color:#9ca3af;margin-bottom:32px}
.headline{font-family:"Inter",sans-serif;font-size:120px;font-weight:700;line-height:0.95;letter-spacing:-3px;color:#ffffff;margin-bottom:24px}
.headline .glow{color:#ff7a3c;text-shadow:0 0 28px rgba(255,122,60,0.6),0 0 50px rgba(255,87,34,0.35)}
.sub{font-family:"Fraunces",serif;font-style:italic;font-weight:400;font-size:40px;line-height:1.3;color:#cdd5df;max-width:780px;margin:36px auto 0}
.indicators{position:absolute;bottom:80px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.action-row{display:inline-flex;align-items:center;gap:14px}
.action-chip{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:50px;color:#cdd5df;font-size:18px;font-weight:500}
.action-chip .glyph{width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:16px}
.action-chip.primary{background:#ff7a3c;border-color:#ff7a3c;color:#0a0a0a;font-weight:700;box-shadow:0 0 24px rgba(255,122,60,0.4)}
.pageOf{font-size:18px;color:#525252;font-weight:500;letter-spacing:0.06em}
</style></head>
<body>
<div class="outline"></div>
<div class="dots"></div>
<div class="glow-bg"></div>
<div class="tag-pill">{{tag}}</div>
<div class="center">
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="headline">{{headlineMain}}<br><span class="glow">{{headlineGlow}}</span></div>
  <div class="sub">{{sublineItalic}}</div>
</div>
<div class="indicators">
  <div class="pageOf">{{pageOf}}</div>
  <div class="action-row">
    <div class="action-chip"><span class="glyph">🔖</span>save</div>
    <div class="action-chip"><span class="glyph">↗</span>share</div>
  </div>
</div>
</body></html>
