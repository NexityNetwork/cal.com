<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,wght@1,400;1,700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a;font-family:"Inter",sans-serif;color:#fafafa;-webkit-font-smoothing:antialiased}
.dotgrid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.06) 1px,transparent 1px);background-size:24px 24px;opacity:0.5}
.outline{position:absolute;inset:24px;border:1px solid rgba(255,255,255,0.06);border-radius:28px;pointer-events:none;z-index:10}
.top-row{position:absolute;top:64px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.brand{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;background:rgba(255,90,40,0.12);border:1px solid rgba(255,90,40,0.4);border-radius:50px;font-size:16px;font-weight:700;color:#ff7a3c;letter-spacing:0.1em;text-transform:uppercase}
.brand .dot{width:10px;height:10px;background:#ff5722;border-radius:50%;box-shadow:0 0 12px #ff5722}
.handle-text{font-family:"Inter",sans-serif;font-size:16px;color:#71717a;font-weight:500}
.preline{position:absolute;top:200px;left:80px;right:80px;font-family:"Fraunces",serif;font-style:italic;font-size:42px;color:#a3a3a3;font-weight:400}
.pixel-block{position:absolute;top:280px;left:80px;right:80px}
.pixel-row{font-family:"Press Start 2P",monospace;font-size:108px;line-height:1.1;color:#ff7a3c;text-shadow:0 0 60px rgba(255,90,40,0.4);letter-spacing:2px;display:block}
.pixel-row.alt{color:#fafafa}
.post-line{position:absolute;top:720px;left:80px;right:80px;font-family:"Fraunces",serif;font-style:italic;font-size:38px;color:#a3a3a3;font-weight:400;line-height:1.3}
.tile-row{position:absolute;bottom:200px;left:80px;right:80px;display:flex;align-items:center;gap:16px}
.tile-row .chip{width:64px;height:64px;border-radius:14px;background:#fafafa;display:flex;align-items:center;justify-content:center;padding:11px}
.tile-row .chip svg{width:100%;height:100%}
.tile-row .stat{margin-left:auto;display:inline-flex;flex-direction:column;align-items:flex-end}
.tile-row .stat .v{font-family:"Press Start 2P",monospace;font-size:32px;color:#ff7a3c;line-height:1}
.tile-row .stat .l{font-size:14px;color:#71717a;letter-spacing:0.08em;text-transform:uppercase;margin-top:6px}
.bottom-row{position:absolute;bottom:64px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.bottom-row .pg{font-size:16px;color:#71717a;letter-spacing:0.06em}
.bottom-row .swipe{display:inline-flex;align-items:center;gap:12px;font-size:16px;font-weight:700;color:#fafafa;text-transform:uppercase;letter-spacing:0.1em}
.bottom-row .swipe .a{width:42px;height:42px;background:#ff7a3c;color:#0a0a0a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
</style></head>
<body>
<div class="dotgrid"></div>
<div class="outline"></div>
<div class="top-row"><div class="brand"><div class="dot"></div><span>{{brandTag}}</span></div><div class="handle-text">{{handle}}</div></div>
<div class="preline">{{preLine}}</div>
<div class="pixel-block">
  <span class="pixel-row">{{pixelLine1}}</span>
  <span class="pixel-row alt">{{pixelLine2}}</span>
</div>
<div class="post-line">{{postLine}}</div>
<div class="tile-row">
  <div class="chip">{{iconSvg1}}</div>
  <div class="chip">{{iconSvg2}}</div>
  <div class="chip">{{iconSvg3}}</div>
  <div class="chip">{{iconSvg4}}</div>
  <div class="chip">{{iconSvg5}}</div>
  <div class="stat"><div class="v">{{statValue}}</div><div class="l">{{statLabel}}</div></div>
</div>
<div class="bottom-row"><div class="pg">{{pageOf}}</div><div class="swipe">{{swipeLabel}}<div class="a">→</div></div></div>
</body></html>
