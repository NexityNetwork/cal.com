<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#f7f5ef;font-family:"Inter",sans-serif;color:#2c2c2c;-webkit-font-smoothing:antialiased;}
  .split-bottom{position:absolute;bottom:0;left:0;right:0;height:380px;background:#2c2c2c;clip-path:polygon(0 22%,100% 0,100% 100%,0 100%);}
  .dot-circle{position:absolute;top:40px;left:40px;width:180px;height:180px;border-radius:50%;background-image:radial-gradient(circle,#2c2c2c 2.5px,transparent 3px);background-size:22px 22px;}
  .center{position:absolute;top:50%;left:80px;right:80px;transform:translateY(-50%);text-align:center;z-index:2;}
  .eyebrow{font-size:22px;font-weight:700;letter-spacing:0.2em;color:#2c2c2c;text-transform:uppercase;margin-bottom:36px;}
  .display{font-family:"Oswald",sans-serif;font-weight:700;font-size:140px;line-height:0.94;letter-spacing:-0.005em;color:#2c2c2c;text-transform:uppercase;margin-bottom:40px;}
  .body{font-size:28px;font-weight:500;color:#2c2c2c;line-height:1.4;padding:0 60px;margin-bottom:64px;}
  .cta-pill{display:inline-flex;align-items:center;gap:18px;padding:24px 48px;background:#2c2c2c;color:#f7f5ef;border-radius:48px;font-family:"Oswald",sans-serif;font-size:30px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;}
  .handle-pill{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);height:64px;padding:0 30px;background:#f7f5ef;border:1.5px solid #f7f5ef;border-radius:32px;display:inline-flex;align-items:center;gap:14px;font-size:24px;font-weight:500;color:#2c2c2c;z-index:3;}
  .handle-pill::before,.handle-pill::after{content:"✱";font-size:20px;}
</style></head>
<body>
  <div class="dot-circle"></div>
  <div class="split-bottom"></div>
  <div class="center">
    <div class="eyebrow">{{eyebrow}}</div>
    <div class="display">{{headline}}</div>
    <div class="body">{{body}}</div>
    <div class="cta-pill">{{buttonLabel}} ▶</div>
  </div>
  <div class="handle-pill">{{handle}}</div>
</body></html>
