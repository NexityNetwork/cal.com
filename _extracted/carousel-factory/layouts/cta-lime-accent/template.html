<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a;font-family:"Inter",sans-serif;color:#fafafa;-webkit-font-smoothing:antialiased}
.outline{position:absolute;inset:24px;border:1px solid rgba(255,255,255,0.06);border-radius:28px;pointer-events:none;z-index:10}
.glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:780px;height:780px;border-radius:50%;background:radial-gradient(circle,rgba(198,240,74,0.18) 0%,transparent 60%);pointer-events:none}
.top-row{position:absolute;top:64px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.brand-pill{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;background:#c6f04a;color:#0a0a0a;border-radius:50px;font-size:16px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase}
.handle-text{font-family:"JetBrains Mono",monospace;font-size:16px;color:#71717a}
.center{position:absolute;top:50%;left:80px;right:80px;transform:translateY(-50%);text-align:center}
.eyebrow{font-size:22px;font-weight:700;letter-spacing:0.18em;color:#c6f04a;margin-bottom:30px;text-transform:uppercase}
.headline{font-size:148px;font-weight:900;line-height:0.9;letter-spacing:-4px;margin-bottom:40px}
.callout{display:inline-block;background:#c6f04a;color:#0a0a0a;padding:6px 22px;border-radius:18px;letter-spacing:-3px}
.sub{font-size:28px;font-weight:400;color:#a3a3a3;line-height:1.5;max-width:780px;margin:0 auto 44px}
.btn-row{display:flex;justify-content:center;gap:18px;margin-bottom:36px}
.btn-primary{padding:24px 50px;background:#c6f04a;color:#0a0a0a;border-radius:14px;font-size:24px;font-weight:800;letter-spacing:-0.3px}
.btn-ghost{padding:24px 36px;background:transparent;border:1.5px solid rgba(255,255,255,0.2);color:#fafafa;border-radius:14px;font-size:22px;font-weight:600}
.stack-row{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}
.stack-row .chip{width:50px;height:50px;border-radius:12px;background:#fafafa;display:flex;align-items:center;justify-content:center;padding:9px}
.stack-row .chip svg{width:100%;height:100%}
.bottom-row{position:absolute;bottom:64px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.bottom-row .pg{font-family:"JetBrains Mono",monospace;font-size:16px;color:#71717a}
.bottom-row .note{font-size:16px;color:#a3a3a3}
</style></head>
<body>
<div class="glow"></div>
<div class="outline"></div>
<div class="top-row"><div class="brand-pill">{{brandTag}}</div><div class="handle-text">{{handle}}</div></div>
<div class="center">
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="headline">{{ctaLine1}}<br><span class="callout">{{ctaCallout}}</span></div>
  <div class="sub">{{ctaBody}}</div>
  <div class="btn-row"><div class="btn-primary">{{btnPrimary}}</div><div class="btn-ghost">{{btnGhost}}</div></div>
  <div class="stack-row">
    <div class="chip">{{iconSvg1}}</div>
    <div class="chip">{{iconSvg2}}</div>
    <div class="chip">{{iconSvg3}}</div>
    <div class="chip">{{iconSvg4}}</div>
    <div class="chip">{{iconSvg5}}</div>
    <div class="chip">{{iconSvg6}}</div>
  </div>
</div>
<div class="bottom-row"><div class="pg">{{pageOf}}</div><div class="note">{{footerNote}}</div></div>
</body></html>
