<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#ffffff;font-family:"Inter",sans-serif;color:#1d1d1d;-webkit-font-smoothing:antialiased}
.top-row{position:absolute;top:60px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.num{font-size:22px;font-weight:600;color:#4b5565;letter-spacing:0.06em}
.handle{font-size:22px;font-weight:500;color:#4b5565}
.hero{position:absolute;top:140px;left:80px;right:80px;background:#fafafa;border:1.5px solid #e5e7eb;border-radius:30px;padding:42px 50px;display:flex;align-items:center;gap:28px}
.hero .ico{width:128px;height:128px;border-radius:22px;background:#ffffff;border:1.5px solid #e5e7eb;padding:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.hero .ico svg{width:100%;height:100%}
.hero .info .name{font-size:64px;font-weight:800;color:#1d1d1d;line-height:1;letter-spacing:-1.5px;margin-bottom:8px}
.hero .info .tagline{font-size:24px;font-weight:500;color:#4b5565}
.desc{position:absolute;top:400px;left:80px;right:80px;font-size:34px;font-weight:400;color:#1d1d1d;line-height:1.4}
.bullets{position:absolute;top:580px;left:80px;right:80px;display:flex;flex-direction:column;gap:18px}
.bullet{display:flex;align-items:flex-start;gap:18px;padding:22px 26px;background:#fafafa;border-radius:14px;border-left:5px solid {{accentColor}}}
.bullet .ck{width:36px;height:36px;background:{{accentColor}};color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.bullet .text{font-size:26px;font-weight:500;color:#1d1d1d;line-height:1.35;padding-top:2px}
.stack-row{position:absolute;bottom:140px;left:80px;right:80px;text-align:center}
.stack-label{font-size:18px;font-weight:600;color:#4b5565;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:18px}
.stack-icons{display:flex;align-items:center;justify-content:center;gap:14px}
.stack-icons .chip{width:56px;height:56px;border-radius:12px;background:#fafafa;border:1.5px solid #e5e7eb;padding:9px;display:flex;align-items:center;justify-content:center}
.stack-icons .chip svg{width:100%;height:100%}
.cta-bottom{position:absolute;bottom:60px;left:80px;right:80px;text-align:center;font-size:22px;font-weight:600;color:#4b5565}
</style></head>
<body>
<div class="top-row"><div class="num">{{slideLabel}}</div><div class="handle">{{handle}}</div></div>
<div class="hero">
  <div class="ico">{{iconSvg1}}</div>
  <div class="info">
    <div class="name">{{toolName}}</div>
    <div class="tagline">{{toolTagline}}</div>
  </div>
</div>
<div class="desc">{{description}}</div>
<div class="bullets">
  <div class="bullet"><div class="ck">✓</div><div class="text">{{bullet1}}</div></div>
  <div class="bullet"><div class="ck">✓</div><div class="text">{{bullet2}}</div></div>
  <div class="bullet"><div class="ck">✓</div><div class="text">{{bullet3}}</div></div>
</div>
<div class="stack-row">
  <div class="stack-label">{{stackLabel}}</div>
  <div class="stack-icons">
    <div class="chip">{{iconSvg2}}</div>
    <div class="chip">{{iconSvg3}}</div>
    <div class="chip">{{iconSvg4}}</div>
    <div class="chip">{{iconSvg5}}</div>
    <div class="chip">{{iconSvg6}}</div>
  </div>
</div>
<div class="cta-bottom">{{ctaBottom}}</div>
</body></html>
