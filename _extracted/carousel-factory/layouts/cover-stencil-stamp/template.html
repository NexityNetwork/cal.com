<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Anton&family=Bebas+Neue&family=Fraunces:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a;font-family:"Inter",sans-serif;color:#fafafa;-webkit-font-smoothing:antialiased}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.05) 1px,transparent 1px);background-size:5px 5px;opacity:0.4;pointer-events:none}
.outline{position:absolute;inset:24px;border:1px solid rgba(255,255,255,0.06);border-radius:28px;pointer-events:none;z-index:10}
.starburst{position:absolute;color:#ff7a3c;font-weight:900;line-height:1;pointer-events:none;text-shadow:0 0 24px rgba(255,122,60,0.4)}
.s1{top:120px;right:80px;font-size:72px;transform:rotate(15deg)}
.s2{top:880px;left:80px;font-size:52px;transform:rotate(-10deg)}
.s3{top:580px;right:130px;font-size:36px;transform:rotate(28deg)}
.top-row{position:absolute;top:60px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
.brand{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;background:rgba(255,122,60,0.12);border:1px solid rgba(255,122,60,0.5);color:#ff7a3c;border-radius:50px;font-size:16px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase}
.brand .dot{width:10px;height:10px;background:#ff5722;border-radius:50%;box-shadow:0 0 12px #ff5722}
.handle{font-size:16px;color:#71717a;font-weight:500}
.preline{position:absolute;top:200px;left:60px;right:60px;font-family:"Fraunces",serif;font-style:italic;font-size:40px;color:#9ca3af;font-weight:400}
.headline{position:absolute;top:280px;left:60px;right:60px;font-family:"Anton",sans-serif;font-weight:400;line-height:0.9;color:#fafafa;letter-spacing:1px;text-transform:uppercase}
.headline .line{display:block;font-size:200px}
.headline .stamp{display:inline-block;color:#ff7a3c;text-shadow:6px 6px 0 #0a0a0a,8px 8px 0 rgba(255,122,60,0.3);position:relative}
.headline .outline-stamp{display:inline-block;color:transparent;-webkit-text-stroke:3px #fafafa}
.postline{position:absolute;top:820px;left:60px;right:60px;font-family:"Fraunces",serif;font-style:italic;font-size:36px;color:#9ca3af;line-height:1.3}
.summary-card{position:absolute;bottom:200px;left:60px;right:60px;padding:24px 32px;background:#161616;border:1px solid rgba(255,255,255,0.08);border-radius:18px;display:flex;align-items:center;gap:22px}
.summary-card .sb-eyebrow{font-family:"Anton",sans-serif;font-size:18px;color:#ff7a3c;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:4px}
.summary-card .sb-text{font-size:22px;font-weight:600;color:#fafafa;line-height:1.3}
.summary-card .info{flex:1}
.summary-card .chips{display:flex;align-items:center;gap:10px}
.summary-card .chip{width:44px;height:44px;border-radius:10px;background:#fafafa;display:flex;align-items:center;justify-content:center;padding:7px}
.summary-card .chip svg{width:100%;height:100%}
.bottom-row{position:absolute;bottom:60px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
.bottom-row .pg{padding:10px 18px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:50px;font-family:"JetBrains Mono",monospace;font-size:18px;font-weight:600;color:#cdd5df;letter-spacing:0.08em}
.bottom-row .swipe{display:inline-flex;align-items:center;gap:12px;font-family:"Anton",sans-serif;font-size:22px;font-weight:400;color:#fafafa;letter-spacing:0.1em;text-transform:uppercase}
.bottom-row .swipe .a{width:46px;height:46px;background:#ff7a3c;color:#0a0a0a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}
</style></head>
<body>
<div class="grain"></div>
<div class="outline"></div>
<div class="starburst s1">✱</div>
<div class="starburst s2">✱</div>
<div class="starburst s3">✱</div>
<div class="top-row"><div class="brand"><div class="dot"></div><span>{{brandTag}}</span></div><div class="handle">{{handle}}</div></div>
<div class="preline">{{preLine}}</div>
<div class="headline">
  <span class="line">{{titleLine1}}</span>
  <span class="line"><span class="stamp">{{titleStamp}}</span></span>
  <span class="line"><span class="outline-stamp">{{titleOutline}}</span></span>
</div>
<div class="postline">{{postLine}}</div>
<div class="summary-card">
  <div class="info">
    <div class="sb-eyebrow">{{cardEyebrow}}</div>
    <div class="sb-text">{{cardText}}</div>
  </div>
  <div class="chips">
    <div class="chip">{{iconSvg1}}</div>
    <div class="chip">{{iconSvg2}}</div>
    <div class="chip">{{iconSvg3}}</div>
    <div class="chip">{{iconSvg4}}</div>
  </div>
</div>
<div class="bottom-row"><div class="pg">{{pageOf}}</div><div class="swipe">{{swipeLabel}}<div class="a">→</div></div></div>
</body></html>
