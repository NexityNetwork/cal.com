<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,wght@0,400;1,400;1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f5efe2;font-family:"Inter",sans-serif;color:#1a1410;-webkit-font-smoothing:antialiased}
.top-row{position:absolute;top:60px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
.brand-pill{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;background:#1a1410;color:#f5efe2;border-radius:50px;font-size:16px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase}
.handle{font-size:16px;color:#5a4a3a;font-weight:500}
.center{position:absolute;top:48%;left:60px;right:60px;transform:translateY(-50%);text-align:center}
.eyebrow{font-family:"Fraunces",serif;font-style:italic;font-size:36px;color:#5a4a3a;margin-bottom:18px}
.title{font-size:148px;font-weight:900;line-height:0.9;letter-spacing:-4px;color:#1a1410;margin-bottom:40px}
.title em{font-family:"Fraunces",serif;font-style:italic;font-weight:400;color:#5a4a3a}
.title .accent{color:#d97757}
.body{font-size:28px;font-weight:500;line-height:1.5;color:#5a4a3a;max-width:780px;margin:0 auto 40px}
.btn-row{display:flex;justify-content:center;gap:16px;margin-bottom:36px}
.btn-primary{padding:24px 50px;background:#d97757;color:#fff;border-radius:14px;font-size:22px;font-weight:800;box-shadow:5px 5px 0 #1a1410}
.btn-ghost{padding:24px 36px;background:#1a1410;color:#f5efe2;border-radius:14px;font-size:22px;font-weight:700}
.stack-card{background:#1a1410;color:#f5efe2;border-radius:18px;padding:20px 28px;display:inline-flex;align-items:center;gap:14px}
.stack-card .lbl{font-family:"Fraunces",serif;font-style:italic;font-size:16px;color:#e8a87c}
.stack-card .chips{display:flex;align-items:center;gap:10px}
.stack-card .chip{width:42px;height:42px;border-radius:10px;background:#fafafa;display:flex;align-items:center;justify-content:center;padding:7px}
.stack-card .chip svg{width:100%;height:100%}
.bottom-row{position:absolute;bottom:60px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
.bottom-row .pg{font-size:16px;color:#5a4a3a;font-weight:500}
.bottom-row .signoff{font-family:"Fraunces",serif;font-style:italic;font-size:18px;color:#5a4a3a}
</style></head>
<body>
<div class="top-row"><div class="brand-pill">{{brandTag}}</div><div class="handle">{{handle}}</div></div>
<div class="center">
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="title">{{titleLine1}}<br><span class="accent">{{titleAccent}}</span> <em>{{titleItalic}}</em></div>
  <div class="body">{{body}}</div>
  <div class="btn-row"><div class="btn-primary">{{btnPrimary}}</div><div class="btn-ghost">{{btnGhost}}</div></div>
  <div class="stack-card">
    <div class="lbl">{{stackLabel}}</div>
    <div class="chips"><div class="chip">{{iconSvg1}}</div><div class="chip">{{iconSvg2}}</div><div class="chip">{{iconSvg3}}</div><div class="chip">{{iconSvg4}}</div><div class="chip">{{iconSvg5}}</div><div class="chip">{{iconSvg6}}</div></div>
  </div>
</div>
<div class="bottom-row"><div class="pg">{{pageOf}}</div><div class="signoff">{{signoff}}</div></div>
</body></html>
