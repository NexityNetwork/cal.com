<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f1f1f1;font-family:"Inter",sans-serif;color:#37474f;-webkit-font-smoothing:antialiased}
.orb-bg{position:absolute;top:-80px;right:-100px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#ffe8b8 22%,#c4541f 58%,#5a2410 100%);opacity:0.25;filter:blur(2px)}
.body{position:absolute;top:230px;left:100px;right:100px;font-family:"Inter",sans-serif;font-size:88px;font-weight:500;line-height:1.05;letter-spacing:-2px;color:#37474f}
.tile{position:absolute;bottom:200px;left:100px;right:100px;padding:30px 36px;background:#ffffff;border-radius:18px;display:flex;align-items:center;gap:24px}
.tile-orb{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#ffe8b8 22%,#c4541f 58%,#5a2410 100%);box-shadow:0 6px 16px rgba(196,84,31,0.35),inset -14px -16px 22px rgba(0,0,0,0.18);flex-shrink:0}
.tile-text .lbl{font-size:18px;font-weight:600;color:#c4541f;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px}
.tile-text .body-inline{font-size:24px;font-weight:500;color:#37474f;line-height:1.35;position:static}
.bottom{position:absolute;bottom:64px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
.pill{padding:14px 32px;background:#37474f;color:#f1f1f1;border-radius:50px;font-size:18px;font-weight:400}
</style></head>
<body>
<div class="orb-bg"></div>
<div class="body">{{bodyLine1}}<br>{{bodyLine2}}<br>{{bodyLine3}}<br>{{bodyLine4}}<br>{{bodyLine5}}</div>
<div class="tile"><div class="tile-orb"></div><div class="tile-text"><div class="lbl">{{tipLabel}}</div><div class="body-inline">{{tipBody}}</div></div></div>
<div class="bottom"><div class="pill">{{pageOf}}</div><div class="pill">Swipe ⓘ</div></div>
</body></html>
