<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f8fafc;font-family:"Inter",sans-serif;color:#121926;-webkit-font-smoothing:antialiased}
.center{position:absolute;top:50%;left:80px;right:80px;transform:translateY(-50%);text-align:center}
.eyebrow{font-size:24px;font-weight:700;letter-spacing:0.2em;color:#3457d5;margin-bottom:30px;text-transform:uppercase}
.headline{font-size:96px;font-weight:600;line-height:1;letter-spacing:-2px;margin-bottom:36px;color:#121926}
.body{font-size:34px;font-weight:500;line-height:1.4;color:#4b5563;max-width:840px;margin:0 auto 48px}
.btn{display:inline-block;padding:24px 56px;background:#3457d5;color:#fff;border-radius:14px;font-size:28px;font-weight:600}
.foot{position:absolute;bottom:75px;left:100px;right:100px;display:flex;justify-content:space-between;align-items:center}
.foot .num{font-size:48px;font-weight:400;color:#4b5565}
.foot .handle{font-size:32px;color:#4b5565}
</style></head>
<body>
<div class="center">
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="headline">{{headlineLine1}}<br>{{headlineLine2}}</div>
  <div class="body">{{body}}</div>
  <div class="btn">{{buttonLabel}} →</div>
</div>
<div class="foot"><div class="num">{{number}}</div><div class="handle">{{handle}}</div></div>
</body></html>
