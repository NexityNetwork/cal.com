<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a;font-family:"Inter",sans-serif;color:#fafafa;-webkit-font-smoothing:antialiased}
.outline{position:absolute;inset:24px;border:1px solid rgba(255,255,255,0.06);border-radius:28px;pointer-events:none;z-index:10}
.top-row{position:absolute;top:64px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.brand-pill{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:50px;font-size:16px;font-weight:600;color:#a3a3a3;letter-spacing:0.04em}
.brand-pill .star{width:14px;height:14px;background:#c6f04a;border-radius:50%;box-shadow:0 0 12px #c6f04a}
.handle-text{font-family:"JetBrains Mono",monospace;font-size:16px;color:#71717a;font-weight:500}
.headline-block{position:absolute;top:50%;left:80px;right:80px;transform:translateY(-52%)}
.eyebrow{font-size:22px;font-weight:700;letter-spacing:0.16em;color:#c6f04a;text-transform:uppercase;margin-bottom:24px}
.headline{font-size:140px;font-weight:900;line-height:0.92;letter-spacing:-4px;color:#fafafa}
.callout{display:inline-block;background:#c6f04a;color:#0a0a0a;padding:6px 18px;border-radius:14px;letter-spacing:-3px}
.tag-row{position:absolute;bottom:200px;left:80px;right:80px;display:flex;gap:10px;flex-wrap:wrap}
.tag-row .t{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:rgba(198,240,74,0.1);border:1px solid rgba(198,240,74,0.3);color:#c6f04a;border-radius:50px;font-size:16px;font-weight:600}
.tag-row .t .dot{width:8px;height:8px;background:#c6f04a;border-radius:50%}
.icon-strip{position:absolute;bottom:130px;left:80px;right:80px;display:flex;align-items:center;gap:14px}
.icon-strip .chip{width:54px;height:54px;border-radius:14px;background:#fafafa;display:flex;align-items:center;justify-content:center;padding:9px;box-shadow:0 6px 20px rgba(0,0,0,0.4)}
.icon-strip .chip svg{width:100%;height:100%}
.bottom-row{position:absolute;bottom:64px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.bottom-row .pg{font-family:"JetBrains Mono",monospace;font-size:16px;color:#71717a}
.bottom-row .arrow{display:inline-flex;align-items:center;gap:10px;font-size:18px;font-weight:600;color:#fafafa}
.bottom-row .arrow .a{width:42px;height:42px;background:#c6f04a;color:#0a0a0a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
</style></head>
<body>
<div class="outline"></div>
<div class="top-row"><div class="brand-pill"><div class="star"></div><span>{{brandTag}}</span></div><div class="handle-text">{{handle}}</div></div>
<div class="headline-block">
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="headline">{{titleLine1}}<br><span class="callout">{{titleCallout}}</span><br>{{titleLine3}}</div>
</div>
<div class="icon-strip">
  <div class="chip">{{iconSvg1}}</div>
  <div class="chip">{{iconSvg2}}</div>
  <div class="chip">{{iconSvg3}}</div>
  <div class="chip">{{iconSvg4}}</div>
  <div class="chip">{{iconSvg5}}</div>
  <div class="chip">{{iconSvg6}}</div>
</div>
<div class="bottom-row"><div class="pg">{{pageOf}}</div><div class="arrow">{{swipeLabel}}<div class="a">→</div></div></div>
</body></html>
