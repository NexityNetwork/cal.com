<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f7f2ea;font-family:"Inter",sans-serif;color:#0e0e0e;-webkit-font-smoothing:antialiased}
.page{position:absolute;top:80px;left:80px;font-size:20px;font-weight:700;letter-spacing:0.06em}
.author{position:absolute;top:80px;right:80px;display:flex;align-items:center;gap:14px}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.author-info{text-align:right}
.author-info .name{font-size:18px;font-weight:700;line-height:1.2}
.author-info .handle{font-size:14px;color:#7a7464;line-height:1.2}
.specimen{position:absolute;top:170px;left:50%;transform:translateX(-50%);font-family:"Cormorant Garamond",serif;font-size:560px;line-height:0.9;color:#0e0e0e;font-weight:700;position:absolute;display:flex;align-items:flex-end;gap:0}
.spec-1{font-style:normal}
.spec-2{font-style:italic;color:#d65f3e;position:relative}
.spec-2::after{content:"";position:absolute;top:55%;left:-10%;right:-10%;height:8px;background:#d65f3e;transform:rotate(-12deg)}
.title{position:absolute;top:790px;left:80px;right:80px;text-align:center;font-size:84px;font-weight:800;line-height:1.0;letter-spacing:-1.8px}
.title .em{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:700;color:#d65f3e}
.body{position:absolute;top:1020px;left:80px;right:80px;text-align:center;font-size:26px;font-weight:400;line-height:1.5;color:#3a3530;max-width:840px;margin:0 auto}
.bottom{position:absolute;bottom:60px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.handle{font-size:18px;font-weight:600;color:#7a7464}
.swipe{padding:12px 24px;background:#0e0e0e;color:#fff;border-radius:50px;font-size:18px;font-weight:600}
</style></head>
<body>
<div class="page">{{pageOf}}</div>
<div class="author"><div class="avatar">{{authorInitials}}</div><div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div></div>
<div class="specimen"><span class="spec-1">{{specimen1}}</span><span class="spec-2">{{specimen2}}</span></div>
<div class="title">{{titleLine1}}<br><span class="em">{{titleItalic}}</span></div>
<div class="body">{{body}}</div>
<div class="bottom"><div class="handle">{{handle}}</div><div class="swipe">Swipe →</div></div>
</body></html>
