<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f5f1e8;font-family:"Inter",sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.page{position:absolute;top:80px;left:80px;font-size:20px;font-weight:700}
.author{position:absolute;top:80px;right:80px;display:flex;align-items:center;gap:14px}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.author-info{text-align:right}
.author-info .name{font-size:18px;font-weight:700;line-height:1.2}
.author-info .handle{font-size:14px;color:#7a7464;line-height:1.2}
.eyebrow{position:absolute;top:200px;left:80px;font-size:22px;font-weight:700;letter-spacing:0.16em;color:#c4541f;text-transform:uppercase}
.title{position:absolute;top:250px;left:80px;right:80px;font-size:108px;font-weight:800;line-height:0.98;letter-spacing:-2.5px}
.title .accent{color:#c4541f}
.stats{position:absolute;top:620px;left:80px;right:80px;display:flex;flex-direction:column;gap:0;background:#fff;border:2px solid #1a1a1a;border-radius:18px;overflow:hidden}
.stat-row{display:flex;align-items:center;padding:24px 32px;border-bottom:1px solid #e6dfd0}
.stat-row:last-child{border-bottom:none}
.stat-row.head{background:#1a1a1a;color:#fff;font-size:18px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase}
.stat-label{flex:1;font-size:24px;font-weight:600;color:#1a1a1a}
.stat-bar{flex:1.2;height:18px;background:#e6dfd0;border-radius:9px;overflow:hidden;margin:0 24px}
.stat-bar-fill{height:100%;background:#c4541f;border-radius:9px}
.stat-val{width:120px;text-align:right;font-size:28px;font-weight:800;color:#c4541f}
.bottom{position:absolute;bottom:60px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.handle{font-size:18px;font-weight:600;color:#7a7464}
.swipe{padding:14px 28px;background:#1a1a1a;color:#fff;border-radius:50px;font-size:18px;font-weight:700}
</style></head>
<body>
<div class="page">{{pageOf}}</div>
<div class="author"><div class="avatar">{{authorInitials}}</div><div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div></div>
<div class="eyebrow">{{eyebrow}}</div>
<div class="title">{{titleLine1}}<br><span class="accent">{{titleAccent}}</span></div>
<div class="stats">
<div class="stat-row head"><div class="stat-label">{{tableHeader}}</div><div class="stat-val">RATE</div></div>
<div class="stat-row"><div class="stat-label">{{row1Label}}</div><div class="stat-bar"><div class="stat-bar-fill" style="width:{{row1Pct}}%"></div></div><div class="stat-val">{{row1Value}}</div></div>
<div class="stat-row"><div class="stat-label">{{row2Label}}</div><div class="stat-bar"><div class="stat-bar-fill" style="width:{{row2Pct}}%"></div></div><div class="stat-val">{{row2Value}}</div></div>
<div class="stat-row"><div class="stat-label">{{row3Label}}</div><div class="stat-bar"><div class="stat-bar-fill" style="width:{{row3Pct}}%"></div></div><div class="stat-val">{{row3Value}}</div></div>
</div>
<div class="bottom"><div class="handle">{{handle}}</div><div class="swipe">Swipe →</div></div>
</body></html>
