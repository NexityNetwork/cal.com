<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#fafafa;font-family:"Inter",sans-serif;color:#1d1d1d;-webkit-font-smoothing:antialiased}
.num{position:absolute;top:74px;left:100px;font-size:48px;font-weight:400;color:#4b5563}
.handle{position:absolute;top:83px;right:100px;font-size:32px;font-weight:400;color:#4b5563}
.title{position:absolute;top:280px;left:100px;right:100px;font-family:"Inter",sans-serif;font-size:128px;font-weight:700;line-height:1.0;letter-spacing:-3px;color:#1d1d1d}
.title .accent{color:#3457d5}
.subtitle{position:absolute;top:760px;left:100px;right:100px;font-size:48px;font-weight:400;color:#4b5563;line-height:1.3}
.stats{position:absolute;bottom:220px;left:100px;right:100px;display:flex;gap:24px}
.stat{flex:1;padding:32px 28px;background:#fff;border-radius:18px;border:1.5px solid #e5e7eb}
.stat .v{font-size:64px;font-weight:700;color:#3457d5;line-height:1;letter-spacing:-2px;margin-bottom:8px}
.stat .l{font-size:20px;font-weight:500;color:#4b5563;line-height:1.3}
.arrow{position:absolute;bottom:85px;left:100px;width:100px;height:100px;background:#3457d5;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px}
.swipe{position:absolute;bottom:115px;right:100px;font-size:24px;font-weight:500;color:#4b5563}
</style></head>
<body>
<div class="num">{{number}}</div>
<div class="handle">{{handle}}</div>
<div class="title">{{titleLine1}} <span class="accent">{{titleAccent}}</span></div>
<div class="subtitle">{{subtitle}}</div>
<div class="stats">
  <div class="stat"><div class="v">{{stat1Val}}</div><div class="l">{{stat1Label}}</div></div>
  <div class="stat"><div class="v">{{stat2Val}}</div><div class="l">{{stat2Label}}</div></div>
  <div class="stat"><div class="v">{{stat3Val}}</div><div class="l">{{stat3Label}}</div></div>
</div>
<div class="arrow">→</div>
<div class="swipe">Swipe to see more →</div>
</body></html>
