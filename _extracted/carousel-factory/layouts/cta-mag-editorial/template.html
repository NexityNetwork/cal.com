<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,400;1,600;1,800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#fafaf7;font-family:"Inter",sans-serif;color:#1a1a18;-webkit-font-smoothing:antialiased}
.frame{position:absolute;inset:0;padding:52px 64px 48px;display:flex;flex-direction:column;gap:0;text-align:center}
.top-bar{display:flex;justify-content:space-between;align-items:center;text-align:left;padding-bottom:14px;border-bottom:2.5px solid #1a1a18}
.brand{font-size:12px;font-weight:800;letter-spacing:0.32em;text-transform:uppercase}
.handle{font-size:13px;color:#d4870f;font-weight:700}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:36px 0}
.eyebrow{font-family:"Playfair Display",serif;font-size:26px;font-style:italic;color:#d4870f;line-height:1}
.cta-title{font-family:"Playfair Display",serif;font-size:110px;font-weight:900;line-height:0.91;letter-spacing:-3.5px;color:#1a1a18}
.cta-title .accent{font-style:italic;color:#d4870f;position:relative;display:inline-block}
.cta-title .accent::after{content:"";position:absolute;left:-4px;right:-4px;bottom:-2px;height:14px;background:#d4870f;opacity:0.3;border-radius:4px;z-index:-1}
.cta-rule{width:60px;height:5px;background:#d4870f;border-radius:2px}
.recap-bar{display:inline-flex;align-items:center;gap:14px;padding:18px 28px;background:#1a1a18;border-radius:10px}
.recap-lbl{font-size:11px;font-weight:700;letter-spacing:0.22em;color:#d4870f;text-transform:uppercase}
.recap-chips{display:flex;gap:8px}
.recap-chips .chip{width:42px;height:42px;border-radius:8px;background:#fafaf7;display:flex;align-items:center;justify-content:center;padding:7px}
.recap-chips .chip svg{width:100%;height:100%}
.cta-body{font-family:"Playfair Display",serif;font-size:21px;font-style:italic;color:#5a5550;line-height:1.5;max-width:760px}
.cta-body em{color:#d4870f;font-style:italic;font-weight:700}
.btn-row{display:flex;justify-content:center;gap:16px;margin-top:6px}
.btn-primary{display:inline-flex;align-items:center;gap:12px;padding:20px 40px;background:#1a1a18;color:#fafaf7;border-radius:10px;font-size:20px;font-weight:800;letter-spacing:-0.2px}
.btn-primary::after{content:"→"}
.btn-ghost{padding:20px 32px;background:transparent;border:2px solid #1a1a18;color:#1a1a18;border-radius:10px;font-family:"Playfair Display",serif;font-style:italic;font-size:20px;font-weight:700}
.bottom-bar{display:flex;justify-content:space-between;align-items:center;text-align:left;margin-top:auto;padding-top:16px;border-top:1.5px solid #d8d4ce}
.pg{font-size:13px;font-weight:800;color:#1a1a18;letter-spacing:0.1em}
.signoff{font-family:"Playfair Display",serif;font-size:16px;font-style:italic;color:#888}
</style></head>
<body>
<div class="frame">
  <div class="top-bar">
    <div class="brand">{{brandTag}}</div>
    <div class="handle">{{handle}}</div>
  </div>
  <div class="center">
    <div class="eyebrow">{{eyebrow}}</div>
    <div class="cta-title">{{ctaLine1}} <span class="accent">{{ctaAccent}}</span><br>{{ctaItalic}}</div>
    <div class="cta-rule"></div>
    <div class="recap-bar">
      <div class="recap-lbl">{{recapLabel}}</div>
      <div class="recap-chips">
        <div class="chip">{{iconSvg1}}</div>
        <div class="chip">{{iconSvg2}}</div>
        <div class="chip">{{iconSvg3}}</div>
        <div class="chip">{{iconSvg4}}</div>
      </div>
    </div>
    <div class="cta-body">{{ctaBody}}</div>
    <div class="btn-row">
      <div class="btn-primary">{{btnPrimary}}</div>
      <div class="btn-ghost">{{btnGhost}}</div>
    </div>
  </div>
  <div class="bottom-bar">
    <div class="pg">{{pageOf}}</div>
    <div class="signoff">{{signoff}}</div>
  </div>
</div>
</body></html>
