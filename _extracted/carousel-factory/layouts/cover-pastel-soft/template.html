<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#eef1ff;font-family:"DM Sans",sans-serif;color:#1a1a2e;-webkit-font-smoothing:antialiased;}
  .blob-1{position:absolute;top:-180px;right:-120px;width:580px;height:580px;background:radial-gradient(circle,#f9c6e0 0%,#c9d6ff 60%,transparent 80%);opacity:0.7;}
  .blob-2{position:absolute;bottom:-100px;left:-60px;width:420px;height:420px;background:radial-gradient(circle,#b5f0da 0%,transparent 70%);opacity:0.6;}
  .top-row{position:absolute;top:56px;left:60px;right:60px;display:flex;align-items:center;justify-content:space-between;z-index:5;}
  .author-chip{display:flex;align-items:center;gap:14px;}
  .avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#c9d6ff,#f9c6e0);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#1a1a2e;}
  .author-info .name{font-size:22px;font-weight:700;color:#1a1a2e;}
  .author-info .handle{font-size:18px;color:rgba(26,26,46,0.5);}
  .count-pill{background:#ffffff;border-radius:40px;padding:10px 22px;font-size:18px;font-weight:600;color:rgba(26,26,46,0.5);box-shadow:0 2px 12px rgba(0,0,0,0.06);}
  .hero-card{position:absolute;top:170px;left:60px;right:60px;background:#ffffff;border-radius:40px;padding:60px 64px 64px;box-shadow:0 20px 60px rgba(100,100,200,0.12);}
  .tag-row{display:flex;align-items:center;gap:12px;margin-bottom:32px;}
  .tag{display:inline-block;padding:10px 22px;border-radius:40px;font-size:18px;font-weight:600;letter-spacing:0.04em;}
  .tag-blue{background:#dde8ff;color:#4060cc;}
  .tag-pink{background:#ffe3f0;color:#cc4080;}
  .title{font-size:96px;font-weight:700;line-height:0.94;letter-spacing:-2px;color:#1a1a2e;margin-bottom:28px;}
  .title em{font-style:italic;color:#7c9cf7;}
  .subtitle{font-size:28px;font-weight:400;line-height:1.45;color:rgba(26,26,46,0.6);max-width:740px;margin-bottom:40px;}
  .cta-chip{display:inline-block;padding:16px 34px;background:linear-gradient(135deg,#7c9cf7,#c77ddd);border-radius:50px;font-size:22px;font-weight:700;color:#ffffff;}
  .swipe{position:absolute;bottom:70px;right:64px;font-size:18px;color:rgba(26,26,46,0.35);}
</style></head>
<body>
  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <div class="top-row">
    <div class="author-chip">
      <div class="avatar">{{authorInitials}}</div>
      <div class="author-info">
        <div class="name">{{authorName}}</div>
        <div class="handle">{{handle}}</div>
      </div>
    </div>
    <div class="count-pill">{{slideCount}} slides</div>
  </div>
  <div class="hero-card">
    <div class="tag-row">
      <div class="tag tag-blue">{{tagBlue}}</div>
      <div class="tag tag-pink">{{tagPink}}</div>
    </div>
    <div class="title">{{titleLine1}}<br><em>{{titleLine2}}</em><br>{{titleLine3}}</div>
    <div class="subtitle">{{subtitle}}</div>
    <div class="cta-chip">{{ctaLabel}} ✦</div>
    <div class="swipe">swipe →</div>
  </div>
</body></html>
