<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #3a4f33;
    font-family: "DM Serif Display", serif;
    color: #f4ecd6;
    -webkit-font-smoothing: antialiased;
  }
  .top-bar {
    position: absolute; top: 80px; left: 80px; right: 80px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: "JetBrains Mono", monospace;
    font-size: 22px; font-weight: 500; letter-spacing: 0.08em;
    color: #f4ecd6;
  }
  .top-bar .brand { text-transform: uppercase; }
  .top-bar .page { text-transform: uppercase; }

  .headline {
    position: absolute; top: 580px; left: 80px; right: 80px;
    font-family: "DM Serif Display", serif;
    font-size: 138px; font-weight: 400;
    line-height: 1.0; color: #f4ecd6;
  }
  .subtitle {
    position: absolute; top: 800px; left: 80px; right: 520px;
    font-family: "JetBrains Mono", monospace;
    font-size: 28px; font-weight: 400; letter-spacing: 0.04em;
    line-height: 1.4; color: #f4ecd6;
  }

  /* Sticker badge bottom-left */
  .sticker {
    position: absolute; bottom: 220px; right: 320px;
    width: 180px; height: 160px;
    background: #d34a2a;
    color: #fbe5c5;
    display: flex; align-items: center; justify-content: center;
    font-family: "DM Serif Display", serif;
    font-style: italic;
    font-size: 36px; line-height: 1;
    border: 3px dashed #fbe5c5;
    border-radius: 100px / 80px;
    transform: rotate(-10deg);
    text-align: center;
    padding: 10px;
  }
  /* Photo card bottom-right */
  .photo-card {
    position: absolute; bottom: 80px; right: 80px;
    width: 320px; height: 360px;
    border-radius: 4px;
    background: linear-gradient(135deg, #c9d5b8 0%, #9aac80 100%);
    overflow: hidden;
  }
  .photo-card::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 30% 40%, rgba(83,107,55,0.4), transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(58,79,51,0.5), transparent 60%);
  }

  /* Handle bottom-left */
  .handle {
    position: absolute; bottom: 80px; left: 80px;
    font-family: "JetBrains Mono", monospace;
    font-size: 22px; font-weight: 500; letter-spacing: 0.06em;
    color: #f4ecd6;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">{{brand}}</div>
    <div class="page">{{pageOf}} &gt;</div>
  </div>

  <div class="headline">{{headline}}</div>
  <div class="subtitle">{{subtitle}}</div>

  <div class="sticker">{{stickerText}}</div>
  <div class="photo-card"></div>

  <div class="handle">{{handle}}</div>
</body>
</html>
