<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#0d1b2a;font-family:"Inter",sans-serif;color:#e2e8f0;-webkit-font-smoothing:antialiased;}
  .grid-lines{position:absolute;inset:0;background-image:linear-gradient(rgba(249,115,22,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(249,115,22,0.05) 1px,transparent 1px);background-size:90px 90px;}
  .glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);width:700px;height:700px;background:radial-gradient(circle,rgba(249,115,22,0.12) 0%,transparent 65%);}
  .brand-bar{position:absolute;top:56px;left:60px;right:60px;display:flex;align-items:center;justify-content:space-between;z-index:5;}
  .brand{font-family:"IBM Plex Mono",monospace;font-size:20px;color:#f97316;}
  .page{font-family:"IBM Plex Mono",monospace;font-size:18px;color:rgba(226,232,240,0.3);}
  .center{position:absolute;top:50%;left:60px;right:60px;transform:translateY(-50%);text-align:center;}
  .terminal-tag{font-family:"IBM Plex Mono",monospace;font-size:22px;color:#f97316;margin-bottom:28px;letter-spacing:0.06em;}
  .headline{font-size:124px;font-weight:900;line-height:0.88;letter-spacing:-3px;margin-bottom:28px;}
  .hl-orange{color:#f97316;}
  .body{font-size:28px;font-weight:400;line-height:1.45;color:rgba(226,232,240,0.6);max-width:700px;margin:0 auto 48px;}
  .btn-row{display:flex;align-items:center;justify-content:center;gap:24px;}
  .btn-primary{display:inline-block;padding:22px 50px;background:#f97316;border-radius:10px;font-size:22px;font-weight:700;color:#0d1b2a;}
  .btn-secondary{font-family:"IBM Plex Mono",monospace;font-size:18px;color:rgba(226,232,240,0.35);}
  .bottom-strip{position:absolute;bottom:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#f97316,#fb923c,#f97316);}
</style></head>
<body>
  <div class="grid-lines"></div>
  <div class="glow"></div>
  <div class="brand-bar">
    <div class="brand">{{brand}}</div>
    <div class="page">{{pageOf}}</div>
  </div>
  <div class="center">
    <div class="terminal-tag">$ {{terminalTag}}</div>
    <div class="headline">{{headLine1}}<br><span class="hl-orange">{{headLine2}}</span></div>
    <div class="body">{{body}}</div>
    <div class="btn-row">
      <div class="btn-primary">{{buttonLabel}} →</div>
      <div class="btn-secondary">// {{secondaryNote}}</div>
    </div>
  </div>
  <div class="bottom-strip"></div>
</body></html>
