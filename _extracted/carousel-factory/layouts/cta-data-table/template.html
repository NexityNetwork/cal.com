<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#fafafa;font-family:"Inter",sans-serif;color:#1d1d1d;-webkit-font-smoothing:antialiased}
.num{position:absolute;top:74px;left:100px;font-size:48px;font-weight:400;color:#4b5563}
.handle{position:absolute;top:83px;right:100px;font-size:32px;font-weight:400;color:#4b5563}
.center{position:absolute;top:50%;left:100px;right:100px;transform:translateY(-50%);text-align:center}
.big-stat{font-size:280px;font-weight:700;color:#3457d5;line-height:1;letter-spacing:-10px;margin-bottom:24px}
.eyebrow{font-size:24px;font-weight:600;letter-spacing:0.2em;color:#1d1d1d;margin-bottom:24px;text-transform:uppercase}
.headline{font-size:80px;font-weight:700;line-height:1;letter-spacing:-2px;margin-bottom:36px}
.body{font-size:32px;font-weight:500;line-height:1.4;color:#4b5563;max-width:840px;margin:0 auto 44px}
.btn{display:inline-block;padding:24px 56px;background:#3457d5;color:#fff;border-radius:50px;font-size:26px;font-weight:600}
.foot{position:absolute;bottom:85px;left:100px;right:100px;display:flex;justify-content:space-between;align-items:center;font-size:20px;color:#4b5563;font-weight:500}
</style></head>
<body>
<div class="num">{{number}}</div>
<div class="handle">{{handle}}</div>
<div class="center">
  <div class="big-stat">{{bigStat}}</div>
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="headline">{{headline}}</div>
  <div class="body">{{body}}</div>
  <div class="btn">{{buttonLabel}} →</div>
</div>
<div class="foot"><div>{{pageOf}}</div><div>Save & Share 🔖</div></div>
</body></html>
