<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f1f1f1;font-family:"Inter",sans-serif;color:#37474f;-webkit-font-smoothing:antialiased}
.center{position:absolute;top:260px;left:120px;right:120px}
.orb{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#ffe8b8 22%,#c4541f 58%,#5a2410 100%);box-shadow:0 22px 56px rgba(196,84,31,0.4),inset -28px -34px 46px rgba(0,0,0,0.2);margin-bottom:40px}
.tagline{font-size:32px;font-weight:400;color:#37474f;line-height:1.4;margin-bottom:54px}
.cta-q{font-size:54px;font-weight:500;color:#37474f;line-height:1.2;margin-bottom:32px}
.follow-btn{display:inline-block;padding:18px 56px;background:#c4541f;color:#fff;border-radius:50px;font-size:24px;font-weight:500}
.bottom{position:absolute;bottom:64px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
.pill{padding:14px 32px;background:#37474f;color:#f1f1f1;border-radius:50px;font-size:18px;font-weight:400}
</style></head>
<body>
<div class="center">
  <div class="orb"></div>
  <div class="tagline">{{tagline}}</div>
  <div class="cta-q">{{ctaQuestion}}</div>
  <div class="follow-btn">Follow {{handle}}</div>
</div>
<div class="bottom"><div class="pill">{{pageOf}}</div><div class="pill">Save 🔖</div></div>
</body></html>
