<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f0ebe1;font-family:"Inter",sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.page{position:absolute;top:80px;left:80px;font-size:18px;font-weight:700;color:#5a5450}
.author{position:absolute;top:80px;right:80px;display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}
.author-info{text-align:right}
.author-info .name{font-size:16px;font-weight:700;line-height:1.2}
.author-info .handle{font-size:13px;color:#7a7464;line-height:1.2}
.center{position:absolute;top:50%;left:80px;right:80px;transform:translateY(-50%);text-align:center}
.shape3d{width:280px;height:280px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#e8d5b8 25%,#c4541f 60%,#7a3210 100%);box-shadow:0 20px 50px rgba(196,84,31,0.3),inset -28px -34px 44px rgba(0,0,0,0.18);margin:0 auto 40px;position:relative}
.shape3d::before{content:"";position:absolute;top:18%;left:26%;width:80px;height:54px;background:radial-gradient(ellipse,rgba(255,255,255,0.7) 0%,transparent 70%);border-radius:50%}
.eyebrow{font-size:22px;font-weight:700;letter-spacing:0.2em;color:#c4541f;margin-bottom:24px;text-transform:uppercase}
.headline{font-size:104px;font-weight:800;line-height:0.98;letter-spacing:-2px;margin-bottom:24px}
.headline .accent{color:#c4541f}
.body{font-size:28px;font-weight:400;line-height:1.5;color:#3a3530;max-width:760px;margin:0 auto 44px}
.btn{display:inline-block;padding:24px 56px;background:#1a1a1a;color:#fff;border-radius:50px;font-size:24px;font-weight:700}
.swipe{position:absolute;bottom:80px;right:80px;font-size:20px;color:#c4541f;font-weight:600}
</style></head>
<body>
<div class="page">{{pageOf}}</div>
<div class="author"><div class="avatar">{{authorInitials}}</div><div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div></div>
<div class="center">
<div class="shape3d"></div>
<div class="eyebrow">{{eyebrow}}</div>
<div class="headline">{{headlineLine1}} <span class="accent">{{headlineAccent}}</span></div>
<div class="body">{{body}}</div>
<div class="btn">{{buttonLabel}} →</div>
</div>
<div class="swipe">{{handle}}</div>
</body></html>
