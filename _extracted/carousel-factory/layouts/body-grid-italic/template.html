<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#f5f5f2;font-family:"Inter",sans-serif;color:#0e0e0e;-webkit-font-smoothing:antialiased;}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.05) 1px,transparent 1px);background-size:135px 168px;}
  .starburst{position:absolute;top:80px;right:84px;width:62px;height:62px;background:#ff5a28;border-radius:14px;box-shadow:0 0 40px rgba(255,90,40,0.5);}
  .num{position:absolute;top:80px;left:84px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:36px;color:rgba(0,0,0,0.55);}
  .pre-label{position:absolute;top:200px;left:84px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:42px;color:rgba(0,0,0,0.55);}
  .title{position:absolute;top:280px;left:84px;right:84px;font-family:"Cormorant Garamond",serif;font-size:120px;font-weight:700;line-height:0.95;color:#0e0e0e;letter-spacing:-2px;}
  .title .em{color:#ff5a28;font-style:italic;}
  .title .underline{text-decoration:underline;text-decoration-color:rgba(255,90,40,0.6);text-underline-offset:8px;text-decoration-thickness:3px;}
  .body{position:absolute;top:620px;left:84px;right:84px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:42px;line-height:1.4;color:#0e0e0e;max-width:880px;}
  .note{position:absolute;top:880px;left:84px;right:84px;font-family:"Inter",sans-serif;font-size:24px;line-height:1.5;color:rgba(0,0,0,0.55);max-width:880px;}
  .author{position:absolute;bottom:80px;left:84px;display:flex;align-items:center;gap:16px;}
  .ava{width:54px;height:54px;border-radius:50%;background:#ff5a28;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;}
  .name{font-family:"Cormorant Garamond",serif;font-size:26px;color:#0e0e0e;}
  .pageOf{position:absolute;bottom:80px;right:84px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:24px;color:rgba(0,0,0,0.5);}
</style></head>
<body>
  <div class="grid"></div>
  <div class="num">{{number}}.</div>
  <div class="starburst"></div>
  <div class="pre-label">{{preLabel}}</div>
  <div class="title">{{titleMain}} <span class="em">{{titleAccent}}</span> <span class="underline">{{titleUnderline}}</span></div>
  <div class="body">{{body}}</div>
  <div class="note">{{note}}</div>
  <div class="author"><div class="ava">{{authorInitials}}</div><div class="name">{{authorName}}</div></div>
  <div class="pageOf">{{pageOf}}</div>
</body></html>
