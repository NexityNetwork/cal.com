<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #3a4f33;
    font-family: "DM Serif Display", serif;
    color: #f4ecd6;
    -webkit-font-smoothing: antialiased;
  }
  .top-bar {
    position: absolute; top: 80px; left: 80px; right: 80px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: "JetBrains Mono", monospace;
    font-size: 22px; font-weight: 500; letter-spacing: 0.08em;
    color: #f4ecd6;
  }
  .top-bar .brand { text-transform: uppercase; }
  .top-bar .page { text-transform: uppercase; }

  /* Big number */
  .big-number {
    position: absolute; top: 230px; left: 80px;
    font-family: "DM Serif Display", serif;
    font-style: italic;
    font-size: 280px; line-height: 0.85;
    color: #f4ecd6;
  }

  .title {
    position: absolute; top: 520px; left: 80px; right: 80px;
    font-family: "DM Serif Display", serif;
    font-size: 108px; font-weight: 400;
    line-height: 1.0;
    color: #f4ecd6;
  }

  .body-text {
    position: absolute; top: 820px; left: 80px; right: 80px;
    font-family: "JetBrains Mono", monospace;
    font-size: 30px; font-weight: 400; letter-spacing: 0.02em;
    line-height: 1.55; color: #f4ecd6;
  }

  /* Bottom rule + handle */
  .footer {
    position: absolute; bottom: 60px; left: 80px; right: 80px;
    border-top: 1px solid #f4ecd6;
    padding-top: 22px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: "JetBrains Mono", monospace;
    font-size: 22px; letter-spacing: 0.06em;
    color: #f4ecd6;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">{{brand}}</div>
    <div class="page">{{pageOf}} &gt;</div>
  </div>

  <div class="big-number">{{number}}</div>
  <div class="title">{{title}}</div>
  <div class="body-text">{{body}}</div>

  <div class="footer">
    <div>{{handle}}</div>
    <div>SWIPE &gt;</div>
  </div>
</body>
</html>
