<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#000;font-family:"Inter",sans-serif;color:#fff;-webkit-font-smoothing:antialiased;}
  .handle{position:absolute;top:54px;left:60px;font-size:22px;font-weight:600;color:rgba(255,255,255,0.35);}
  .page{position:absolute;top:54px;right:60px;font-size:22px;font-weight:600;color:rgba(255,255,255,0.35);}
  .center{position:absolute;top:50%;left:60px;right:60px;transform:translateY(-50%);text-align:center;}
  .eyebrow{font-size:24px;font-weight:600;letter-spacing:0.2em;color:#ff00d6;margin-bottom:48px;text-transform:uppercase;text-shadow:0 0 20px rgba(255,0,214,0.5);}
  .headline{font-size:108px;font-weight:800;line-height:0.95;letter-spacing:-3px;margin-bottom:48px;}
  .body{font-size:28px;font-weight:400;line-height:1.5;color:rgba(255,255,255,0.65);max-width:740px;margin:0 auto 60px;}
  .btn{display:inline-block;padding:24px 54px;background:#ff00d6;color:#000;border-radius:50px;font-size:30px;font-weight:800;letter-spacing:-0.3px;box-shadow:0 0 60px rgba(255,0,214,0.4);}
  .arrow{display:flex;align-items:center;justify-content:center;gap:0;margin-top:30px;}
  .dash{width:30px;height:5px;background:#ff00d6;margin-right:6px;border-radius:1px;}
  .arrow-head{font-size:42px;color:#ff00d6;line-height:1;margin-left:-4px;}
  .swipe-note{position:absolute;bottom:60px;left:0;right:0;text-align:center;font-size:22px;color:rgba(255,255,255,0.4);}
</style></head>
<body>
  <div class="handle">{{handle}}</div>
  <div class="page">{{pageLabel}}</div>
  <div class="center">
    <div class="eyebrow">{{eyebrow}}</div>
    <div class="headline">{{headlineLine1}}<br>{{headlineLine2}}</div>
    <div class="body">{{body}}</div>
    <div class="btn">{{buttonLabel}}</div>
    <div class="arrow"><div class="dash"></div><div class="dash"></div><div class="dash"></div><div class="arrow-head">▶</div></div>
  </div>
  <div class="swipe-note">{{closing}}</div>
</body></html>
