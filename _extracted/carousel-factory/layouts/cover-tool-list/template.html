<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0d0d0d;font-family:"Inter",sans-serif;color:#d6d6d6;-webkit-font-smoothing:antialiased}
.card{position:absolute;top:25px;left:30px;right:30px;bottom:25px;border-radius:40px;border:1px solid #1f1f1f;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px}
.title{font-size:96px;font-weight:700;line-height:1;letter-spacing:-2px;color:#737373;text-align:center;margin-bottom:64px}
.title .accent{color:#d6d6d6}
.preview-row{display:flex;align-items:center;gap:-30px;margin-bottom:48px}
.swatch{width:140px;height:140px;border-radius:50%;margin-right:-20px;box-shadow:0 8px 30px rgba(0,0,0,0.45)}
.preview-row .s1{background:{{previewColor1}}}
.preview-row .s2{background:{{previewColor2}}}
.preview-row .s3{background:{{previewColor3}}}
.preview-row .s4{background:{{previewColor4}}}
.preview-row .s5{background:{{previewColor5}}}
.sub{font-size:32px;font-weight:500;color:#d6d6d6;text-align:center;max-width:740px;line-height:1.35}
.page{position:absolute;bottom:55px;right:60px;padding:8px 20px;border-radius:50px;border:1px solid #404040;font-size:24px;color:#737373;font-weight:500}
</style></head>
<body>
<div class="card">
  <div class="title">{{titleLine1}}<br><span class="accent">{{titleLine2}}</span></div>
  <div class="preview-row"><div class="swatch s1"></div><div class="swatch s2"></div><div class="swatch s3"></div><div class="swatch s4"></div><div class="swatch s5"></div></div>
  <div class="sub">{{subtitle}}</div>
</div>
<div class="page">{{pageOf}}</div>
</body></html>
