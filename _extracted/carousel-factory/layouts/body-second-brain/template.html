<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#f3ede0;font-family:"Inter",sans-serif;color:#1f1810;-webkit-font-smoothing:antialiased;}
  .eyebrow{position:absolute;top:80px;left:84px;font-family:"JetBrains Mono",monospace;font-size:24px;font-weight:700;letter-spacing:0.15em;color:#c4541f;text-transform:uppercase;}
  .title{position:absolute;top:130px;left:84px;right:84px;font-size:78px;font-weight:800;line-height:1.0;letter-spacing:-2px;color:#1f1810;}
  .title-dot{color:#c4541f;}
  .terminal{position:absolute;top:280px;left:84px;right:84px;background:#1f1810;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.15);}
  .terminal-bar{height:44px;background:#1f1810;display:flex;align-items:center;padding:0 18px;gap:8px;border-bottom:1px solid rgba(255,255,255,0.08);}
  .terminal-bar .d{width:12px;height:12px;border-radius:50%;}
  .terminal-bar .d1{background:#ec5757;}.terminal-bar .d2{background:#f5b540;}.terminal-bar .d3{background:#5fc966;}
  .terminal-bar .path{margin-left:14px;font-family:"JetBrains Mono",monospace;font-size:18px;color:rgba(255,255,255,0.55);}
  .terminal-body{padding:30px 36px;font-family:"JetBrains Mono",monospace;font-size:28px;line-height:1.55;color:#f3ede0;}
  .term-line{display:flex;align-items:baseline;gap:14px;}
  .term-line .sigil{color:#5fc966;font-weight:700;}
  .term-line .cmd{color:#f3ede0;}
  .term-line .em{color:#e3a87a;font-weight:700;}
  .quote{position:absolute;top:580px;left:0;right:0;text-align:center;font-size:34px;font-weight:700;font-style:italic;color:#c4541f;}
  .cards{position:absolute;top:670px;left:84px;right:84px;display:flex;flex-direction:column;gap:18px;}
  .card{display:flex;align-items:center;gap:24px;background:#e8dcc8;border-left:6px solid #c4541f;border-radius:10px;padding:24px 28px;}
  .card .icon{width:60px;height:54px;background:#c4541f;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;flex-shrink:0;}
  .card .icon.g{background:#5b9c5a;}
  .card .icon.b{background:#3f6ab1;}
  .card .body{flex:1;}
  .card .ck{font-family:"JetBrains Mono",monospace;font-size:24px;font-weight:700;color:#1f1810;margin-bottom:4px;}
  .card .cd{font-size:22px;font-weight:500;color:rgba(31,24,16,0.7);}
  .footer{position:absolute;bottom:50px;left:84px;right:84px;display:flex;align-items:center;justify-content:space-between;}
  .next{font-size:22px;font-weight:700;color:#c4541f;}
  .indicators{display:flex;gap:8px;}
  .ind{width:20px;height:20px;border:1.5px solid #c4541f;border-radius:3px;}
  .ind.active{background:#c4541f;}
</style></head>
<body>
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="title">{{number}}. {{title}}<span class="title-dot">.</span></div>
  <div class="terminal">
    <div class="terminal-bar"><div class="d d1"></div><div class="d d2"></div><div class="d d3"></div><div class="path">{{terminalPath}}</div></div>
    <div class="terminal-body">
      <div class="term-line"><span class="sigil">$</span><span class="cmd">{{term1Cmd}} <span class="em">{{term1Arg}}</span></span></div>
      <div class="term-line"><span class="sigil">$</span><span class="cmd">{{term2Cmd}} <span class="em">{{term2Arg}}</span></span></div>
      <div class="term-line"><span class="sigil">$</span><span class="cmd">{{term3Cmd}} <span class="em">{{term3Arg}}</span></span></div>
    </div>
  </div>
  <div class="quote">{{quote}}</div>
  <div class="cards">
    <div class="card"><div class="icon">▣</div><div class="body"><div class="ck">{{card1Key}}</div><div class="cd">{{card1Desc}}</div></div></div>
    <div class="card"><div class="icon g">▣</div><div class="body"><div class="ck">{{card2Key}}</div><div class="cd">{{card2Desc}}</div></div></div>
    <div class="card"><div class="icon b">▣</div><div class="body"><div class="ck">{{card3Key}}</div><div class="cd">{{card3Desc}}</div></div></div>
  </div>
  <div class="footer">
    <div class="next">{{nextNote}} →</div>
    <div class="indicators"><div class="ind"></div><div class="ind active"></div><div class="ind"></div><div class="ind"></div><div class="ind"></div><div class="ind"></div><div class="ind"></div><div class="ind"></div></div>
  </div>
</body></html>
