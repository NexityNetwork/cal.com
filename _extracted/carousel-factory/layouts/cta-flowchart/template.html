<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f4eee2;font-family:"Inter",sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.page{position:absolute;top:80px;left:80px;font-size:18px;font-weight:700}
.author{position:absolute;top:80px;right:80px;display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}
.author-info{text-align:right}
.author-info .name{font-size:16px;font-weight:700;line-height:1.2}
.author-info .handle{font-size:13px;color:#7a7464;line-height:1.2}
.center{position:absolute;top:50%;left:80px;right:80px;transform:translateY(-50%);text-align:center}
.eyebrow{font-size:22px;font-weight:700;letter-spacing:0.2em;color:#3a5eef;margin-bottom:30px;text-transform:uppercase}
.headline{font-size:104px;font-weight:800;line-height:0.98;letter-spacing:-2.5px;margin-bottom:30px}
.headline .accent{color:#3a5eef}
.summary-nodes{display:flex;justify-content:center;gap:14px;margin:36px 0;flex-wrap:wrap}
.node{padding:14px 26px;background:#fff;border:2px solid #1a1a1a;border-radius:50px;font-size:20px;font-weight:700;box-shadow:4px 4px 0 #1a1a1a}
.node.alt{background:#3a5eef;color:#fff}
.body{font-size:28px;font-weight:400;line-height:1.5;color:#3a3530;max-width:760px;margin:0 auto 44px}
.btn{display:inline-block;padding:24px 56px;background:#1a1a1a;color:#fff;border-radius:50px;font-size:24px;font-weight:700}
.bottom{position:absolute;bottom:60px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.handle{font-size:16px;font-weight:600;color:#7a7464}
.swipe{padding:10px 22px;background:#3a5eef;color:#fff;border-radius:50px;font-size:16px;font-weight:600}
</style></head>
<body>
<div class="page">{{pageOf}}</div>
<div class="author"><div class="avatar">{{authorInitials}}</div><div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div></div>
<div class="center">
<div class="eyebrow">{{eyebrow}}</div>
<div class="headline">{{headlineLine1}}<br><span class="accent">{{headlineAccent}}</span></div>
<div class="summary-nodes"><div class="node">{{node1}}</div><div class="node alt">{{node2}}</div><div class="node">{{node3}}</div></div>
<div class="body">{{body}}</div>
<div class="btn">{{buttonLabel}} →</div>
</div>
<div class="bottom"><div class="handle">{{handle}}</div><div class="swipe">Save & Share</div></div>
</body></html>
