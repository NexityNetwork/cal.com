<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Oswald:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#eef0ed;font-family:"Inter",sans-serif;color:#0e0e0e;-webkit-font-smoothing:antialiased;
    background-image:linear-gradient(135deg,rgba(0,0,0,0.04) 1px,transparent 1px),linear-gradient(45deg,rgba(0,0,0,0.04) 1px,transparent 1px);
    background-size:140px 140px;}
  .top-bar{position:absolute;top:64px;left:64px;right:64px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-size:30px;font-weight:700;}
  .num{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;background:#0e0e0e;color:#eef0ed;border-radius:50%;font-family:"Oswald",sans-serif;font-size:30px;font-weight:700;}
  .number-pre{position:absolute;top:220px;left:64px;font-family:"DM Serif Display",serif;font-style:italic;font-size:62px;color:#0e0e0e;}
  .pill-row{position:absolute;top:300px;left:64px;right:64px;text-align:center;}
  .pill{background:#0e0e0e;color:#eef0ed;padding:24px 56px;border-radius:32px;
    font-family:"Oswald",sans-serif;font-weight:700;font-size:130px;line-height:0.95;letter-spacing:-0.005em;
    display:inline-block;transform:scaleX(1.05);}
  .body{position:absolute;top:600px;left:64px;right:64px;
    font-family:"DM Serif Display",serif;font-size:50px;line-height:1.2;color:#0e0e0e;text-align:center;}
  .footer{position:absolute;bottom:80px;left:64px;right:64px;display:flex;align-items:center;justify-content:space-between;font-size:24px;color:#0e0e0e;}
  .swipe-pill{display:inline-flex;align-items:center;gap:12px;padding:14px 26px;background:#0e0e0e;color:#fff;border-radius:30px;font-size:20px;font-weight:600;}
</style></head>
<body>
  <div class="top-bar"><div class="brand">{{brand}}</div><div class="num">{{number}}</div></div>
  <div class="number-pre">{{numberLabel}}</div>
  <div class="pill-row"><span class="pill">{{title}}</span></div>
  <div class="body">{{body}}</div>
  <div class="footer">
    <div>{{author}}</div>
    <div class="swipe-pill">Swipe →</div>
  </div>
</body></html>
