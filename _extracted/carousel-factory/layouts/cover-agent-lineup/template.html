<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a;font-family:"Inter",sans-serif;color:#f5f5f5;-webkit-font-smoothing:antialiased}
.bg-gradient{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 70%,rgba(45,45,55,0.6) 0%,rgba(10,10,10,0.95) 60%);}
.top-section{position:absolute;top:80px;left:80px;right:80px}
.title{font-family:"Inter",sans-serif;font-size:88px;font-weight:800;color:#f5f5f5;line-height:1;letter-spacing:-2.5px;margin-bottom:24px}
.desc{font-size:34px;font-weight:400;color:#cdd5df;line-height:1.4;max-width:840px}
.preview-card{position:absolute;top:400px;left:80px;right:80px;bottom:280px;border-radius:32px;background:linear-gradient(135deg,#1a1a1a,#2a2a2a);border:1px solid rgba(255,255,255,0.08);box-shadow:0 30px 80px rgba(0,0,0,0.6);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px}
.preview-tag{font-size:18px;font-weight:600;letter-spacing:0.18em;color:#9ca3af;text-transform:uppercase;margin-bottom:30px}
.flow{display:flex;align-items:center;gap:18px}
.flow-icon{width:104px;height:104px;border-radius:24px;background:#ffffff;display:flex;align-items:center;justify-content:center;padding:18px;box-shadow:0 10px 32px rgba(0,0,0,0.4)}
.flow-icon svg{width:100%;height:100%}
.flow-arrow{color:#9ca3af;font-size:36px;font-weight:300}
.preview-foot{margin-top:38px;font-size:24px;font-weight:600;color:#f5f5f5;letter-spacing:-0.3px;text-align:center;max-width:760px;line-height:1.3}
.bottom{position:absolute;bottom:60px;left:80px;right:80px;display:flex;flex-direction:column;align-items:center;gap:24px}
.logo-row{display:flex;align-items:center;gap:24px}
.logo-chip{width:68px;height:68px;border-radius:16px;background:#ffffff;display:flex;align-items:center;justify-content:center;padding:11px;box-shadow:0 6px 20px rgba(255,255,255,0.06)}
.logo-chip svg{width:100%;height:100%}
.cta{font-size:24px;font-weight:700;color:#f5f5f5;letter-spacing:-0.2px}
</style></head>
<body>
<div class="bg-gradient"></div>
<div class="top-section">
  <div class="title">{{title}}</div>
  <div class="desc">{{description}}</div>
</div>
<div class="preview-card">
  <div class="preview-tag">{{flowLabel}}</div>
  <div class="flow">
    <div class="flow-icon">{{iconSvg1}}</div>
    <div class="flow-arrow">→</div>
    <div class="flow-icon">{{iconSvg2}}</div>
    <div class="flow-arrow">→</div>
    <div class="flow-icon">{{iconSvg3}}</div>
  </div>
  <div class="preview-foot">{{flowCaption}}</div>
</div>
<div class="bottom">
  <div class="logo-row">
    <div class="logo-chip">{{iconSvg4}}</div>
    <div class="logo-chip">{{iconSvg5}}</div>
    <div class="logo-chip">{{iconSvg6}}</div>
    <div class="logo-chip">{{iconSvg7}}</div>
  </div>
  <div class="cta">{{ctaText}}</div>
</div>
</body></html>
