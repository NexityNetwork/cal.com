<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#000;font-family:"Inter",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.author{position:absolute;top:60px;left:80px;display:flex;align-items:center;gap:14px}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.author-info .name{font-size:18px;font-weight:700;line-height:1.2}
.author-info .handle{font-size:14px;color:rgba(255,255,255,0.4);line-height:1.2}
.page{position:absolute;top:80px;right:80px;font-size:18px;color:rgba(255,255,255,0.4)}
.center{position:absolute;top:50%;left:80px;right:80px;transform:translateY(-50%);text-align:center}
.icon{width:80px;height:80px;border-radius:50%;background:#ff4757;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:#fff;margin:0 auto 32px}
.eyebrow{font-size:22px;font-weight:700;letter-spacing:0.2em;color:#ff4757;margin-bottom:28px;text-transform:uppercase}
.headline{font-family:"DM Serif Display",serif;font-style:italic;font-size:130px;line-height:0.95;letter-spacing:-2px;margin-bottom:24px}
.headline .accent{color:#ff4757}
.body{font-size:30px;font-weight:400;line-height:1.5;color:rgba(255,255,255,0.7);max-width:760px;margin:24px auto 48px}
.btn{display:inline-block;padding:24px 56px;background:#ff4757;color:#fff;border-radius:50px;font-size:24px;font-weight:700}
.swipe{position:absolute;bottom:80px;right:80px;font-size:22px;color:rgba(255,255,255,0.5);font-weight:600}
</style></head>
<body>
<div class="author"><div class="avatar">{{authorInitials}}</div><div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div></div>
<div class="page">{{pageOf}}</div>
<div class="center">
<div class="icon">!</div>
<div class="eyebrow">{{eyebrow}}</div>
<div class="headline">{{headlineLine1}}<br><span class="accent">{{headlineAccent}}</span></div>
<div class="body">{{body}}</div>
<div class="btn">{{buttonLabel}} →</div>
</div>
<div class="swipe">{{handle}}</div>
</body></html>
