<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#fafafa;font-family:"Inter",sans-serif;color:#1d1d1d;-webkit-font-smoothing:antialiased}
.badge{position:absolute;top:65px;left:75px;width:92px;height:50px;background:#3457d5;border-radius:1000px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Geist",sans-serif;font-size:24px;font-weight:700}
.handle{position:absolute;top:70px;right:75px;font-family:"Geist",sans-serif;font-size:32px;font-weight:500;color:#4b5563}
.center{position:absolute;top:50%;left:75px;right:75px;transform:translateY(-50%);text-align:center}
.eyebrow{display:inline-block;padding:12px 28px;background:#3457d5;color:#fff;border-radius:50px;font-family:"Geist",sans-serif;font-size:22px;font-weight:600;letter-spacing:0.08em;margin-bottom:36px;text-transform:uppercase}
.headline{font-size:112px;font-weight:700;line-height:1.0;letter-spacing:-3px;margin-bottom:36px}
.headline .accent{color:#3457d5}
.body{font-size:36px;font-weight:500;line-height:1.4;color:#4b5563;max-width:840px;margin:0 auto 56px}
.btn{display:inline-flex;align-items:center;gap:14px;padding:24px 48px;background:#3457d5;color:#fff;border-radius:50px;font-size:28px;font-weight:600}
.handle-foot{position:absolute;bottom:85px;left:75px;font-family:"Geist",sans-serif;font-size:24px;color:#4b5563;font-weight:500}
.save{position:absolute;bottom:85px;right:75px;width:54px;height:54px;background:#3457d5;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
</style></head>
<body>
<div class="badge">{{number}}</div>
<div class="handle">{{handle}}</div>
<div class="center">
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="headline">{{headlineLine1}}<br><span class="accent">{{headlineAccent}}</span></div>
  <div class="body">{{body}}</div>
  <div class="btn">{{buttonLabel}} →</div>
</div>
<div class="handle-foot">{{pageOf}}</div>
<div class="save">🔖</div>
</body></html>
