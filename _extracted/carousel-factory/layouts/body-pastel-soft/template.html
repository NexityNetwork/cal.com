<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#eef1ff;font-family:"DM Sans",sans-serif;color:#1a1a2e;-webkit-font-smoothing:antialiased;}
  .blob-1{position:absolute;top:-100px;right:-80px;width:400px;height:400px;background:radial-gradient(circle,#f9c6e0 0%,transparent 70%);opacity:0.6;}
  .top-row{position:absolute;top:56px;left:60px;right:60px;display:flex;align-items:center;justify-content:space-between;z-index:5;}
  .author{font-size:20px;font-weight:600;color:rgba(26,26,46,0.5);}
  .page{font-size:20px;font-weight:600;color:rgba(26,26,46,0.4);}
  .num-badge{position:absolute;top:150px;left:60px;width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#7c9cf7,#c77ddd);display:flex;align-items:center;justify-content:center;}
  .num{font-size:52px;font-weight:700;color:#ffffff;line-height:1;}
  .card{position:absolute;top:160px;left:60px;right:60px;bottom:100px;background:#ffffff;border-radius:40px;padding:80px 64px 60px 64px;box-shadow:0 20px 60px rgba(100,100,200,0.10);}
  .num-inner{display:flex;align-items:center;gap:20px;margin-bottom:32px;}
  .num-circle{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#7c9cf7,#c77ddd);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:#ffffff;flex-shrink:0;}
  .num-label{font-size:20px;font-weight:600;color:rgba(26,26,46,0.45);letter-spacing:0.06em;text-transform:uppercase;}
  .title{font-size:74px;font-weight:700;line-height:0.96;letter-spacing:-1.5px;color:#1a1a2e;margin-bottom:28px;}
  .title em{font-style:italic;color:#7c9cf7;}
  .highlight-bar{width:60px;height:5px;background:linear-gradient(90deg,#7c9cf7,#f9a8d4);border-radius:3px;margin-bottom:28px;}
  .body{font-size:30px;font-weight:400;line-height:1.5;color:rgba(26,26,46,0.68);}
  .handle{position:absolute;bottom:55px;left:60px;font-size:18px;color:rgba(26,26,46,0.3);}
</style></head>
<body>
  <div class="blob-1"></div>
  <div class="top-row">
    <div class="author">{{authorName}}</div>
    <div class="page">{{pageOf}}</div>
  </div>
  <div class="card">
    <div class="num-inner">
      <div class="num-circle">{{number}}</div>
      <div class="num-label">{{numberLabel}}</div>
    </div>
    <div class="title">{{titleMain}}<br><em>{{titleItalic}}</em></div>
    <div class="highlight-bar"></div>
    <div class="body">{{body}}</div>
  </div>
  <div class="handle">{{handle}}</div>
</body></html>
