<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a;font-family:"Inter",sans-serif;color:#f5f5f5;-webkit-font-smoothing:antialiased}
.outline{position:absolute;inset:24px;border:1px solid rgba(255,255,255,0.05);border-radius:32px;pointer-events:none;z-index:10}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse at 20% 30%,#000 0%,transparent 70%)}
.tag-strip{position:absolute;top:80px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.tag-pill{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;background:rgba(255,90,40,0.12);border:1px solid rgba(255,90,40,0.3);color:#ff7a3c;border-radius:50px;font-size:16px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase}
.num-meta{font-family:"JetBrains Mono",monospace;font-size:16px;color:#9ca3af}
.headline-block{position:absolute;top:170px;left:80px;right:80px}
.title{font-size:72px;font-weight:800;line-height:1.0;letter-spacing:-2px;color:#fafafa;margin-bottom:18px}
.title .accent{color:#ff7a3c}
.subtitle{font-size:24px;font-weight:400;color:#9ca3af;line-height:1.5;max-width:880px}
.bullets{position:absolute;top:420px;left:80px;right:80px;display:flex;flex-direction:column;gap:16px}
.bullet{padding:24px 28px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;display:flex;align-items:flex-start;gap:18px}
.bullet .ck{width:38px;height:38px;border-radius:10px;background:linear-gradient(180deg,#ff9959 0%,#ff5722 100%);display:flex;align-items:center;justify-content:center;color:#0a0a0a;font-size:18px;font-weight:900;flex-shrink:0;box-shadow:0 4px 16px rgba(255,90,40,0.3)}
.bullet .bd{flex:1}
.bullet .bd .bt{font-size:22px;font-weight:700;color:#fafafa;line-height:1.3;margin-bottom:6px}
.bullet .bd .bs{font-size:18px;color:#9ca3af;line-height:1.4}
.terminal{position:absolute;bottom:200px;left:80px;right:80px;background:#161616;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:24px 28px;font-family:"JetBrains Mono",monospace;font-size:18px;color:#cdd5df;line-height:1.7}
.terminal .prompt{color:#86efac;font-weight:700}
.terminal .cmd{color:#fafafa}
.terminal .out{color:#71717a}
.terminal .ok{color:#ff7a3c;font-weight:700}
.bottom-row{position:absolute;bottom:80px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.handle{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#cdd5df;border-radius:50px;font-size:16px;font-weight:500}
.handle .globe{width:18px;height:18px;border:1.5px solid #cdd5df;border-radius:50%;position:relative}
.handle .globe::before{content:"";position:absolute;top:50%;left:1px;right:1px;height:1.5px;background:#cdd5df}
.page{font-size:16px;color:#525252;font-weight:500;letter-spacing:0.06em}
</style></head>
<body>
<div class="grid-bg"></div>
<div class="outline"></div>
<div class="tag-strip"><div class="tag-pill">{{tag}}</div><div class="num-meta">{{stepMeta}}</div></div>
<div class="headline-block">
  <div class="title">{{title}} <span class="accent">{{titleAccent}}</span></div>
  <div class="subtitle">{{subtitle}}</div>
</div>
<div class="bullets">
  <div class="bullet"><div class="ck">1</div><div class="bd"><div class="bt">{{b1Title}}</div><div class="bs">{{b1Body}}</div></div></div>
  <div class="bullet"><div class="ck">2</div><div class="bd"><div class="bt">{{b2Title}}</div><div class="bs">{{b2Body}}</div></div></div>
  <div class="bullet"><div class="ck">3</div><div class="bd"><div class="bt">{{b3Title}}</div><div class="bs">{{b3Body}}</div></div></div>
</div>
<div class="terminal">
  <span class="prompt">$</span> <span class="cmd">{{cmdLine}}</span><br>
  <span class="out">{{outLine}}</span> <span class="ok">{{okLine}}</span>
</div>
<div class="bottom-row"><div class="handle"><div class="globe"></div><span>{{domainText}}</span></div><div class="page">{{pageOf}}</div></div>
</body></html>
