<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#07070f;font-family:"Space Grotesk",sans-serif;color:#f0f0f8;-webkit-font-smoothing:antialiased;}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,45,120,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,45,120,0.06) 1px,transparent 1px);background-size:60px 60px;}
  .glow-blob{position:absolute;top:-100px;right:-150px;width:500px;height:500px;background:radial-gradient(circle,rgba(255,45,120,0.14) 0%,transparent 65%);}
  .handle-bar{position:absolute;top:56px;left:60px;right:60px;display:flex;align-items:center;justify-content:space-between;z-index:5;}
  .handle{font-family:"Space Mono",monospace;font-size:22px;color:#ff2d7a;letter-spacing:0.05em;}
  .page{font-family:"Space Mono",monospace;font-size:20px;color:rgba(240,240,248,0.35);}
  .num-block{position:absolute;top:160px;left:60px;z-index:5;}
  .num{font-family:"Space Mono",monospace;font-size:200px;font-weight:700;line-height:0.85;color:transparent;-webkit-text-stroke:2px rgba(255,45,120,0.4);letter-spacing:-6px;}
  .card{position:absolute;top:300px;left:60px;right:60px;bottom:130px;border:1px solid rgba(255,45,120,0.25);border-radius:24px;background:rgba(255,255,255,0.03);padding:60px 64px;}
  .title-label{font-family:"Space Mono",monospace;font-size:20px;color:#00f5d4;letter-spacing:0.1em;margin-bottom:16px;}
  .title{font-size:76px;font-weight:800;line-height:0.95;letter-spacing:-2px;margin-bottom:36px;color:#f0f0f8;}
  .title em{color:#ff2d7a;font-style:normal;text-shadow:0 0 30px rgba(255,45,120,0.5);}
  .body{font-size:30px;font-weight:400;line-height:1.5;color:rgba(240,240,248,0.72);max-width:800px;}
  .slide-num{position:absolute;bottom:56px;right:60px;font-family:"Space Mono",monospace;font-size:20px;color:rgba(255,45,120,0.5);}
</style></head>
<body>
  <div class="grid"></div>
  <div class="glow-blob"></div>
  <div class="handle-bar">
    <div class="handle">{{handle}}</div>
    <div class="page">{{pageOf}}</div>
  </div>
  <div class="num-block"><div class="num">{{number}}</div></div>
  <div class="card">
    <div class="title-label">{{titleLabel}}</div>
    <div class="title">{{titleMain}} <em>{{titleAccent}}</em></div>
    <div class="body">{{body}}</div>
  </div>
  <div class="slide-num">{{slideNum}} / {{totalSlides}}</div>
</body></html>
