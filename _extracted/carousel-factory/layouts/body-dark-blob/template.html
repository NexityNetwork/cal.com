<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a;font-family:"Inter",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.blob{position:absolute;top:-80px;right:-180px;width:540px;height:540px;border-radius:50%;background:radial-gradient(circle at 40% 35%,{{blobColor1}} 0%,{{blobColor2}} 40%,transparent 72%);filter:blur(70px);opacity:0.7}
.author{position:absolute;top:80px;left:80px;display:flex;align-items:center;gap:16px}
.avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0}
.author-info .name{font-size:20px;font-weight:700;color:#fff;line-height:1.2}
.author-info .handle{font-size:16px;font-weight:500;color:rgba(255,255,255,0.5);line-height:1.2}
.page{position:absolute;top:96px;right:80px;font-size:18px;font-weight:600;color:rgba(255,255,255,0.5);letter-spacing:0.06em}
.num{position:absolute;top:240px;left:80px;font-size:32px;font-weight:600;color:{{accentColor}};letter-spacing:0.03em}
.title{position:absolute;top:300px;left:80px;right:80px;font-size:80px;font-weight:800;line-height:1.05;letter-spacing:-2px;color:#fff}
.body{position:absolute;top:680px;left:80px;right:80px;font-size:28px;font-weight:400;line-height:1.55;color:rgba(255,255,255,0.7);max-width:900px}
.takeaway{position:absolute;bottom:200px;left:80px;right:80px;padding:30px 32px;border-radius:18px;background:rgba(255,255,255,0.05);border-left:4px solid {{accentColor}};font-size:24px;font-weight:500;line-height:1.4;color:rgba(255,255,255,0.85)}
.nav{position:absolute;bottom:80px;right:80px;display:flex;align-items:center;gap:14px}
.nav .back{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.45);font-size:20px}
.nav .fwd{width:54px;height:54px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#0a0a0a;font-size:22px;font-weight:700}
</style></head>
<body>
<div class="blob"></div>
<div class="author"><div class="avatar">{{authorInitials}}</div><div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div></div>
<div class="page">{{pageOf}}</div>
<div class="num">{{number}}</div>
<div class="title">{{title}}</div>
<div class="body">{{body}}</div>
<div class="takeaway">{{takeaway}}</div>
<div class="nav"><div class="back">←</div><div class="fwd">→</div></div>
</body></html>
