<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#131313;font-family:"Inter",sans-serif;color:#e8ecf3;-webkit-font-smoothing:antialiased}
.blob-red{position:absolute;top:881px;left:-260px;width:395px;height:310px;background:radial-gradient(ellipse at center,#e5014c 0%,rgba(229,1,76,0.55) 40%,transparent 70%);filter:blur(70px);opacity:0.9}
.blob-purple{position:absolute;top:889px;left:-302px;width:511px;height:339px;background:radial-gradient(ellipse at center,#36059d 0%,rgba(54,5,157,0.45) 40%,transparent 70%);filter:blur(70px);opacity:0.85}
.subline{position:absolute;top:403px;right:87px;font-family:"Inter",sans-serif;font-size:33px;font-weight:500;color:#f4f4f4;letter-spacing:-0.5px;text-align:right}
.title{position:absolute;top:455px;left:87px;right:87px;font-family:"Inter",sans-serif;font-size:100px;font-weight:600;color:#e8ecf3;line-height:1.05;letter-spacing:-2.5px;text-align:right}
.divider-arrow{position:absolute;top:830px;left:280px;right:180px;display:flex;align-items:center;gap:0}
.divider-arrow .line{flex:1;height:2px;background:#e8ecf3}
.divider-arrow .head{font-size:36px;color:#e8ecf3;margin-left:-4px;line-height:1}
.author{position:absolute;bottom:108px;left:87px;display:flex;align-items:center;gap:18px}
.avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0}
.author-info .name{font-size:22px;font-weight:600;color:#ffffff;line-height:1.2;letter-spacing:-0.2px}
.author-info .handle{font-size:20px;font-weight:600;color:#d1d1d1;line-height:1.2;letter-spacing:-0.2px}
.nav{position:absolute;bottom:108px;right:87px;display:flex;align-items:center;gap:14px}
.nav .back{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ffffff;font-size:18px}
.nav .fwd{width:54px;height:54px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center;color:#131313;font-size:20px}
</style></head>
<body>
<div class="blob-red"></div>
<div class="blob-purple"></div>
<div class="subline">{{subline}}</div>
<div class="title">{{titleLine1}}<br>{{titleLine2}}<br>{{titleLine3}}</div>
<div class="divider-arrow"><div class="line"></div><div class="head">›</div></div>
<div class="author">
  <div class="avatar">{{authorInitials}}</div>
  <div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div>
</div>
<div class="nav"><div class="back">←</div><div class="fwd">→</div></div>
</body></html>
