<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#fafafa;font-family:"Inter",sans-serif;color:#1d1d1d;-webkit-font-smoothing:antialiased}
.num{position:absolute;top:74px;left:100px;font-size:48px;font-weight:400;color:#4b5563}
.handle{position:absolute;top:83px;right:100px;font-size:32px;font-weight:400;color:#4b5563}
.title{position:absolute;top:240px;left:100px;right:100px;font-size:64px;font-weight:600;line-height:1.15;color:#1d1d1d;letter-spacing:-1.2px}
.metric{position:absolute;top:420px;left:100px;display:flex;align-items:baseline;gap:24px}
.metric .v{font-size:160px;font-weight:700;color:#3457d5;line-height:1;letter-spacing:-5px}
.metric .l{font-size:28px;font-weight:500;color:#4b5563;max-width:300px;line-height:1.3}
.body{position:absolute;top:660px;left:100px;right:100px;font-size:36px;font-weight:400;line-height:1.4;color:#4b5563}
.bars{position:absolute;bottom:220px;left:100px;right:100px;display:flex;flex-direction:column;gap:18px}
.bar-row{display:flex;align-items:center;gap:18px}
.bar-row .label{flex:0 0 220px;font-size:22px;font-weight:600;color:#1d1d1d}
.bar-row .track{flex:1;height:24px;background:#e5e7eb;border-radius:12px;overflow:hidden}
.bar-row .fill{height:100%;background:#3457d5;border-radius:12px}
.bar-row .v{flex:0 0 100px;text-align:right;font-size:24px;font-weight:700;color:#3457d5}
.foot{position:absolute;bottom:85px;left:100px;right:100px;display:flex;justify-content:space-between;align-items:center}
.foot .pg{font-size:20px;color:#4b5563;font-weight:500}
.arrow-foot{width:54px;height:54px;background:#3457d5;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
</style></head>
<body>
<div class="num">{{number}}</div>
<div class="handle">{{handle}}</div>
<div class="title">{{title}}</div>
<div class="metric"><div class="v">{{bigStat}}</div><div class="l">{{bigStatLabel}}</div></div>
<div class="body">{{body}}</div>
<div class="bars">
  <div class="bar-row"><div class="label">{{bar1Label}}</div><div class="track"><div class="fill" style="width:{{bar1Pct}}%"></div></div><div class="v">{{bar1Val}}</div></div>
  <div class="bar-row"><div class="label">{{bar2Label}}</div><div class="track"><div class="fill" style="width:{{bar2Pct}}%"></div></div><div class="v">{{bar2Val}}</div></div>
  <div class="bar-row"><div class="label">{{bar3Label}}</div><div class="track"><div class="fill" style="width:{{bar3Pct}}%"></div></div><div class="v">{{bar3Val}}</div></div>
</div>
<div class="foot"><div class="pg">{{pageOf}}</div><div class="arrow-foot">→</div></div>
</body></html>
