<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a;font-family:"Inter",sans-serif;color:#f5f5f5;-webkit-font-smoothing:antialiased}
.bg-gradient{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 70%,rgba(45,45,55,0.5) 0%,rgba(10,10,10,0.95) 60%);}
.top{position:absolute;top:80px;left:80px;right:80px}
.num{font-family:"Inter",sans-serif;font-size:24px;font-weight:600;letter-spacing:0.16em;color:#9ca3af;text-transform:uppercase;margin-bottom:14px}
.title{font-family:"Inter",sans-serif;font-size:72px;font-weight:800;color:#f5f5f5;line-height:1;letter-spacing:-2px;margin-bottom:22px}
.desc{font-size:30px;font-weight:400;color:#cdd5df;line-height:1.4;max-width:880px}
.workflow-card{position:absolute;top:430px;left:80px;right:80px;bottom:260px;border-radius:28px;background:linear-gradient(135deg,#161616,#262626);border:1px solid rgba(255,255,255,0.08);padding:54px 60px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.flow-step{display:flex;align-items:center;gap:24px;padding:18px 22px;background:rgba(255,255,255,0.03);border-radius:18px}
.flow-step .ico{width:64px;height:64px;border-radius:12px;background:#ffffff;padding:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.flow-step .ico svg{width:100%;height:100%}
.flow-step .body{flex:1}
.flow-step .body .name{font-size:24px;font-weight:700;color:#f5f5f5;margin-bottom:4px}
.flow-step .body .role{font-size:20px;color:#9ca3af;line-height:1.35}
.flow-arrow-v{font-size:22px;color:#525252;text-align:center;line-height:1}
.bottom{position:absolute;bottom:60px;left:80px;right:80px;display:flex;flex-direction:column;align-items:center;gap:20px}
.logo-row{display:flex;align-items:center;gap:20px}
.logo-chip{width:60px;height:60px;border-radius:14px;background:#ffffff;display:flex;align-items:center;justify-content:center;padding:10px}
.logo-chip svg{width:100%;height:100%}
.cta{font-size:22px;font-weight:600;color:#cdd5df;letter-spacing:-0.2px}
</style></head>
<body>
<div class="bg-gradient"></div>
<div class="top">
  <div class="num">{{slideLabel}}</div>
  <div class="title">{{title}}</div>
  <div class="desc">{{description}}</div>
</div>
<div class="workflow-card">
  <div class="flow-step"><div class="ico">{{iconSvg1}}</div><div class="body"><div class="name">{{toolName1}}</div><div class="role">{{toolRole1}}</div></div></div>
  <div class="flow-arrow-v">↓</div>
  <div class="flow-step"><div class="ico">{{iconSvg2}}</div><div class="body"><div class="name">{{toolName2}}</div><div class="role">{{toolRole2}}</div></div></div>
  <div class="flow-arrow-v">↓</div>
  <div class="flow-step"><div class="ico">{{iconSvg3}}</div><div class="body"><div class="name">{{toolName3}}</div><div class="role">{{toolRole3}}</div></div></div>
</div>
<div class="bottom">
  <div class="logo-row">
    <div class="logo-chip">{{iconSvg4}}</div>
    <div class="logo-chip">{{iconSvg5}}</div>
    <div class="logo-chip">{{iconSvg6}}</div>
    <div class="logo-chip">{{iconSvg7}}</div>
  </div>
  <div class="cta">{{handle}}</div>
</div>
</body></html>
