<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#f5f0e8;font-family:"IBM Plex Mono",monospace;color:#1a1a1a;-webkit-font-smoothing:antialiased;}
  .top-strip{position:absolute;top:0;left:0;right:0;height:8px;background:#c4541f;}
  .header{position:absolute;top:42px;left:70px;right:70px;display:flex;justify-content:space-between;font-size:20px;font-weight:700;color:#c4541f;letter-spacing:0.08em;}
  .header .handle{color:#1a1a1a;font-weight:500;}
  .pattern-pill{position:absolute;top:104px;left:70px;display:inline-flex;align-items:center;gap:8px;background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:6px;font-size:20px;font-weight:700;letter-spacing:0.06em;}
  .pattern-pill::before{content:"▲";color:#c4541f;font-size:14px;}
  .title{position:absolute;top:174px;left:70px;right:70px;font-size:128px;font-weight:700;line-height:0.92;letter-spacing:-3px;color:#1a1a1a;text-transform:uppercase;}
  .title .em{color:#c4541f;}
  .body{position:absolute;top:570px;left:70px;right:70px;font-size:26px;line-height:1.5;color:#1a1a1a;}
  .flow{position:absolute;top:740px;left:70px;right:70px;display:flex;flex-direction:column;gap:6px;}
  .flow-step{padding:18px 26px;font-size:22px;font-weight:500;border-radius:8px;text-align:center;}
  .fs-dark{background:#1a1a1a;color:#fff;font-weight:700;}
  .fs-light{background:#e6dfd0;color:#1a1a1a;}
  .fs-orange{background:#c4541f;color:#fff;font-weight:700;}
  .arrow-down{text-align:center;color:rgba(26,26,26,0.4);font-size:18px;line-height:1;margin:0;}
  .cards{position:absolute;bottom:120px;left:70px;right:70px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .card{padding:18px 22px;border-radius:10px;background:#e6dfd0;}
  .card .ck{font-size:18px;font-weight:700;color:#c4541f;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;}
  .card .cb{font-size:21px;font-weight:500;color:#1a1a1a;line-height:1.4;}
  .footer{position:absolute;bottom:30px;left:70px;right:70px;display:flex;justify-content:space-between;font-size:18px;color:rgba(26,26,26,0.55);}
  .rule{position:absolute;bottom:75px;left:70px;right:70px;height:1px;background:rgba(26,26,26,0.15);}
</style></head>
<body>
  <div class="top-strip"></div>
  <div class="header"><div>{{pageOf}}</div><div class="handle">{{handle}}</div></div>
  <div class="pattern-pill">{{patternLabel}}</div>
  <div class="title">{{titleWord1}}<br><span class="em">{{titleWord2}}</span><span class="em">.</span></div>
  <div class="body">{{body}}</div>
  <div class="flow">
    <div class="flow-step fs-dark">{{flow1}}</div>
    <div class="arrow-down">↓</div>
    <div class="flow-step fs-light">{{flow2}}</div>
    <div class="arrow-down">↓</div>
    <div class="flow-step fs-orange">{{flow3}}</div>
  </div>
  <div class="cards">
    <div class="card"><div class="ck">{{card1Key}}</div><div class="cb">{{card1Body}}</div></div>
    <div class="card"><div class="ck">{{card2Key}}</div><div class="cb">{{card2Body}}</div></div>
  </div>
  <div class="rule"></div>
  <div class="footer"><div>{{footerLeft}}</div><div>{{footerRight}}</div></div>
</body></html>
