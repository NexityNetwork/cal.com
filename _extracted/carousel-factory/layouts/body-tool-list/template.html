<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0d0d0d;font-family:"Inter",sans-serif;color:#d6d6d6;-webkit-font-smoothing:antialiased}
.card{position:absolute;top:25px;left:30px;right:30px;bottom:25px;border-radius:40px;border:1px solid #1f1f1f}
.num{position:absolute;top:340px;left:50%;transform:translateX(-50%);width:80px;height:80px;border-radius:50%;border:1.5px solid #404040;display:flex;align-items:center;justify-content:center;color:#d6d6d6;font-size:36px;font-weight:600}
.swatches{position:absolute;top:530px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:-30px}
.swatch{width:200px;height:200px;border-radius:50%;margin-right:-30px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.swatch.s1{background:{{color1}}}
.swatch.s2{background:{{color2}}}
.swatch.s3{background:{{color3}}}
.swatch.s4{background:{{color4}}}
.hexes{position:absolute;top:780px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:50px;width:850px;justify-content:space-between;padding:0 60px}
.hex{font-size:24px;font-weight:500;color:#737373;font-family:"Inter",monospace;text-align:center;width:140px}
.name{position:absolute;top:900px;left:50%;transform:translateX(-50%);text-align:center}
.name .t{font-size:42px;font-weight:600;color:#d6d6d6;margin-bottom:8px}
.name .s{font-size:24px;color:#737373;font-weight:500;max-width:760px}
.page{position:absolute;bottom:55px;right:60px;padding:8px 20px;border-radius:50px;border:1px solid #404040;font-size:24px;color:#737373;font-weight:500}
</style></head>
<body>
<div class="card"></div>
<div class="num">{{number}}</div>
<div class="swatches"><div class="swatch s1"></div><div class="swatch s2"></div><div class="swatch s3"></div><div class="swatch s4"></div></div>
<div class="hexes"><div class="hex">{{hex1}}</div><div class="hex">{{hex2}}</div><div class="hex">{{hex3}}</div><div class="hex">{{hex4}}</div></div>
<div class="name"><div class="t">{{paletteName}}</div><div class="s">{{paletteUseCase}}</div></div>
<div class="page">{{pageOf}}</div>
</body></html>
