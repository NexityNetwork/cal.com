<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,400;1,600;1,800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f0ede8;font-family:"Inter",sans-serif;color:#111;-webkit-font-smoothing:antialiased}
.frame{position:absolute;inset:0;display:flex;flex-direction:row}
.left-panel{width:232px;background:#d62828;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;gap:0}
.left-panel .sec-num{font-size:170px;font-weight:900;color:#f0ede8;letter-spacing:-5px;line-height:1;writing-mode:vertical-rl;transform:rotate(180deg)}
.left-panel .sec-bar{width:40px;height:3px;background:rgba(240,237,232,0.4);margin:24px 0}
.left-panel .sec-lbl{font-size:10px;font-weight:700;color:rgba(240,237,232,0.6);letter-spacing:0.28em;text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg)}
.right-panel{flex:1;padding:48px 56px;display:flex;flex-direction:column;gap:0;background:#f0ede8}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:2px solid #111}
.num-badge{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;background:#111;color:#f0ede8;border-radius:4px;font-size:18px;font-weight:900;letter-spacing:0.06em}
.section-lbl{font-size:11px;font-weight:700;letter-spacing:0.28em;color:#d62828;text-transform:uppercase}
.handle{font-size:12px;color:#666;font-weight:600}
.title-block{padding:24px 0;border-bottom:1px solid #bab6ae}
.title{font-size:74px;font-weight:900;line-height:0.95;letter-spacing:-2px;color:#111;text-transform:uppercase}
.title .accent{color:#d62828}
.subtitle{font-family:"Playfair Display",serif;font-size:20px;color:#444;line-height:1.45;font-style:italic;margin-top:14px;max-width:700px}
.body-block{flex:1;padding:24px 0;display:flex;flex-direction:column;justify-content:space-between;border-bottom:1px solid #bab6ae}
.body-text{font-size:20px;color:#2a2a28;line-height:1.6;font-weight:400;max-width:740px}
.callout{padding:20px 22px;background:#111;border-radius:6px;border-left:5px solid #d62828}
.callout .cl{font-size:11px;font-weight:700;color:#d62828;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:8px}
.callout .ct{font-family:"Playfair Display",serif;font-size:18px;color:#f0ede8;font-style:italic;line-height:1.4}
.stats-block{padding:20px 0 0;display:flex;gap:14px}
.stat{flex:1;padding:16px 16px;border-top:4px solid #d62828;background:transparent}
.stat .v{font-size:38px;font-weight:900;color:#d62828;line-height:1;letter-spacing:-0.5px}
.stat .l{font-size:11px;font-weight:700;color:#666;letter-spacing:0.18em;text-transform:uppercase;margin-top:5px}
.bottom-bar{display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:2px solid #111}
.chips{display:flex;gap:8px}
.chip{width:36px;height:36px;border-radius:4px;background:#f0ede8;border:1.5px solid #bab6ae;display:flex;align-items:center;justify-content:center;padding:5px}
.chip svg{width:100%;height:100%}
.pg{font-size:20px;font-weight:900;color:#d62828;letter-spacing:0.02em}
</style></head>
<body>
<div class="frame">
  <div class="left-panel">
    <div class="sec-num">{{numLabel}}</div>
    <div class="sec-bar"></div>
    <div class="sec-lbl">{{sectionLabel}}</div>
  </div>
  <div class="right-panel">
    <div class="top-bar">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="num-badge">{{numLabel}}</div>
        <div class="section-lbl">{{sectionLabel}}</div>
      </div>
      <div class="handle">{{handle}}</div>
    </div>
    <div class="title-block">
      <div class="title">{{title}}<br><span class="accent">{{titleAccent}}</span></div>
      <div class="subtitle">{{subtitle}}</div>
    </div>
    <div class="body-block">
      <div class="body-text">{{bodyText}}</div>
      <div class="callout">
        <div class="cl">{{calloutLabel}}</div>
        <div class="ct">{{calloutBody}}</div>
      </div>
    </div>
    <div class="stats-block">
      <div class="stat"><div class="v">{{m1Value}}</div><div class="l">{{m1Label}}</div></div>
      <div class="stat"><div class="v">{{m2Value}}</div><div class="l">{{m2Label}}</div></div>
      <div class="stat"><div class="v">{{m3Value}}</div><div class="l">{{m3Label}}</div></div>
    </div>
    <div class="bottom-bar">
      <div class="chips">
        <div class="chip">{{iconSvg1}}</div>
        <div class="chip">{{iconSvg2}}</div>
        <div class="chip">{{iconSvg3}}</div>
        <div class="chip">{{iconSvg4}}</div>
      </div>
      <div class="pg">{{pageOf}}</div>
    </div>
  </div>
</div>
</body></html>
