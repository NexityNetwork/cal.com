<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#1a1612;font-family:"Inter",sans-serif;color:#f5ede2;-webkit-font-smoothing:antialiased;}
  .dot-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.06) 1px,transparent 1px);background-size:24px 24px;}
  .card{position:absolute;left:54px;right:54px;border:1px solid rgba(255,90,40,0.18);border-radius:30px;background:rgba(255,255,255,0.015);}
  .card-top{top:62px;padding:54px 70px;text-align:center;}
  .card-top .headline{font-size:62px;font-weight:800;line-height:1.1;letter-spacing:-1px;color:#f5ede2;}
  .card-top .accent{color:#ff5a28;}
  .target{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:520px;height:520px;display:flex;align-items:center;justify-content:center;}
  .target::before,.target::after{content:"";position:absolute;border:1px solid rgba(255,90,40,0.18);border-radius:50%;}
  .target::before{width:520px;height:520px;}
  .target::after{width:380px;height:380px;}
  .ticks{position:absolute;width:520px;height:520px;}
  .tick{position:absolute;width:6px;height:14px;background:rgba(255,90,40,0.35);top:0;left:50%;margin-left:-3px;transform-origin:3px 260px;}
  .brick{font-family:"Inter",sans-serif;font-size:110px;font-weight:900;line-height:0.95;color:#ff5a28;text-align:center;letter-spacing:1px;text-shadow:0 0 60px rgba(255,90,40,0.25);position:relative;z-index:2;font-variant-numeric:tabular-nums;}
  .brick span{display:block;-webkit-text-stroke:0;background:repeating-linear-gradient(90deg,#ff5a28 0px,#ff5a28 14px,#1a1612 14px,#1a1612 17px);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .card-bot{bottom:62px;padding:42px 60px;text-align:center;}
  .card-bot .sub{font-size:30px;font-weight:600;color:#f5ede2;}
  .card-bot .sub .em{color:#ff5a28;}
  .card-bot .note{font-size:20px;font-weight:500;color:rgba(245,237,226,0.5);margin-top:10px;font-style:italic;}
  .ticks .t1{transform:rotate(0deg);}.ticks .t2{transform:rotate(30deg);}.ticks .t3{transform:rotate(60deg);}.ticks .t4{transform:rotate(90deg);}.ticks .t5{transform:rotate(120deg);}.ticks .t6{transform:rotate(150deg);}.ticks .t7{transform:rotate(180deg);}.ticks .t8{transform:rotate(210deg);}.ticks .t9{transform:rotate(240deg);}.ticks .t10{transform:rotate(270deg);}.ticks .t11{transform:rotate(300deg);}.ticks .t12{transform:rotate(330deg);}
  .progress{position:absolute;bottom:0;left:0;height:8px;width:14%;background:#ff5a28;}
</style></head>
<body>
  <div class="dot-grid"></div>
  <div class="card card-top">
    <div class="headline">{{topLine1}}<br><span class="accent">{{topLine2}}</span><br>{{topLine3}}</div>
  </div>
  <div class="target">
    <div class="ticks"><div class="tick t1"></div><div class="tick t2"></div><div class="tick t3"></div><div class="tick t4"></div><div class="tick t5"></div><div class="tick t6"></div><div class="tick t7"></div><div class="tick t8"></div><div class="tick t9"></div><div class="tick t10"></div><div class="tick t11"></div><div class="tick t12"></div></div>
    <div class="brick"><span>{{brickLine1}}</span><span>{{brickLine2}}</span></div>
  </div>
  <div class="card card-bot">
    <div class="sub">{{subLine}} <span class="em">{{subAccent}}</span>{{subTail}} →</div>
    <div class="note">({{note}})</div>
  </div>
  <div class="progress"></div>
</body></html>
