<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#fafafa;font-family:"Inter",sans-serif;color:#1d1d1d;-webkit-font-smoothing:antialiased}
.badge{position:absolute;top:65px;left:75px;width:92px;height:50px;background:#3457d5;border-radius:1000px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Geist",sans-serif;font-size:24px;font-weight:700}
.handle{position:absolute;top:70px;right:75px;font-family:"Geist",sans-serif;font-size:32px;font-weight:500;color:#4b5563}
.eyebrow{position:absolute;top:200px;left:75px;display:inline-flex;align-items:center;gap:14px;padding:14px 28px;background:#3457d5;color:#fff;border-radius:50px;font-family:"Geist",sans-serif;font-size:22px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase}
.title{position:absolute;top:300px;left:75px;right:75px;font-family:"Inter",sans-serif;font-size:104px;font-weight:700;line-height:1.05;letter-spacing:-2.5px;color:#1d1d1d}
.title .accent{color:#3457d5}
.body{position:absolute;top:760px;left:75px;right:75px;font-family:"Inter",sans-serif;font-size:42px;font-weight:500;line-height:1.4;color:#4b5563}
.cta-row{position:absolute;bottom:85px;left:75px;right:75px;display:flex;justify-content:space-between;align-items:center}
.btn{display:inline-flex;align-items:center;gap:14px;padding:18px 30px;background:#3457d5;color:#fff;border-radius:50px;font-size:22px;font-weight:600}
.arrow-circle{width:54px;height:54px;background:#3457d5;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
</style></head>
<body>
<div class="badge">{{number}}</div>
<div class="handle">{{handle}}</div>
<div class="eyebrow">{{eyebrow}}</div>
<div class="title">{{titleLine1}} <span class="accent">{{titleAccent}}</span></div>
<div class="body">{{body}}</div>
<div class="cta-row">
  <div class="btn">{{ctaLabel}}</div>
  <div class="arrow-circle">→</div>
</div>
</body></html>
