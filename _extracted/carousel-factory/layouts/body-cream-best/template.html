<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f1f1f1;font-family:"Inter",sans-serif;color:#37474f;-webkit-font-smoothing:antialiased}
.num{position:absolute;top:200px;left:100px;font-size:88px;font-weight:500;line-height:1;color:transparent;-webkit-text-stroke:2.5px #1acd8a;letter-spacing:-2px}
.title{position:absolute;top:306px;left:100px;right:100px;font-family:"Inter",sans-serif;font-size:88px;font-weight:500;line-height:1.05;color:#1acd8a;letter-spacing:-2px}
.body{position:absolute;top:546px;left:100px;right:100px;font-size:36px;font-weight:400;line-height:1.55;color:#37474f}
.image-card{position:absolute;top:706px;left:100px;right:100px;height:450px;background:#ffffff;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:42px 48px;overflow:hidden}
.image-left{flex:0.55}
.image-left .label{font-size:22px;font-weight:600;color:#1acd8a;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:18px}
.image-left .ck{font-size:42px;font-weight:700;color:#37474f;line-height:1.1;letter-spacing:-1px;margin-bottom:14px}
.image-left .cv{font-size:22px;font-weight:400;color:#5a6a72;line-height:1.4}
.image-right{flex:0.4;display:flex;align-items:center;justify-content:center}
.glyph-box{width:160px;height:160px;background:#1acd8a;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:74px;font-weight:900;color:#fff}
.bottom{position:absolute;bottom:64px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
.pill{padding:14px 32px;background:#1acd8a;color:#ffffff;border-radius:50px;font-size:18px;font-weight:500;display:inline-flex;align-items:center;gap:10px}
</style></head>
<body>
<div class="num">{{number}}.</div>
<div class="title">{{titleLine1}}<br>{{titleLine2}}</div>
<div class="body">{{body}}</div>
<div class="image-card">
  <div class="image-left">
    <div class="label">{{tileLabel}}</div>
    <div class="ck">{{tileKey}}</div>
    <div class="cv">{{tileValue}}</div>
  </div>
  <div class="image-right"><div class="glyph-box">{{tileGlyph}}</div></div>
</div>
<div class="bottom">
  <div class="pill">{{pageOf}}</div>
  <div class="pill">Swipe ⓘ</div>
</div>
</body></html>
