<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f6f1e6;font-family:"Inter",sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.page{position:absolute;top:80px;left:80px;font-size:18px;font-weight:700;letter-spacing:0.04em}
.author{position:absolute;top:80px;right:80px;display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}
.author-info{text-align:right}
.author-info .name{font-size:16px;font-weight:700;line-height:1.2}
.author-info .handle{font-size:13px;color:#7a7464;line-height:1.2}
.num{position:absolute;top:200px;left:80px;font-size:120px;font-weight:900;color:#d65f3e;line-height:1;letter-spacing:-4px}
.title{position:absolute;top:380px;left:80px;right:80px;font-size:72px;font-weight:800;line-height:0.98;letter-spacing:-2px;color:#1a1a1a}
.body{position:absolute;top:640px;left:80px;right:80px;font-size:30px;font-weight:400;line-height:1.55;color:#3a3530}
.tile{position:absolute;bottom:160px;left:80px;right:80px;padding:34px;background:#fff;border-radius:20px;border:2px solid #1a1a1a;display:flex;align-items:center;gap:24px}
.tile-icon{width:72px;height:72px;background:#d65f3e;color:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;flex-shrink:0}
.tile-text .key{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.tile-text .val{font-size:20px;font-weight:500;color:#5a5450}
.bottom{position:absolute;bottom:60px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.swipe{font-size:22px;font-weight:600;color:#7a7464}
.dots{display:flex;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#d6cdb8}
.dot.active{background:#1a1a1a;width:32px;border-radius:5px}
</style></head>
<body>
<div class="page">{{pageOf}}</div>
<div class="author"><div class="avatar">{{authorInitials}}</div><div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div></div>
<div class="num">{{number}}</div>
<div class="title">{{title}}</div>
<div class="body">{{body}}</div>
<div class="tile"><div class="tile-icon">{{tileGlyph}}</div><div class="tile-text"><div class="key">{{tileKey}}</div><div class="val">{{tileValue}}</div></div></div>
<div class="bottom"><div class="dots"><div class="dot"></div><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div class="swipe">Swipe ⟶</div></div>
</body></html>
