<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f3ede0;font-family:"Inter",sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.page{position:absolute;top:80px;left:80px;font-size:18px;font-weight:700}
.author{position:absolute;top:80px;right:80px;display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}
.author-info{text-align:right}
.author-info .name{font-size:16px;font-weight:700;line-height:1.2}
.author-info .handle{font-size:13px;color:#7a7464;line-height:1.2}
.num-row{position:absolute;top:200px;left:80px;display:flex;align-items:baseline;gap:18px}
.num{font-size:88px;font-weight:900;line-height:1;letter-spacing:-3px;color:{{themeColor}}}
.num-label{font-size:20px;font-weight:700;color:#7a7464;letter-spacing:0.1em;text-transform:uppercase}
.title{position:absolute;top:340px;left:80px;right:80px;font-size:68px;font-weight:800;line-height:1;letter-spacing:-1.5px}
.title .accent{color:{{themeColor}}}
.body{position:absolute;top:540px;left:80px;right:80px;font-size:28px;font-weight:400;line-height:1.55;color:#3a3530;max-width:920px}
.hero-tile{position:absolute;bottom:200px;left:80px;right:80px;height:280px;border-radius:24px;background:{{themeColor}};display:flex;align-items:center;justify-content:space-between;padding:36px 48px;color:#fff}
.hero-text .ck{font-size:18px;font-weight:700;letter-spacing:0.14em;opacity:0.85;margin-bottom:8px;text-transform:uppercase}
.hero-text .cv{font-size:48px;font-weight:800;line-height:1.05;letter-spacing:-1px}
.hero-glyph{font-size:144px;font-weight:900;opacity:0.85}
.bottom{position:absolute;bottom:60px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.handle{font-size:16px;font-weight:600;color:#7a7464}
.swipe{padding:10px 22px;background:#1a1a1a;color:#fff;border-radius:50px;font-size:16px;font-weight:600}
</style></head>
<body>
<div class="page">{{pageOf}}</div>
<div class="author"><div class="avatar">{{authorInitials}}</div><div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div></div>
<div class="num-row"><div class="num">{{number}}</div><div class="num-label">{{numberLabel}}</div></div>
<div class="title">{{titleMain}} <span class="accent">{{titleAccent}}</span></div>
<div class="body">{{body}}</div>
<div class="hero-tile"><div class="hero-text"><div class="ck">{{heroKey}}</div><div class="cv">{{heroValue}}</div></div><div class="hero-glyph">{{heroGlyph}}</div></div>
<div class="bottom"><div class="handle">{{handle}}</div><div class="swipe">Swipe →</div></div>
</body></html>
