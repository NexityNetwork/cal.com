<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f8fafc;font-family:"Inter",sans-serif;color:#121926;-webkit-font-smoothing:antialiased}
.title{position:absolute;top:200px;left:75px;right:75px;font-size:64px;font-weight:600;color:#121926;letter-spacing:-1.2px;line-height:1.15}
.title .accent{color:#3457d5}
.rows{position:absolute;top:380px;left:75px;right:75px;display:flex;flex-direction:column;gap:24px}
.attribute-row{display:flex;align-items:center;gap:24px}
.check{width:54px;height:54px;border-radius:14px;background:#3457d5;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:700;flex-shrink:0}
.attribute-label{font-size:48px;font-weight:400;color:#121926}
.body{position:absolute;bottom:220px;left:75px;right:75px;font-size:32px;font-weight:500;color:#4b5563;line-height:1.45;padding:32px 36px;background:#fff;border-radius:18px;border:1.5px solid #e5e7eb}
.foot{position:absolute;bottom:75px;left:100px;right:100px;display:flex;justify-content:space-between;align-items:center}
.foot .num{font-size:48px;font-weight:400;color:#4b5565}
.foot .handle{font-size:32px;color:#4b5565}
</style></head>
<body>
<div class="title">{{titleLine1}}<br><span class="accent">{{titleAccent}}</span></div>
<div class="rows">
  <div class="attribute-row"><div class="check">✓</div><div class="attribute-label">{{attr1}}</div></div>
  <div class="attribute-row"><div class="check">✓</div><div class="attribute-label">{{attr2}}</div></div>
  <div class="attribute-row"><div class="check">✓</div><div class="attribute-label">{{attr3}}</div></div>
  <div class="attribute-row"><div class="check">✓</div><div class="attribute-label">{{attr4}}</div></div>
</div>
<div class="body">{{body}}</div>
<div class="foot"><div class="num">{{number}}</div><div class="handle">{{handle}}</div></div>
</body></html>
