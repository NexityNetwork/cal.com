<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#000;font-family:"Inter",sans-serif;color:#fff;-webkit-font-smoothing:antialiased;}
  .card{position:absolute;top:48px;left:48px;right:48px;bottom:48px;border:1.5px solid rgba(255,255,255,0.12);border-radius:36px;padding:54px;display:flex;flex-direction:column;}
  .page-badge{display:inline-block;padding:6px 18px;background:rgba(196,84,31,0.18);border:1px solid rgba(196,84,31,0.6);color:#ff7a3f;border-radius:8px;font-size:20px;font-weight:700;align-self:flex-start;}
  .headline{margin-top:88px;font-size:84px;font-weight:800;line-height:1.05;letter-spacing:-2px;}
  .headline .accent{color:#ff7a3f;}
  .icons-cluster{flex:1;display:flex;align-items:center;justify-content:center;gap:60px;position:relative;}
  .icon-bubble{width:160px;height:160px;border:1.5px solid rgba(255,255,255,0.18);border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.02);position:absolute;}
  .icon-bubble.b1{top:80px;left:18%;}
  .icon-bubble.b2{top:30px;right:14%;}
  .icon-bubble.b3{bottom:60px;left:30%;}
  .icon-bubble.b4{bottom:30px;right:24%;}
  .icon-img{width:96px;height:96px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:#fff;}
  .ico-1{background:linear-gradient(135deg,#fbbf24,#ec4899 50%,#8b5cf6);}
  .ico-2{background:#ff0000;color:#fff;}
  .ico-3{background:#000;color:#fff;border:1px solid #fff;}
  .ico-4{background:#0a66c2;color:#fff;}
  .body-text{margin-top:24px;font-size:30px;font-weight:500;line-height:1.5;color:rgba(255,255,255,0.7);max-width:760px;}
  .body-text .em{color:#ff7a3f;font-weight:700;}
</style></head>
<body>
  <div class="card">
    <div class="page-badge">{{pageBadge}}</div>
    <div class="headline">{{headlineLine1}}<br><span class="accent">{{headlineLine2}}</span></div>
    <div class="icons-cluster">
      <div class="icon-bubble b1"><div class="icon-img ico-1">📷</div></div>
      <div class="icon-bubble b2"><div class="icon-img ico-2">▶</div></div>
      <div class="icon-bubble b3"><div class="icon-img ico-3">♪</div></div>
      <div class="icon-bubble b4"><div class="icon-img ico-4">in</div></div>
    </div>
    <div class="body-text">{{body}}<span class="em"> {{bodyAccent}}</span></div>
  </div>
</body></html>
