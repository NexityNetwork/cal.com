<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#f5f0e8;font-family:"IBM Plex Mono",monospace;color:#1a1a1a;-webkit-font-smoothing:antialiased;}
  .top-strip{position:absolute;top:0;left:0;right:0;height:8px;background:#c4541f;}
  .header{position:absolute;top:48px;left:80px;right:80px;display:flex;justify-content:space-between;font-size:22px;font-weight:700;color:#c4541f;letter-spacing:0.1em;}
  .header .handle{color:#1a1a1a;font-weight:500;}
  .pattern-pill{position:absolute;top:130px;left:80px;display:inline-flex;align-items:center;gap:10px;background:#1a1a1a;color:#fff;padding:14px 22px;border-radius:6px;font-size:24px;font-weight:700;letter-spacing:0.06em;}
  .pattern-pill::before{content:"▲";color:#c4541f;font-size:18px;}
  .headline{position:absolute;top:230px;left:80px;right:80px;font-size:160px;font-weight:700;line-height:0.92;letter-spacing:-4px;color:#1a1a1a;text-transform:uppercase;}
  .headline .em{color:#c4541f;}
  .body{position:absolute;top:760px;left:80px;right:80px;font-size:28px;line-height:1.55;color:#1a1a1a;}
  .quote{position:absolute;top:920px;left:80px;right:80px;padding:24px 28px;background:#1a1a1a;color:#fff;border-radius:10px;font-size:24px;font-weight:500;line-height:1.5;border-left:6px solid #c4541f;}
  .footer-row{position:absolute;bottom:96px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;}
  .cta-btn{padding:18px 32px;background:#c4541f;color:#fff;border-radius:8px;font-size:24px;font-weight:700;letter-spacing:0.04em;}
  .pageOf{font-size:22px;font-weight:500;color:rgba(26,26,26,0.5);}
  .rule{position:absolute;bottom:54px;left:80px;right:80px;height:1px;background:rgba(26,26,26,0.18);}
  .bottom-row{position:absolute;bottom:24px;left:80px;right:80px;display:flex;justify-content:space-between;font-size:18px;color:rgba(26,26,26,0.55);}
</style></head>
<body>
  <div class="top-strip"></div>
  <div class="header"><div>{{pageOf}}</div><div class="handle">{{handle}}</div></div>
  <div class="pattern-pill">{{patternLabel}}</div>
  <div class="headline">{{word1}}<br><span class="em">{{word2}}</span><span class="em">.</span></div>
  <div class="body">{{body}}</div>
  <div class="quote">{{quote}}</div>
  <div class="footer-row">
    <div class="cta-btn">{{buttonLabel}} →</div>
    <div class="pageOf">{{rightNote}}</div>
  </div>
  <div class="rule"></div>
  <div class="bottom-row"><div>{{footerLeft}}</div><div>{{footerRight}}</div></div>
</body></html>
