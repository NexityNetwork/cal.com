<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f8fafc;font-family:"Inter",sans-serif;color:#121926;-webkit-font-smoothing:antialiased}
.title{position:absolute;top:140px;left:100px;right:100px;font-size:58px;font-weight:600;color:#121926;letter-spacing:-1px;line-height:1.1}
.sub{position:absolute;top:230px;left:100px;right:100px;font-size:32px;font-weight:400;color:#4b5565;line-height:1.4}
.checks{position:absolute;top:340px;left:100px;right:100px;display:flex;flex-direction:column;gap:24px}
.check-row{display:flex;align-items:flex-start;gap:18px}
.check-box{width:36px;height:36px;border-radius:8px;background:#3457d5;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700;flex-shrink:0}
.check-label{font-size:32px;font-weight:400;color:#4b5565;line-height:1.35;padding-top:2px}
.image-card{position:absolute;top:600px;left:100px;right:100px;height:560px;background:#1a1a1a;border-radius:24px;display:flex;align-items:center;justify-content:center;padding:60px}
.preview-row{display:flex;gap:24px;align-items:center}
.preview-card{width:170px;height:380px;border-radius:14px;background:#2a2a2a;display:flex;flex-direction:column;padding:24px 18px;border:1px solid #3a3a3a}
.preview-card .pc-icon{font-size:48px;margin-bottom:14px}
.preview-card .pc-t{font-size:18px;font-weight:700;color:#fafafa;margin-bottom:10px;line-height:1.2}
.preview-card .pc-s{font-size:14px;color:#9ca3af;line-height:1.35}
.foot{position:absolute;bottom:75px;left:100px;right:100px;display:flex;justify-content:space-between;align-items:center}
.foot .num{font-size:48px;font-weight:400;color:#4b5565}
.foot .handle{font-size:32px;color:#4b5565}
</style></head>
<body>
<div class="title">{{title}}</div>
<div class="sub">{{subtitle}}</div>
<div class="checks">
  <div class="check-row"><div class="check-box">✓</div><div class="check-label">{{check1}}</div></div>
  <div class="check-row"><div class="check-box">✓</div><div class="check-label">{{check2}}</div></div>
  <div class="check-row"><div class="check-box">✓</div><div class="check-label">{{check3}}</div></div>
</div>
<div class="image-card">
  <div class="preview-row">
    <div class="preview-card"><div class="pc-icon">{{cardGlyph1}}</div><div class="pc-t">{{cardTitle1}}</div><div class="pc-s">{{cardSub1}}</div></div>
    <div class="preview-card"><div class="pc-icon">{{cardGlyph2}}</div><div class="pc-t">{{cardTitle2}}</div><div class="pc-s">{{cardSub2}}</div></div>
    <div class="preview-card"><div class="pc-icon">{{cardGlyph3}}</div><div class="pc-t">{{cardTitle3}}</div><div class="pc-s">{{cardSub3}}</div></div>
    <div class="preview-card"><div class="pc-icon">{{cardGlyph4}}</div><div class="pc-t">{{cardTitle4}}</div><div class="pc-s">{{cardSub4}}</div></div>
  </div>
</div>
<div class="foot"><div class="num">{{number}}</div><div class="handle">{{handle}}</div></div>
</body></html>
