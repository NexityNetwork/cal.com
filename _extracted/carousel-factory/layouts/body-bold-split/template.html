<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#f7f5ef;font-family:"Inter",sans-serif;color:#2c2c2c;-webkit-font-smoothing:antialiased;}
  .split-right{position:absolute;top:0;right:0;width:380px;height:100%;background:#4a4a4a;clip-path:polygon(20% 0,100% 0,100% 100%,40% 100%);}
  .dot-circle{position:absolute;top:40px;left:40px;width:180px;height:180px;border-radius:50%;
    background-image:radial-gradient(circle,#2c2c2c 2.5px,transparent 3px);
    background-size:22px 22px;}
  .number{position:absolute;top:90px;right:80px;
    font-family:"Oswald",sans-serif;font-weight:700;
    font-size:88px;line-height:1;color:#f7f5ef;}
  .display{position:absolute;top:280px;left:80px;width:660px;
    font-family:"Oswald",sans-serif;font-weight:700;
    font-size:120px;line-height:0.94;letter-spacing:-0.005em;
    color:#2c2c2c;text-transform:uppercase;}
  .body{position:absolute;top:740px;left:80px;width:660px;
    font-size:32px;font-weight:400;line-height:1.5;color:#2c2c2c;}
  .handle-pill{position:absolute;left:80px;bottom:120px;
    height:64px;padding:0 30px;
    background:#f7f5ef;border:1.5px solid #2c2c2c;border-radius:32px;
    display:inline-flex;align-items:center;gap:14px;
    font-size:26px;font-weight:500;color:#2c2c2c;}
  .handle-pill::before,.handle-pill::after{content:"✱";font-size:20px;}
</style></head>
<body>
  <div class="split-right"></div>
  <div class="dot-circle"></div>
  <div class="number">{{number}}</div>
  <div class="display">{{title}}</div>
  <div class="body">{{body}}</div>
  <div class="handle-pill">{{handle}}</div>
</body></html>
