<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,wght@0,400;1,400;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f5efe2;font-family:"Inter",sans-serif;color:#1a1410;-webkit-font-smoothing:antialiased}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(26,20,16,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(26,20,16,0.04) 1px,transparent 1px);background-size:80px 100px}
.tag-strip{position:absolute;top:80px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.tag-pill{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;background:#1a1410;color:#f5efe2;border-radius:50px;font-size:16px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase}
.num-pill{font-family:"JetBrains Mono",monospace;font-size:16px;color:#52443a;font-weight:500}
.section-num{position:absolute;top:200px;left:80px;font-family:"Fraunces",serif;font-style:italic;font-weight:400;font-size:180px;line-height:1;color:#d97757;letter-spacing:-4px}
.headline-block{position:absolute;top:230px;left:280px;right:80px}
.eyebrow{font-size:18px;font-weight:700;letter-spacing:0.14em;color:#d97757;text-transform:uppercase;margin-bottom:14px}
.title{font-size:70px;font-weight:800;line-height:1.0;letter-spacing:-2px;color:#1a1410;margin-bottom:20px}
.title em{font-family:"Fraunces",serif;font-style:italic;font-weight:400;color:#52443a}
.subtitle{font-size:24px;font-weight:400;color:#52443a;line-height:1.5;max-width:680px}
.code-card{position:absolute;top:560px;left:80px;right:80px;background:#1a1410;border-radius:18px;padding:30px 32px;font-family:"JetBrains Mono",monospace;font-size:18px;line-height:1.7;color:#f5efe2}
.code-card .com{color:#7a6a58}
.code-card .kw{color:#d97757;font-weight:700}
.code-card .str{color:#86d9a8}
.code-card .fn{color:#e8a87c}
.bullets{position:absolute;bottom:200px;left:80px;right:80px;display:flex;flex-direction:column;gap:14px}
.bullet{padding:22px 28px;background:#ffffff;border-radius:16px;border:1px solid rgba(26,20,16,0.08);display:flex;align-items:flex-start;gap:18px}
.bullet .ck{width:36px;height:36px;border-radius:10px;background:#d97757;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;flex-shrink:0}
.bullet .bt{font-size:22px;font-weight:700;color:#1a1410;line-height:1.3;margin-bottom:4px}
.bullet .bs{font-size:18px;color:#52443a;line-height:1.4}
.bottom-row{position:absolute;bottom:80px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.bottom-row .domain{font-size:18px;color:#52443a;font-weight:500}
.bottom-row .page{font-size:18px;color:#52443a;font-weight:500}
</style></head>
<body>
<div class="grid-bg"></div>
<div class="tag-strip"><div class="tag-pill">{{tag}}</div><div class="num-pill">{{stepMeta}}</div></div>
<div class="section-num">{{sectionNum}}</div>
<div class="headline-block">
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="title">{{title}} <em>{{titleItalic}}</em></div>
  <div class="subtitle">{{subtitle}}</div>
</div>
<div class="code-card">
  <span class="com">// {{codeComment}}</span><br>
  <span class="kw">{{codeKeyword}}</span> <span class="fn">{{codeFn}}</span>(<span class="str">"{{codeArg}}"</span>);
</div>
<div class="bullets">
  <div class="bullet"><div class="ck">✓</div><div><div class="bt">{{b1Title}}</div><div class="bs">{{b1Body}}</div></div></div>
  <div class="bullet"><div class="ck">✓</div><div><div class="bt">{{b2Title}}</div><div class="bs">{{b2Body}}</div></div></div>
</div>
<div class="bottom-row"><div class="domain">{{domainText}}</div><div class="page">{{pageOf}}</div></div>
</body></html>
