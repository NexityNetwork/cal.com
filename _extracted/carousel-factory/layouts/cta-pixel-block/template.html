<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,wght@1,400;1,600&family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a;font-family:"Inter",sans-serif;color:#fafafa;-webkit-font-smoothing:antialiased}
.dotgrid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.04) 1px,transparent 1px);background-size:24px 24px}
.glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:780px;height:780px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,40,0.18) 0%,transparent 60%);pointer-events:none}
.outline{position:absolute;inset:24px;border:1px solid rgba(255,255,255,0.06);border-radius:28px;pointer-events:none;z-index:10}
.top-row{position:absolute;top:64px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.brand{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;background:rgba(255,90,40,0.12);border:1px solid rgba(255,90,40,0.4);color:#ff7a3c;border-radius:50px;font-size:16px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase}
.handle-text{font-family:"Inter",sans-serif;font-size:16px;color:#71717a}
.center{position:absolute;top:50%;left:80px;right:80px;transform:translateY(-50%);text-align:center}
.eyebrow{font-family:"Fraunces",serif;font-style:italic;font-size:38px;color:#a3a3a3;margin-bottom:30px}
.pixel-headline{font-family:"Press Start 2P",monospace;font-size:88px;color:#ff7a3c;line-height:1.1;letter-spacing:2px;text-shadow:0 0 50px rgba(255,90,40,0.45);margin-bottom:24px}
.pixel-headline.alt{color:#fafafa;text-shadow:none}
.sub{font-family:"Fraunces",serif;font-style:italic;font-size:32px;font-weight:400;color:#a3a3a3;line-height:1.4;max-width:780px;margin:24px auto 44px}
.btn-row{display:flex;justify-content:center;gap:18px;margin-bottom:36px}
.btn-primary{padding:24px 50px;background:#ff7a3c;color:#0a0a0a;border-radius:14px;font-size:22px;font-weight:800;letter-spacing:-0.3px}
.btn-ghost{padding:24px 36px;background:transparent;border:1.5px solid rgba(255,255,255,0.2);color:#fafafa;border-radius:14px;font-size:20px;font-weight:600}
.stack-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.stack-row .chip{width:54px;height:54px;border-radius:12px;background:#fafafa;display:flex;align-items:center;justify-content:center;padding:9px}
.stack-row .chip svg{width:100%;height:100%}
.bottom-row{position:absolute;bottom:64px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.bottom-row .pg{font-size:14px;color:#71717a;font-family:"JetBrains Mono",monospace}
.bottom-row .note{font-size:14px;color:#71717a;font-family:"JetBrains Mono",monospace}
</style></head>
<body>
<div class="dotgrid"></div>
<div class="glow"></div>
<div class="outline"></div>
<div class="top-row"><div class="brand">{{brandTag}}</div><div class="handle-text">{{handle}}</div></div>
<div class="center">
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="pixel-headline">{{ctaLine1}}</div>
  <div class="pixel-headline alt">{{ctaLine2}}</div>
  <div class="sub">{{ctaBody}}</div>
  <div class="btn-row"><div class="btn-primary">{{btnPrimary}}</div><div class="btn-ghost">{{btnGhost}}</div></div>
  <div class="stack-row">
    <div class="chip">{{iconSvg1}}</div>
    <div class="chip">{{iconSvg2}}</div>
    <div class="chip">{{iconSvg3}}</div>
    <div class="chip">{{iconSvg4}}</div>
    <div class="chip">{{iconSvg5}}</div>
    <div class="chip">{{iconSvg6}}</div>
  </div>
</div>
<div class="bottom-row"><div class="pg">{{pageOf}}</div><div class="note">{{footerNote}}</div></div>
</body></html>
