<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#d1f5d8;font-family:"Inter",sans-serif;color:#1f3a30;-webkit-font-smoothing:antialiased}
.author{position:absolute;top:60px;left:80px;display:flex;align-items:center;gap:16px}
.avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;border:2px solid #2dad6b;flex-shrink:0}
.author-info .name{font-size:20px;font-weight:700;color:#1f3a30;line-height:1.2}
.author-info .handle{font-size:16px;font-weight:500;color:#5a7a6e;line-height:1.2}
.center{position:absolute;top:50%;left:80px;right:80px;transform:translateY(-48%);text-align:center}
.eyebrow{font-size:22px;font-weight:700;letter-spacing:0.18em;color:#2dad6b;margin-bottom:32px;text-transform:uppercase}
.headline{font-family:"Barlow Condensed",sans-serif;font-weight:300;font-size:148px;line-height:0.96;letter-spacing:-2px;color:#1f3a30;margin-bottom:18px}
.headline .accent{font-weight:800}
.body{font-size:30px;font-weight:400;line-height:1.5;color:#3a5a4e;max-width:760px;margin:24px auto 48px}
.btn{display:inline-block;padding:24px 56px;background:#2dad6b;color:#fff;border-radius:50px;font-size:24px;font-weight:700}
.bottom{position:absolute;bottom:60px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.page-pill{padding:12px 24px;background:#2dad6b;color:#fff;border-radius:50px;font-size:18px;font-weight:600}
.handle-pill{padding:12px 24px;background:transparent;color:#5a7a6e;border-radius:50px;font-size:18px;font-weight:600}
</style></head>
<body>
<div class="author"><div class="avatar">{{authorInitials}}</div><div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div></div>
<div class="center">
<div class="eyebrow">{{eyebrow}}</div>
<div class="headline">{{headlineLine1}}<br><span class="accent">{{headlineAccent}}</span></div>
<div class="body">{{body}}</div>
<div class="btn">{{buttonLabel}} ⟶</div>
</div>
<div class="bottom"><div class="page-pill">{{pageOf}}</div><div class="handle-pill">{{handle}}</div></div>
</body></html>
