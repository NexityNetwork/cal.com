<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;700&family=Geist:wght@400;500&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#1d1d1d;font-family:"Inter",sans-serif;color:#fafafa;-webkit-font-smoothing:antialiased}
.badge{position:absolute;top:60px;left:75px;width:88px;height:50px;background:#3a3a3a;border-radius:1000px;display:flex;align-items:center;justify-content:center;color:#fafafa;font-family:"Geist",sans-serif;font-size:24px;font-weight:700}
.handle{position:absolute;top:70px;right:75px;font-family:"Geist",sans-serif;font-size:32px;font-weight:500;color:#fafafa}
.name-card{position:absolute;top:180px;left:60px;right:60px;height:340px;background:#2a2a2a;border-radius:30px;display:flex;align-items:center;justify-content:center}
.font-name{font-family:"{{fontFamily}}",serif;font-size:120px;font-weight:600;color:#fafafa;letter-spacing:-2px}
.row-card{position:absolute;top:570px;left:60px;display:flex;gap:24px;align-items:stretch}
.aa-card{width:620px;height:320px;background:#2a2a2a;border-radius:30px;display:flex;align-items:center;justify-content:center;gap:50px;padding:0 40px}
.aa-card .ch{font-family:"{{fontFamily}}",serif;font-size:118px;color:#fafafa;line-height:1}
.aa-card .ch-1{font-weight:700}
.aa-card .ch-2{font-weight:500}
.aa-card .ch-3{font-weight:400}
.amp-card{width:340px;height:320px;background:#2a2a2a;border-radius:30px;display:flex;align-items:center;justify-content:center}
.amp{font-family:"{{fontFamily}}",serif;font-size:150px;font-weight:600;color:#fafafa;line-height:1}
.desc-card{position:absolute;top:920px;left:60px;right:60px;height:340px;background:#2a2a2a;border-radius:30px;display:flex;align-items:center;justify-content:center;padding:0 80px}
.desc{font-family:"{{fontFamily}}",serif;font-size:28px;font-weight:400;color:#fafafa;text-align:center;line-height:1.5}
</style></head>
<body>
<div class="badge">{{number}}</div>
<div class="handle">{{handle}}</div>
<div class="name-card"><div class="font-name">{{fontFamily}}</div></div>
<div class="row-card">
  <div class="aa-card"><div class="ch ch-1">Aa</div><div class="ch ch-2">Bb</div><div class="ch ch-3">Cc</div></div>
  <div class="amp-card"><div class="amp">&amp;</div></div>
</div>
<div class="desc-card"><div class="desc">{{description}}</div></div>
</body></html>
