<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f6f1e6;font-family:"Inter",sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.page{position:absolute;top:80px;left:80px;font-size:20px;font-weight:700;color:#1a1a1a;letter-spacing:0.04em}
.author{position:absolute;top:80px;right:80px;display:flex;align-items:center;gap:14px}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.author-info{text-align:right}
.author-info .name{font-size:18px;font-weight:700;color:#1a1a1a;line-height:1.2}
.author-info .handle{font-size:14px;font-weight:500;color:#7a7464;line-height:1.2}
.headline{position:absolute;top:50%;left:80px;right:80px;transform:translateY(-50%);font-size:170px;font-weight:900;line-height:0.92;letter-spacing:-4px;color:#1a1a1a}
.headline .accent{color:#d65f3e}
.bottom{position:absolute;bottom:60px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.swipe{font-size:24px;font-weight:600;color:#7a7464}
.dot-row{display:flex;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#d6cdb8}
.dot.active{background:#1a1a1a;width:32px;border-radius:5px}
</style></head>
<body>
<div class="page">{{pageOf}}</div>
<div class="author"><div class="avatar">{{authorInitials}}</div><div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div></div>
<div class="headline">{{headlineLine1}}<br><span class="accent">{{headlineAccent}}</span><br>{{headlineLine3}}</div>
<div class="bottom"><div class="dot-row"><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div class="swipe">Swipe ⟶</div></div>
</body></html>
