<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,400;1,600;1,800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#fafaf7;font-family:"Inter",sans-serif;color:#1a1a18;-webkit-font-smoothing:antialiased}
.frame{position:absolute;inset:0;padding:52px 64px 48px;display:flex;flex-direction:column;gap:18px}
.masthead{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:2.5px solid #1a1a18;flex-shrink:0}
.brand{font-size:12px;font-weight:800;letter-spacing:0.32em;text-transform:uppercase;color:#1a1a18}
.issue-meta{font-size:12px;color:#888;letter-spacing:0.18em;text-transform:uppercase}
.handle{font-size:13px;color:#d4870f;font-weight:700;letter-spacing:0.04em}
.headline-zone{flex-shrink:0;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:0.32em;color:#d4870f;text-transform:uppercase}
.headline{font-family:"Playfair Display",serif;font-size:136px;font-weight:900;line-height:0.90;letter-spacing:-3.5px;color:#1a1a18}
.headline .accent{font-style:italic;color:#d4870f}
.head-rule{width:56px;height:5px;background:#d4870f;border-radius:2px;margin:4px 0}
.subtitle{font-family:"Playfair Display",serif;font-size:22px;color:#3d3835;line-height:1.48;font-style:italic;max-width:820px}
.article-card{flex:1;background:#1a1a18;border-radius:14px;padding:30px 36px;display:flex;flex-direction:column;gap:14px;min-height:0}
.ac-label{font-size:11px;font-weight:700;letter-spacing:0.3em;color:#d4870f;text-transform:uppercase;flex-shrink:0}
.ac-items{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;min-height:0}
.ac-item{display:flex;align-items:flex-start;gap:20px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.09)}
.ac-item:last-child{border-bottom:none}
.ac-item .n{font-family:"Playfair Display",serif;font-style:italic;font-size:34px;color:#d4870f;width:36px;flex-shrink:0;line-height:1}
.ac-item .t{font-family:"Playfair Display",serif;font-size:21px;color:#fafaf7;font-style:italic;line-height:1.3}
.author-bar{display:flex;align-items:center;gap:18px;padding:20px 26px;background:#f0ede8;border:1.5px solid #d8d4ce;border-radius:10px;flex-shrink:0}
.avatar{width:50px;height:50px;border-radius:50%;background:#d4870f;display:flex;align-items:center;justify-content:center;font-family:"Playfair Display",serif;font-size:22px;font-weight:800;color:#fafaf7;flex-shrink:0;border:2px solid #1a1a18}
.author-info{flex:1;min-width:0}
.author-info .nm{font-family:"Playfair Display",serif;font-size:20px;font-weight:700;color:#1a1a18;font-style:italic;line-height:1.1}
.author-info .rl{font-size:12px;color:#888;letter-spacing:0.08em;margin-top:3px}
.tags{display:flex;gap:8px;align-items:center}
.tag{padding:8px 14px;background:#1a1a18;color:#fafaf7;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase}
.bottom-strip{display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.swipe{display:flex;align-items:center;gap:10px}
.swipe .lbl{font-family:"Playfair Display",serif;font-size:14px;color:#888;font-style:italic}
.swipe .arr{width:34px;height:34px;border-radius:50%;background:#d4870f;color:#fafaf7;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900}
.pg{font-size:13px;font-weight:700;color:#1a1a18;letter-spacing:0.12em}
</style></head>
<body>
<div class="frame">
  <div class="masthead">
    <div class="brand">{{brandTag}}</div>
    <div class="issue-meta">{{issueLine}}</div>
    <div class="handle">{{handle}}</div>
  </div>
  <div class="headline-zone">
    <div class="eyebrow">{{eyebrow}}</div>
    <div class="headline">{{headLine1}} <em class="accent">{{headAccent}}</em><br>{{headLine2}}</div>
    <div class="head-rule"></div>
    <div class="subtitle">{{subtitle}}</div>
  </div>
  <div class="article-card">
    <div class="ac-label">{{previewLabel}}</div>
    <div class="ac-items">
      <div class="ac-item"><div class="n">1</div><div class="t">{{preview1}}</div></div>
      <div class="ac-item"><div class="n">2</div><div class="t">{{preview2}}</div></div>
      <div class="ac-item"><div class="n">3</div><div class="t">{{preview3}}</div></div>
    </div>
  </div>
  <div class="author-bar">
    <div class="avatar">{{avatarLetter}}</div>
    <div class="author-info">
      <div class="nm">{{authorName}}</div>
      <div class="rl">{{authorRole}}</div>
    </div>
    <div class="tags">
      <div class="tag">{{tag1}}</div>
      <div class="tag">{{tag2}}</div>
    </div>
  </div>
  <div class="bottom-strip">
    <div class="swipe"><div class="lbl">{{swipeLabel}}</div><div class="arr">→</div></div>
    <div class="pg">{{pageOf}}</div>
  </div>
</div>
</body></html>
