<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#131313;font-family:"Inter",sans-serif;color:#e8ecf3;-webkit-font-smoothing:antialiased}
.blob-right{position:absolute;top:-180px;right:-180px;width:680px;height:680px;background:radial-gradient(circle at center,#e5014c 0%,rgba(229,1,76,0.45) 35%,transparent 70%);filter:blur(80px);opacity:0.7}
.blob-right2{position:absolute;top:-100px;right:-150px;width:620px;height:620px;background:radial-gradient(circle at center,#36059d 0%,rgba(54,5,157,0.45) 35%,transparent 70%);filter:blur(80px);opacity:0.5}
.blob-left{position:absolute;bottom:200px;left:-180px;width:520px;height:520px;background:radial-gradient(circle at center,#e5014c 0%,rgba(229,1,76,0.4) 35%,transparent 70%);filter:blur(80px);opacity:0.55}
.blob-left2{position:absolute;bottom:80px;left:-160px;width:480px;height:480px;background:radial-gradient(circle at center,#36059d 0%,rgba(54,5,157,0.4) 35%,transparent 70%);filter:blur(80px);opacity:0.6}
.center{position:absolute;top:50%;left:88px;right:88px;transform:translateY(-50%)}
.headline{font-family:"Poppins",sans-serif;font-size:130px;font-weight:600;color:#e8ecf3;line-height:1.05;letter-spacing:-3px;margin-bottom:18px}
.sub{font-family:"Poppins",sans-serif;font-size:29px;font-weight:400;color:#bfbfbf;letter-spacing:-0.3px}
.author{position:absolute;bottom:108px;left:88px;display:flex;align-items:center;gap:16px}
.avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0}
.author-info .name{font-size:22px;font-weight:600;color:#ffffff;line-height:1.2}
.author-info .handle{font-size:20px;font-weight:600;color:#d1d1d1;line-height:1.2}
.save{position:absolute;bottom:122px;right:88px;display:flex;flex-direction:column;align-items:center;gap:6px}
.save .icon{width:38px;height:46px;border:2px solid #ffffff;border-bottom:none;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
.save .label{font-size:20px;font-weight:500;color:#ffffff}
</style></head>
<body>
<div class="blob-right"></div>
<div class="blob-right2"></div>
<div class="blob-left"></div>
<div class="blob-left2"></div>
<div class="center">
<div class="headline">{{headline}}</div>
<div class="sub">{{subline}}</div>
</div>
<div class="author">
  <div class="avatar">{{authorInitials}}</div>
  <div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div>
</div>
<div class="save"><div class="icon"></div><div class="label">Save</div></div>
</body></html>
