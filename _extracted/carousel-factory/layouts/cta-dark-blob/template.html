<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a;font-family:"Inter",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.blob{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);width:760px;height:760px;border-radius:50%;background:radial-gradient(circle at 50% 50%,{{blobColor1}} 0%,{{blobColor2}} 35%,transparent 65%);filter:blur(80px);opacity:0.5}
.author{position:absolute;top:80px;left:80px;display:flex;align-items:center;gap:16px}
.avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0}
.author-info .name{font-size:20px;font-weight:700;color:#fff;line-height:1.2}
.author-info .handle{font-size:16px;font-weight:500;color:rgba(255,255,255,0.5);line-height:1.2}
.page{position:absolute;top:96px;right:80px;font-size:18px;font-weight:600;color:rgba(255,255,255,0.5);letter-spacing:0.06em}
.center{position:absolute;top:50%;left:80px;right:80px;transform:translateY(-48%);text-align:center}
.eyebrow{font-size:24px;font-weight:600;letter-spacing:0.2em;color:{{accentColor}};margin-bottom:32px;text-transform:uppercase}
.headline{font-size:118px;font-weight:800;line-height:0.98;letter-spacing:-3px;margin-bottom:32px}
.body{font-size:28px;font-weight:400;line-height:1.5;color:rgba(255,255,255,0.7);max-width:760px;margin:0 auto 48px}
.btn{display:inline-block;padding:24px 56px;background:#fff;color:#0a0a0a;border-radius:50px;font-size:24px;font-weight:700;letter-spacing:-0.3px}
.sec{display:inline-block;margin-left:18px;font-size:20px;color:rgba(255,255,255,0.45)}
</style></head>
<body>
<div class="blob"></div>
<div class="author"><div class="avatar">{{authorInitials}}</div><div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div></div>
<div class="page">{{pageOf}}</div>
<div class="center">
<div class="eyebrow">{{eyebrow}}</div>
<div class="headline">{{headlineLine1}}<br>{{headlineLine2}}</div>
<div class="body">{{body}}</div>
<div><span class="btn">{{buttonLabel}} →</span><span class="sec">{{secondaryLabel}}</span></div>
</div>
</body></html>
