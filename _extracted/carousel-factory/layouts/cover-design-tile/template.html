<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f3ede0;font-family:"Inter",sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased}
.page{position:absolute;top:80px;left:80px;font-size:20px;font-weight:700}
.author{position:absolute;top:80px;right:80px;display:flex;align-items:center;gap:14px}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.author-info{text-align:right}
.author-info .name{font-size:18px;font-weight:700;line-height:1.2}
.author-info .handle{font-size:14px;color:#7a7464;line-height:1.2}
.eyebrow{position:absolute;top:200px;left:80px;font-size:22px;font-weight:700;letter-spacing:0.16em;color:#7a7464;text-transform:uppercase}
.title{position:absolute;top:250px;left:80px;right:80px;font-size:104px;font-weight:800;line-height:1;letter-spacing:-2.5px}
.tiles{position:absolute;top:570px;left:80px;right:80px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.tile{aspect-ratio:1;border-radius:18px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:24px;font-size:36px;font-weight:800;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,0.18)}
.t1{background:{{tile1Color}}}
.t2{background:{{tile2Color}}}
.t3{background:{{tile3Color}}}
.t4{background:{{tile4Color}}}
.t5{background:{{tile5Color}}}
.t6{background:{{tile6Color}}}
.tile-label{font-size:16px;font-weight:600;opacity:0.85;letter-spacing:0.05em}
.tile-glyph{font-size:60px;align-self:flex-end}
.bottom{position:absolute;bottom:60px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.handle{font-size:18px;font-weight:600;color:#7a7464}
.swipe{padding:14px 28px;background:#1a1a1a;color:#fff;border-radius:50px;font-size:18px;font-weight:700}
</style></head>
<body>
<div class="page">{{pageOf}}</div>
<div class="author"><div class="avatar">{{authorInitials}}</div><div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div></div>
<div class="eyebrow">{{eyebrow}}</div>
<div class="title">{{titleLine1}}</div>
<div class="tiles">
<div class="tile t1"><div class="tile-label">{{tile1Label}}</div><div class="tile-glyph">{{tile1Glyph}}</div></div>
<div class="tile t2"><div class="tile-label">{{tile2Label}}</div><div class="tile-glyph">{{tile2Glyph}}</div></div>
<div class="tile t3"><div class="tile-label">{{tile3Label}}</div><div class="tile-glyph">{{tile3Glyph}}</div></div>
<div class="tile t4"><div class="tile-label">{{tile4Label}}</div><div class="tile-glyph">{{tile4Glyph}}</div></div>
<div class="tile t5"><div class="tile-label">{{tile5Label}}</div><div class="tile-glyph">{{tile5Glyph}}</div></div>
<div class="tile t6"><div class="tile-label">{{tile6Label}}</div><div class="tile-glyph">{{tile6Glyph}}</div></div>
</div>
<div class="bottom"><div class="handle">{{handle}}</div><div class="swipe">Swipe →</div></div>
</body></html>
