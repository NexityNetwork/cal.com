<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f8fafc;font-family:"Inter",sans-serif;color:#121926;-webkit-font-smoothing:antialiased}
.title{position:absolute;top:280px;left:80px;right:80px;font-size:96px;font-weight:500;line-height:1.05;letter-spacing:-2px;color:#121926;text-align:center}
.compare{position:absolute;top:620px;left:0;right:0;display:flex;justify-content:center;gap:80px}
.col{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative}
.swatch{width:240px;height:240px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;font-weight:500;font-family:"Inter",sans-serif}
.col.bad .swatch{background:{{badColor}}}
.col.good .swatch{background:{{goodColor}}}
.badge{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;color:#fff;position:relative;top:-45px}
.badge.x{background:#e6eafa;color:#3457d5}
.badge.ok{background:#3457d5;color:#f8fafc}
.foot{position:absolute;bottom:75px;left:100px;right:100px;display:flex;justify-content:space-between;align-items:center}
.foot .num{font-size:48px;font-weight:400;color:#4b5565}
.foot .handle{font-size:32px;color:#4b5565}
</style></head>
<body>
<div class="title">{{titleLine1}}<br>{{titleLine2}}</div>
<div class="compare">
  <div class="col bad"><div class="swatch">{{badLabel}}</div><div class="badge x">✕</div></div>
  <div class="col good"><div class="swatch">{{goodLabel}}</div><div class="badge ok">✓</div></div>
</div>
<div class="foot"><div class="num">{{number}}</div><div class="handle">{{handle}}</div></div>
</body></html>
