<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,400;1,600;1,800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#111;font-family:"Inter",sans-serif;color:#f0ede8;-webkit-font-smoothing:antialiased}
.frame{position:absolute;inset:0;display:flex;flex-direction:row}
.left-panel{width:232px;background:#d62828;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.left-panel .big-word{font-size:72px;font-weight:900;color:#f0ede8;letter-spacing:-1px;writing-mode:vertical-rl;transform:rotate(180deg);text-transform:uppercase;line-height:1;opacity:0.9}
.right-panel{flex:1;padding:48px 56px;display:flex;flex-direction:column;gap:0;background:#111}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:2px solid #333}
.brand{font-size:12px;font-weight:800;letter-spacing:0.3em;text-transform:uppercase;color:#f0ede8}
.handle{font-size:13px;color:#d62828;font-weight:700}
.center-zone{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:0.32em;color:#d62828;text-transform:uppercase}
.cta-title{font-size:100px;font-weight:900;line-height:0.91;letter-spacing:-3px;color:#f0ede8;text-transform:uppercase}
.cta-title .accent{color:#d62828}
.h-rule{height:4px;background:#d62828;width:80px}
.recap-strip{display:flex;align-items:center;gap:12px}
.recap-lbl{font-family:"Playfair Display",serif;font-size:17px;font-style:italic;color:#888}
.recap-chips{display:flex;gap:8px}
.recap-chips .chip{width:38px;height:38px;border-radius:4px;background:#1e1e1e;border:1px solid #333;display:flex;align-items:center;justify-content:center;padding:6px}
.recap-chips .chip svg{width:100%;height:100%}
.cta-body{font-family:"Playfair Display",serif;font-size:20px;font-style:italic;color:#aaa;line-height:1.5;max-width:620px}
.cta-body em{color:#d62828;font-style:italic}
.btn-row{display:flex;gap:14px}
.btn-primary{display:inline-flex;align-items:center;gap:10px;padding:18px 36px;background:#d62828;color:#f0ede8;border-radius:4px;font-size:18px;font-weight:800;letter-spacing:0.02em;text-transform:uppercase}
.btn-primary::after{content:"→"}
.btn-ghost{padding:18px 28px;background:transparent;border:1.5px solid #444;color:#f0ede8;border-radius:4px;font-family:"Playfair Display",serif;font-style:italic;font-size:18px;font-weight:600}
.bottom-bar{display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px solid #333}
.signoff{font-family:"Playfair Display",serif;font-size:15px;font-style:italic;color:#555}
.pg{font-size:20px;font-weight:900;color:#d62828}
</style></head>
<body>
<div class="frame">
  <div class="left-panel">
    <div class="big-word">{{ctaStamp}}</div>
  </div>
  <div class="right-panel">
    <div class="top-bar">
      <div class="brand">{{brandTag}}</div>
      <div class="handle">{{handle}}</div>
    </div>
    <div class="center-zone">
      <div class="eyebrow">{{eyebrow}}</div>
      <div class="cta-title">{{ctaLine1}}<br><span class="accent">{{ctaAccent}}</span></div>
      <div class="h-rule"></div>
      <div class="recap-strip">
        <div class="recap-lbl">{{recapLabel}}</div>
        <div class="recap-chips">
          <div class="chip">{{iconSvg1}}</div>
          <div class="chip">{{iconSvg2}}</div>
          <div class="chip">{{iconSvg3}}</div>
          <div class="chip">{{iconSvg4}}</div>
        </div>
      </div>
      <div class="cta-body">{{ctaBody}}</div>
      <div class="btn-row">
        <div class="btn-primary">{{btnPrimary}}</div>
        <div class="btn-ghost">{{btnGhost}}</div>
      </div>
    </div>
    <div class="bottom-bar">
      <div class="signoff">{{signoff}}</div>
      <div class="pg">{{pageOf}}</div>
    </div>
  </div>
</div>
</body></html>
