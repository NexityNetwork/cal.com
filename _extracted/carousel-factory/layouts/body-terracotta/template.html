<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#f5ede3;font-family:"Lato",sans-serif;color:#1e1209;-webkit-font-smoothing:antialiased;}
  .stripe{position:absolute;left:0;top:0;bottom:0;width:12px;background:#c4541f;}
  .author-row{position:absolute;top:60px;left:80px;right:60px;display:flex;align-items:center;justify-content:space-between;}
  .author{font-size:20px;font-weight:700;letter-spacing:0.08em;color:#c4541f;text-transform:uppercase;}
  .page{font-family:"Playfair Display",serif;font-style:italic;font-size:22px;color:rgba(30,18,9,0.4);}
  .num-row{position:absolute;top:140px;left:80px;display:flex;align-items:baseline;gap:16px;}
  .num{font-family:"Playfair Display",serif;font-size:220px;font-weight:900;line-height:0.8;color:#c4541f;opacity:0.12;letter-spacing:-6px;}
  .num-label{font-size:22px;font-weight:700;letter-spacing:0.1em;color:#c4541f;text-transform:uppercase;position:absolute;top:260px;left:80px;}
  .content{position:absolute;top:380px;left:80px;right:70px;}
  .title{font-family:"Playfair Display",serif;font-size:88px;font-weight:900;line-height:0.92;letter-spacing:-2px;color:#1e1209;margin-bottom:36px;}
  .title em{font-style:italic;color:#c4541f;}
  .divider{width:80px;height:4px;background:#c4541f;border-radius:2px;margin-bottom:36px;}
  .body{font-size:30px;font-weight:300;line-height:1.55;color:#3d2b1a;max-width:820px;}
  .handle{position:absolute;bottom:60px;left:80px;font-size:20px;font-weight:700;letter-spacing:0.05em;color:rgba(30,18,9,0.35);}
</style></head>
<body>
  <div class="stripe"></div>
  <div class="author-row">
    <div class="author">{{author}}</div>
    <div class="page">{{pageOf}}</div>
  </div>
  <div class="num">{{number}}</div>
  <div class="num-label">{{numberLabel}}</div>
  <div class="content">
    <div class="title">{{titleMain}}<br><em>{{titleItalic}}</em></div>
    <div class="divider"></div>
    <div class="body">{{body}}</div>
  </div>
  <div class="handle">{{handle}}</div>
</body></html>
