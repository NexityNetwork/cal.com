<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,wght@1,400;1,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f7f5f0;font-family:"Inter",sans-serif;color:#0f172a;-webkit-font-smoothing:antialiased}
.outline{position:absolute;inset:24px;border:1.5px solid #0f172a;border-radius:24px;pointer-events:none;z-index:10;box-shadow:6px 6px 0 #0f172a}
.top-row{position:absolute;top:60px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
.brand{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;background:#dc2626;color:#ffffff;border-radius:50px;font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase}
.handle{font-family:"JetBrains Mono",monospace;font-size:14px;color:#475569;font-weight:500}
.center{position:absolute;top:50%;left:60px;right:60px;transform:translateY(-50%);text-align:center}
.eyebrow{font-family:"Fraunces",serif;font-style:italic;font-size:36px;color:#475569;margin-bottom:24px}
.headline{font-size:128px;font-weight:900;line-height:0.9;letter-spacing:-3.5px;color:#0f172a;margin-bottom:30px}
.headline .accent{color:#dc2626}
.headline em{font-family:"Fraunces",serif;font-style:italic;font-weight:400;color:#475569}
.recap-card{margin:0 auto 30px;display:inline-flex;padding:18px 28px;background:#ffffff;border:1.5px solid #0f172a;border-radius:14px;box-shadow:4px 4px 0 #0f172a;align-items:center;gap:18px}
.recap-card .lbl{font-family:"Fraunces",serif;font-style:italic;font-size:16px;color:#475569}
.recap-card .chips{display:flex;gap:10px}
.recap-card .chip{width:42px;height:42px;border-radius:10px;background:#f7f5f0;border:1px solid #0f172a;display:flex;align-items:center;justify-content:center;padding:7px}
.recap-card .chip svg{width:100%;height:100%}
.sub{font-size:24px;color:#475569;line-height:1.5;max-width:780px;margin:0 auto 36px}
.btn-row{display:flex;justify-content:center;gap:18px}
.btn-primary{padding:22px 44px;background:#dc2626;color:#ffffff;border:1.5px solid #0f172a;border-radius:14px;font-size:22px;font-weight:800;box-shadow:5px 5px 0 #0f172a}
.btn-ghost{padding:22px 32px;background:#ffffff;border:1.5px solid #0f172a;color:#0f172a;border-radius:14px;font-size:22px;font-weight:700;box-shadow:5px 5px 0 #0f172a}
.bottom-row{position:absolute;bottom:60px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
.bottom-row .pg{padding:10px 18px;background:#0f172a;color:#f7f5f0;border-radius:50px;font-family:"JetBrains Mono",monospace;font-size:18px;font-weight:600;letter-spacing:0.08em}
.bottom-row .signoff{font-family:"Fraunces",serif;font-style:italic;font-size:18px;color:#475569}
</style></head>
<body>
<div class="outline"></div>
<div class="top-row"><div class="brand">{{brandTag}}</div><div class="handle">{{handle}}</div></div>
<div class="center">
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="headline">{{ctaLine1}} <span class="accent">{{ctaAccent}}</span><br><em>{{ctaItalic}}</em></div>
  <div class="recap-card">
    <div class="lbl">{{recapLabel}}</div>
    <div class="chips"><div class="chip">{{iconSvg1}}</div><div class="chip">{{iconSvg2}}</div><div class="chip">{{iconSvg3}}</div><div class="chip">{{iconSvg4}}</div><div class="chip">{{iconSvg5}}</div><div class="chip">{{iconSvg6}}</div></div>
  </div>
  <div class="sub">{{ctaBody}}</div>
  <div class="btn-row"><div class="btn-primary">{{btnPrimary}}</div><div class="btn-ghost">{{btnGhost}}</div></div>
</div>
<div class="bottom-row"><div class="pg">{{pageOf}}</div><div class="signoff">{{signoff}}</div></div>
</body></html>
