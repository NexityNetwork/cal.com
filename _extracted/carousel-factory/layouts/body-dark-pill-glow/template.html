<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,400;1,400;1,600;1,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a;font-family:"Inter",sans-serif;color:#f5f5f5;-webkit-font-smoothing:antialiased}
.outline{position:absolute;inset:24px;border:1px solid rgba(255,255,255,0.05);border-radius:32px;pointer-events:none}
/* Browser mockup top section */
.browser{position:absolute;top:0;left:0;right:0;height:860px;background:#f7f7f8;overflow:hidden;display:flex;flex-direction:column}
.browser-bar{height:64px;background:#ffffff;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;padding:0 22px;gap:18px;flex-shrink:0}
.b-menu{width:32px;height:32px;display:flex;flex-direction:column;justify-content:space-around;padding:6px}
.b-menu span{display:block;height:2px;background:#1a1a1a;border-radius:1px}
.b-title{font-size:20px;font-weight:600;color:#1a1a1a}
.b-actions{margin-left:auto;display:flex;align-items:center;gap:14px}
.b-icon{width:32px;height:32px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;color:#525252;font-size:14px}
.b-cta{padding:8px 18px;background:#1a1a1a;color:#fff;border-radius:6px;font-size:14px;font-weight:600}
.alert-row{margin:22px 32px 0;padding:18px 26px;background:#dde8ff;border-radius:14px;display:flex;align-items:center;gap:14px;font-size:18px;font-weight:500;color:#1a1a1a;flex-shrink:0}
.alert-row .ico{width:32px;height:32px;border-radius:8px;background:#3457d5;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.alert-row .link{margin-left:auto;font-size:14px;color:#3457d5;font-weight:600}
.b-hero{padding:30px 32px 0}
.b-hero h1{font-size:60px;font-weight:700;color:#1a1a1a;line-height:1.05;letter-spacing:-1.6px;margin-bottom:18px}
.b-hero p{font-size:18px;font-weight:400;color:#525252;line-height:1.5;max-width:680px}
.b-snippet{margin:24px 32px 0;display:flex;align-items:stretch;gap:12px}
.b-snippet .input{flex:1;background:#f4f4f5;border:1px solid #e5e5e5;border-radius:8px;padding:14px 18px;font-family:"JetBrains Mono",monospace;font-size:18px;color:#1a1a1a}
.b-snippet .btn{padding:14px 26px;background:#1a1a1a;color:#fff;border-radius:8px;font-size:16px;font-weight:600;display:flex;align-items:center}
.b-stat{margin:18px 32px 0;font-size:14px;color:#525252}
.b-stat strong{color:#1a1a1a;font-weight:700}
.b-tags{margin:24px 32px 0;display:flex;gap:10px;flex-wrap:wrap;flex:1;align-content:flex-start}
.b-tag{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:#ffffff;border:1px solid #e5e5e5;border-radius:50px;font-size:13px;font-weight:500;color:#1a1a1a}
.b-tag .dot{width:8px;height:8px;border-radius:50%;background:#10b981}
.b-tag .dot.b{background:#3457d5}
.b-tag .dot.o{background:#ff7a3c}
.b-tag .dot.p{background:#9333ea}
/* Bottom gradient + content */
.fade{position:absolute;top:720px;left:0;right:0;height:200px;background:linear-gradient(180deg,transparent 0%,#0a0a0a 75%);pointer-events:none}
.content{position:absolute;bottom:140px;left:80px;right:80px}
.title{font-family:"Fraunces",serif;font-style:italic;font-weight:400;font-size:84px;line-height:1.0;letter-spacing:-1px;color:#ffffff;margin-bottom:18px}
.subtitle{font-family:"Fraunces",serif;font-style:italic;font-weight:400;font-size:32px;line-height:1.3;color:#9ca3af;max-width:880px}
.bottom-row{position:absolute;bottom:64px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.domain-pill{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:50px;color:#cdd5df;font-size:18px;font-weight:500}
.domain-pill .globe{width:18px;height:18px;border:1.5px solid #cdd5df;border-radius:50%;position:relative}
.domain-pill .globe::before,.domain-pill .globe::after{content:"";position:absolute;background:#cdd5df}
.domain-pill .globe::before{top:50%;left:0;right:0;height:1.5px}
.domain-pill .globe::after{top:0;bottom:0;left:50%;width:1.5px}
.page{font-size:18px;color:#525252;font-weight:500;letter-spacing:0.04em}
</style></head>
<body>
<div class="outline"></div>
<div class="browser">
  <div class="browser-bar"><div class="b-menu"><span></span><span></span><span></span></div><div class="b-title">{{toolName}}</div><div class="b-actions"><div class="b-icon">★</div><div class="b-cta">{{btnLabel}}</div></div></div>
  <div class="alert-row"><div class="ico">⚡</div><div>{{alertLine}}</div><div class="link">{{alertCta}}</div></div>
  <div class="b-hero"><h1>{{heroTitle}}</h1><p>{{heroBody}}</p></div>
  <div class="b-snippet"><div class="input">{{snippet}}</div><div class="btn">{{snippetBtn}}</div></div>
  <div class="b-stat">Trusted by <strong>{{stat}}</strong> {{statLabel}}</div>
  <div class="b-code"><span class="com">// {{codeComment}}</span><br><span class="kw">{{codeKeyword}}</span> <span class="str">"{{codeString}}"</span></div>
</div>
<div class="fade"></div>
<div class="content">
  <div class="title">{{slideTitle}}</div>
  <div class="subtitle">{{slideSubtitle}}</div>
</div>
<div class="bottom-row">
  <div class="domain-pill"><div class="globe"></div><span>{{domainText}}</span></div>
  <div class="page">{{pageOf}}</div>
</div>
</body></html>
