<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#faf8f2;font-family:"Montserrat",sans-serif;color:#1a1410;-webkit-font-smoothing:antialiased;}
  .marble{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 20%,rgba(184,150,12,0.05) 0%,transparent 35%);}
  .top-border{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#b8960c 30%,#d4af37 50%,#b8960c 70%,transparent);}
  .brand-row{position:absolute;top:54px;left:70px;right:70px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-size:16px;font-weight:600;letter-spacing:0.18em;color:rgba(26,20,16,0.35);text-transform:uppercase;}
  .page{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:20px;color:rgba(26,20,16,0.4);}
  .num-block{position:absolute;top:140px;left:70px;display:flex;align-items:baseline;gap:14px;}
  .num{font-family:"Cormorant Garamond",serif;font-size:200px;font-weight:700;line-height:0.8;color:transparent;-webkit-text-stroke:1.5px rgba(184,150,12,0.25);letter-spacing:-4px;}
  .num-label{position:absolute;top:220px;left:70px;font-size:14px;font-weight:600;letter-spacing:0.18em;color:#b8960c;text-transform:uppercase;}
  .gold-rule{position:absolute;top:390px;left:70px;width:100px;height:1px;background:#b8960c;}
  .content{position:absolute;top:420px;left:70px;right:70px;}
  .title{font-family:"Cormorant Garamond",serif;font-size:100px;font-weight:700;line-height:0.88;letter-spacing:-1px;color:#1a1410;margin-bottom:32px;}
  .title-italic{font-style:italic;color:#b8960c;}
  .body{font-size:28px;font-weight:400;line-height:1.6;color:rgba(26,20,16,0.65);max-width:820px;}
  .handle{position:absolute;bottom:60px;left:70px;font-size:16px;letter-spacing:0.06em;color:rgba(26,20,16,0.3);}
  .bottom-border{position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#b8960c 30%,#d4af37 50%,#b8960c 70%,transparent);}
</style></head>
<body>
  <div class="marble"></div>
  <div class="top-border"></div>
  <div class="brand-row">
    <div class="brand">{{brand}}</div>
    <div class="page">{{pageOf}}</div>
  </div>
  <div class="num">{{number}}</div>
  <div class="num-label">{{numberLabel}}</div>
  <div class="gold-rule"></div>
  <div class="content">
    <div class="title">{{titleMain}}<br><span class="title-italic">{{titleItalic}}</span></div>
    <div class="body">{{body}}</div>
  </div>
  <div class="handle">{{handle}}</div>
  <div class="bottom-border"></div>
</body></html>
