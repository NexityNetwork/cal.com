<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#ffffff;font-family:"Inter",sans-serif;color:#121926;-webkit-font-smoothing:antialiased}
.top-row{position:absolute;top:60px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.num{font-size:22px;font-weight:600;color:#4b5565;letter-spacing:0.06em}
.handle{font-size:22px;font-weight:500;color:#4b5565}
.center{position:absolute;top:50%;left:80px;right:80px;transform:translateY(-50%);text-align:center}
.eyebrow{font-size:22px;font-weight:600;letter-spacing:0.22em;color:#10b981;margin-bottom:32px;text-transform:uppercase}
.headline{font-family:"Inter",sans-serif;font-size:96px;font-weight:800;color:#121926;line-height:1;letter-spacing:-3px;margin-bottom:32px}
.headline .accent{color:#10b981}
.body{font-size:30px;font-weight:400;color:#4b5565;line-height:1.4;max-width:760px;margin:0 auto 36px}
.tools-row{display:flex;justify-content:center;gap:16px;margin-bottom:40px}
.tools-row .chip{width:60px;height:60px;border-radius:14px;background:#fafafa;border:1.5px solid #e5e7eb;padding:9px;display:flex;align-items:center;justify-content:center}
.tools-row .chip svg{width:100%;height:100%}
.btn{display:inline-block;padding:22px 48px;background:#10b981;color:#fff;border-radius:50px;font-size:24px;font-weight:700}
</style></head>
<body>
<div class="top-row"><div class="num">{{pageOf}}</div><div class="handle">{{handle}}</div></div>
<div class="center">
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="headline">{{headlineLine1}}<br><span class="accent">{{headlineAccent}}</span></div>
  <div class="body">{{body}}</div>
  <div class="tools-row">
    <div class="chip">{{iconSvg1}}</div>
    <div class="chip">{{iconSvg2}}</div>
    <div class="chip">{{iconSvg3}}</div>
    <div class="chip">{{iconSvg4}}</div>
    <div class="chip">{{iconSvg5}}</div>
    <div class="chip">{{iconSvg6}}</div>
  </div>
  <div class="btn">{{ctaText}} →</div>
</div>
</body></html>
