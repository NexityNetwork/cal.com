<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#ff5722;font-family:"Inter",sans-serif;color:#0a0a0a;-webkit-font-smoothing:antialiased}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,0.06) 1px,transparent 1px);background-size:3px 3px;opacity:0.4;pointer-events:none}
.tag-strip{position:absolute;top:80px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.tag-pill{display:inline-block;padding:14px 26px;background:#0a0a0a;color:#ff5722;border-radius:50px;font-size:22px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase}
.center{position:absolute;top:50%;left:80px;right:80px;transform:translateY(-50%);text-align:center}
.eyebrow{font-family:"Fraunces",serif;font-style:italic;font-weight:400;font-size:48px;color:#0a0a0a;margin-bottom:24px}
.headline{font-size:172px;font-weight:900;line-height:0.86;letter-spacing:-5px;color:#0a0a0a;margin-bottom:40px}
.headline .accent{color:#fff8f0}
.sub{font-size:32px;font-weight:500;line-height:1.4;color:#0a0a0a;max-width:780px;margin:0 auto 44px}
.btn-row{display:flex;justify-content:center;gap:18px}
.btn-primary{padding:24px 50px;background:#0a0a0a;color:#ff5722;border-radius:60px;font-size:26px;font-weight:800;letter-spacing:-0.3px;text-transform:uppercase}
.btn-ghost{padding:24px 38px;background:transparent;border:2px solid #0a0a0a;color:#0a0a0a;border-radius:60px;font-size:22px;font-weight:700}
.bottom-row{position:absolute;bottom:80px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;color:#0a0a0a}
.bottom-row .pg{font-size:22px;font-weight:600}
.bottom-row .meta{font-size:22px;font-weight:600}
</style></head>
<body>
<div class="grain"></div>
<div class="tag-strip"><div class="tag-pill">{{tag}}</div></div>
<div class="center">
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="headline">{{ctaLine1}}<br><span class="accent">{{ctaLine2}}</span></div>
  <div class="sub">{{ctaBody}}</div>
  <div class="btn-row"><div class="btn-primary">{{btnPrimary}}</div><div class="btn-ghost">{{btnGhost}}</div></div>
</div>
<div class="bottom-row"><div class="pg">{{pageOf}}</div><div class="meta">{{footerMeta}}</div></div>
</body></html>
