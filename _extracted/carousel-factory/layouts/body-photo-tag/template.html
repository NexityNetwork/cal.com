<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,wght@1,400;1,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a;font-family:"Inter",sans-serif;color:#fafafa;-webkit-font-smoothing:antialiased}
/* upper half is "photo" (procedural blurred gradient), lower half is dark content */
.photo-half{position:absolute;top:0;left:0;right:0;height:600px;background:linear-gradient({{photoBgAngle}}deg,{{photoBg1}},{{photoBg2}});overflow:hidden}
.photo-half::before{content:"";position:absolute;top:-20%;right:-15%;width:70%;height:90%;border-radius:50%;background:{{blobColor1}};filter:blur(110px);opacity:0.85;mix-blend-mode:screen}
.photo-half::after{content:"";position:absolute;bottom:-30%;left:-15%;width:70%;height:90%;border-radius:50%;background:{{blobColor2}};filter:blur(120px);opacity:0.8;mix-blend-mode:screen}
.photo-overlay{position:absolute;top:0;left:0;right:0;height:600px;background:linear-gradient(180deg,rgba(10,10,10,0.3) 0%,rgba(10,10,10,0.1) 50%,rgba(10,10,10,0.85) 90%,#0a0a0a 100%);z-index:2}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.03) 1px,transparent 1px);background-size:3px 3px;pointer-events:none;z-index:1}
.top-row{position:absolute;top:60px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.tag-pill{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;background:#ff5722;color:#0a0a0a;border-radius:50px;font-size:16px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase}
.handle{font-size:14px;color:rgba(255,255,255,0.7);font-weight:500;padding:8px 14px;background:rgba(255,255,255,0.08);border-radius:50px;backdrop-filter:blur(6px)}
.hero-card{position:absolute;top:140px;left:60px;right:60px;display:flex;align-items:center;gap:24px;padding:32px 38px;background:rgba(0,0,0,0.55);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:22px;z-index:5}
.hero-card .ic{width:104px;height:104px;border-radius:22px;background:#fafafa;padding:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero-card .ic svg{width:100%;height:100%}
.hero-card .info .nm{font-size:48px;font-weight:900;letter-spacing:-1.2px;color:#fafafa;line-height:1;margin-bottom:6px}
.hero-card .info .tg{font-family:"Fraunces",serif;font-style:italic;font-size:22px;color:#ff7a3c;line-height:1.4}
.headline{position:absolute;top:420px;left:60px;right:60px;font-size:60px;font-weight:900;line-height:1.0;letter-spacing:-2px;z-index:5;color:#fafafa}
.headline em{font-family:"Fraunces",serif;font-style:italic;font-weight:400;color:#ff7a3c}
.body-card{position:absolute;top:640px;left:60px;right:60px;padding:30px 36px;background:#161616;border:1px solid rgba(255,255,255,0.08);border-radius:20px;color:#cdd5df;z-index:5}
.body-card .b-eyebrow{font-family:"JetBrains Mono",monospace;font-size:14px;color:#ff7a3c;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:14px}
.body-card .b-body{font-size:24px;font-weight:500;line-height:1.5}
.body-card .b-body em{color:#ff7a3c;font-style:normal;font-weight:700}
.metrics-row{position:absolute;bottom:240px;left:60px;right:60px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;z-index:5}
.metric{padding:20px 22px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;text-align:center}
.metric .v{font-size:38px;font-weight:900;color:#ff7a3c;line-height:1;letter-spacing:-1px;margin-bottom:6px}
.metric .l{font-size:13px;font-weight:700;color:#71717a;letter-spacing:0.1em;text-transform:uppercase}
.bottom-row{position:absolute;bottom:60px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.bottom-row .chips{display:flex;gap:10px}
.bottom-row .chips .chip{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;padding:7px}
.bottom-row .chips .chip svg{width:100%;height:100%}
.bottom-row .pg{font-family:"JetBrains Mono",monospace;font-size:14px;color:#71717a;letter-spacing:0.08em}
</style></head>
<body>
<div class="photo-half"></div>
<div class="photo-overlay"></div>
<div class="grain"></div>
<div class="top-row"><div class="tag-pill">{{numLabel}}</div><div class="handle">{{handle}}</div></div>
<div class="hero-card">
  <div class="ic">{{iconSvg1}}</div>
  <div class="info">
    <div class="nm">{{toolName}}</div>
    <div class="tg">{{toolTagline}}</div>
  </div>
</div>
<div class="headline">{{headline}} <em>{{headlineItalic}}</em></div>
<div class="body-card">
  <div class="b-eyebrow">{{bodyLabel}}</div>
  <div class="b-body">{{bodyText}}</div>
</div>
<div class="metrics-row">
  <div class="metric"><div class="v">{{metric1Value}}</div><div class="l">{{metric1Label}}</div></div>
  <div class="metric"><div class="v">{{metric2Value}}</div><div class="l">{{metric2Label}}</div></div>
  <div class="metric"><div class="v">{{metric3Value}}</div><div class="l">{{metric3Label}}</div></div>
</div>
<div class="bottom-row">
  <div class="chips">
    <div class="chip">{{iconSvg2}}</div>
    <div class="chip">{{iconSvg3}}</div>
    <div class="chip">{{iconSvg4}}</div>
    <div class="chip">{{iconSvg5}}</div>
  </div>
  <div class="pg">{{pageOf}}</div>
</div>
</body></html>
