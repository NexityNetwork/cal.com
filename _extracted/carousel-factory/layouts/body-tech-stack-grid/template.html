<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,wght@1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a;font-family:"Inter",sans-serif;color:#fafafa;-webkit-font-smoothing:antialiased}
.outline{position:absolute;inset:24px;border:1px solid rgba(255,255,255,0.05);border-radius:32px;pointer-events:none}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(ellipse at 20% 20%,#000 0%,transparent 70%)}
.tag-strip{position:absolute;top:80px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.tag-pill{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:rgba(255,90,40,0.12);border:1px solid rgba(255,90,40,0.3);color:#ff7a3c;border-radius:50px;font-size:15px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase}
.tag-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff5722}
.num-meta{font-family:"JetBrains Mono",monospace;font-size:14px;color:#71717a}
.hero{position:absolute;top:170px;left:80px;right:80px;padding:32px 36px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:22px;display:flex;align-items:center;gap:24px}
.hero .ic{width:108px;height:108px;background:#ffffff;border-radius:24px;padding:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero .ic svg{width:100%;height:100%}
.hero .info .nm{font-size:54px;font-weight:800;color:#fafafa;line-height:1;letter-spacing:-1.5px;margin-bottom:6px}
.hero .info .rl{font-size:18px;color:#9ca3af;line-height:1.3;letter-spacing:0.04em;text-transform:uppercase;font-weight:600;margin-bottom:8px}
.hero .info .tag{display:inline-block;padding:4px 12px;background:rgba(255,90,40,0.18);color:#ff7a3c;border-radius:50px;font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase}
.tagline{position:absolute;top:380px;left:80px;right:80px;font-family:"Fraunces",serif;font-style:italic;font-weight:400;font-size:52px;line-height:1.15;color:#fafafa;letter-spacing:-1px}
.tagline em{font-style:normal;font-family:"Inter",sans-serif;color:#ff7a3c;font-weight:600}
.features{position:absolute;top:600px;left:80px;right:80px;display:flex;flex-direction:column;gap:14px}
.feat{padding:20px 26px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:14px;display:flex;align-items:flex-start;gap:18px}
.feat .ck{width:32px;height:32px;border-radius:8px;background:linear-gradient(180deg,#ff9959,#ff5722);color:#0a0a0a;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0}
.feat .bd{flex:1}
.feat .bt{font-size:20px;font-weight:700;color:#fafafa;line-height:1.2;margin-bottom:4px}
.feat .bs{font-size:16px;color:#9ca3af;line-height:1.4}
.combos{position:absolute;bottom:200px;left:80px;right:80px;padding:22px 28px;background:rgba(255,255,255,0.04);border-radius:16px;display:flex;align-items:center;gap:18px}
.combos .lb{font-family:"JetBrains Mono",monospace;font-size:14px;color:#9ca3af;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;flex-shrink:0}
.combos .chips{display:flex;align-items:center;gap:10px;flex:1;justify-content:flex-end}
.combos .chip{width:42px;height:42px;background:#ffffff;border-radius:10px;padding:7px;display:flex;align-items:center;justify-content:center}
.combos .chip svg{width:100%;height:100%}
.bottom-row{position:absolute;bottom:80px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.domain{font-family:"JetBrains Mono",monospace;font-size:14px;color:#71717a}
.page{font-family:"JetBrains Mono",monospace;font-size:14px;color:#71717a}
</style></head>
<body>
<div class="grid-bg"></div>
<div class="outline"></div>
<div class="tag-strip"><div class="tag-pill">{{tag}}</div><div class="num-meta">{{stepMeta}}</div></div>
<div class="hero">
  <div class="ic">{{iconSvg1}}</div>
  <div class="info"><div class="rl">{{toolRole}}</div><div class="nm">{{toolName1}}</div><div class="tag">{{toolTagline}}</div></div>
</div>
<div class="tagline">{{tagline}}</div>
<div class="features">
  <div class="feat"><div class="ck">✓</div><div class="bd"><div class="bt">{{f1Title}}</div><div class="bs">{{f1Body}}</div></div></div>
  <div class="feat"><div class="ck">✓</div><div class="bd"><div class="bt">{{f2Title}}</div><div class="bs">{{f2Body}}</div></div></div>
  <div class="feat"><div class="ck">✓</div><div class="bd"><div class="bt">{{f3Title}}</div><div class="bs">{{f3Body}}</div></div></div>
</div>
<div class="combos">
  <div class="lb">PAIRS WITH</div>
  <div class="chips">
    <div class="chip">{{iconSvg2}}</div>
    <div class="chip">{{iconSvg3}}</div>
    <div class="chip">{{iconSvg4}}</div>
    <div class="chip">{{iconSvg5}}</div>
  </div>
</div>
<div class="bottom-row"><div class="domain">{{domainText}}</div><div class="page">{{pageOf}}</div></div>
</body></html>
