<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,wght@0,400;0,600;0,800;1,400;1,500;1,700&family=Caveat:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#faf6ed;font-family:"Inter",sans-serif;color:#1a1410;-webkit-font-smoothing:antialiased}
.paper-grain{position:absolute;inset:0;background-image:radial-gradient(rgba(26,20,16,0.02) 1px,transparent 1px);background-size:6px 6px;opacity:0.6}
.frame{position:absolute;inset:0;padding:60px;display:flex;flex-direction:column;gap:22px;text-align:center}
.top-row{display:flex;justify-content:space-between;align-items:center;text-align:left}
.tag{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;background:#1a1410;color:#faf6ed;border-radius:50px;font-size:16px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase}
.handle{font-family:"Caveat",cursive;font-size:28px;color:#8a7a5a;font-weight:600}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px}
.eyebrow{font-family:"Caveat",cursive;font-size:38px;color:#d97757;line-height:1;font-weight:700}
.title{font-family:"Fraunces",serif;font-weight:800;font-size:120px;line-height:0.96;letter-spacing:-3.5px;color:#1a1410;font-style:italic}
.title .accent{color:#d97757;font-style:italic;position:relative;display:inline-block}
.title .accent::after{content:"";position:absolute;left:-4px;right:-4px;bottom:-4px;height:16px;background:#d97757;opacity:0.35;border-radius:6px;z-index:-1}
.recap-card{display:inline-flex;align-items:center;gap:18px;padding:22px 28px;background:#1a1410;border-radius:18px;color:#faf6ed}
.recap-card .lbl{font-family:"Caveat",cursive;font-size:24px;color:#d97757;line-height:1;font-weight:700}
.recap-card .chips{display:flex;gap:10px}
.recap-card .chip{width:48px;height:48px;border-radius:11px;background:#faf6ed;border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;padding:7px}
.recap-card .chip svg{width:100%;height:100%}
.body{font-size:24px;color:#5a4a3a;line-height:1.45;font-weight:500;max-width:820px;font-family:"Fraunces",serif;font-style:italic}
.body em{font-style:italic;color:#d97757;font-weight:600}
.btn-row{display:flex;justify-content:center;gap:16px;margin-top:6px}
.btn-primary{display:inline-flex;align-items:center;gap:12px;padding:22px 40px;background:#1a1410;color:#faf6ed;border-radius:14px;font-size:22px;font-weight:800;letter-spacing:-0.3px}
.btn-primary::after{content:"→"}
.btn-ghost{padding:22px 32px;background:#ffffff;border:1.5px solid #1a1410;color:#1a1410;border-radius:14px;font-family:"Fraunces",serif;font-style:italic;font-size:22px;font-weight:600}
.bottom-row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;text-align:left}
.bottom-row .pg{padding:10px 20px;background:#1a1410;color:#faf6ed;border-radius:50px;font-family:"JetBrains Mono",monospace;font-size:18px;font-weight:700;letter-spacing:0.06em}
.bottom-row .signoff{font-family:"Caveat",cursive;font-size:28px;color:#8a7a5a;font-weight:700}
</style></head>
<body>
<div class="paper-grain"></div>
<div class="frame">
  <div class="top-row"><div class="tag">{{brandTag}}</div><div class="handle">{{handle}}</div></div>
  <div class="center">
    <div class="eyebrow">{{eyebrow}}</div>
    <div class="title">{{ctaLine1}} <span class="accent">{{ctaAccent}}</span><br>{{ctaItalic}}</div>
    <div class="recap-card">
      <div class="lbl">{{recapLabel}}</div>
      <div class="chips">
        <div class="chip">{{iconSvg1}}</div>
        <div class="chip">{{iconSvg2}}</div>
        <div class="chip">{{iconSvg3}}</div>
        <div class="chip">{{iconSvg4}}</div>
        <div class="chip">{{iconSvg5}}</div>
        <div class="chip">{{iconSvg6}}</div>
      </div>
    </div>
    <div class="body">{{ctaBody}}</div>
    <div class="btn-row">
      <div class="btn-primary">{{btnPrimary}}</div>
      <div class="btn-ghost">{{btnGhost}}</div>
    </div>
  </div>
  <div class="bottom-row">
    <div class="pg">{{pageOf}}</div>
    <div class="signoff">{{signoff}}</div>
  </div>
</div>
</body></html>
