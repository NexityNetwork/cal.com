<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f1f1f1;font-family:"Inter",sans-serif;color:#37474f;-webkit-font-smoothing:antialiased}
.center{position:absolute;top:300px;left:120px;right:120px}
.avatar{width:128px;height:128px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:#fff;border:3px solid #1acd8a;margin-bottom:34px}
.tagline{font-size:28px;font-weight:400;color:#37474f;line-height:1.4;margin-bottom:54px}
.cta-q{font-size:48px;font-weight:500;color:#37474f;line-height:1.2;margin-bottom:32px}
.follow-btn{display:inline-block;padding:18px 56px;background:#1acd8a;color:#ffffff;border-radius:50px;font-size:24px;font-weight:500}
.bottom{position:absolute;bottom:64px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
.pill{padding:14px 32px;background:#1acd8a;color:#ffffff;border-radius:50px;font-size:18px;font-weight:500;display:inline-flex;align-items:center;gap:10px}
</style></head>
<body>
<div class="center">
  <div class="avatar">{{authorInitials}}</div>
  <div class="tagline">{{tagline}}</div>
  <div class="cta-q">{{ctaQuestion}}</div>
  <div class="follow-btn">Follow {{handle}}</div>
</div>
<div class="bottom">
  <div class="pill">{{pageOf}}</div>
  <div class="pill">Save 🔖</div>
</div>
</body></html>
