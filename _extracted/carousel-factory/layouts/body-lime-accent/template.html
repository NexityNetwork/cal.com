<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a;font-family:"Inter",sans-serif;color:#fafafa;-webkit-font-smoothing:antialiased}
.outline{position:absolute;inset:24px;border:1px solid rgba(255,255,255,0.06);border-radius:28px;pointer-events:none;z-index:10}
.top-row{position:absolute;top:64px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.num-pill{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;background:#c6f04a;color:#0a0a0a;border-radius:50px;font-size:16px;font-weight:800;letter-spacing:0.06em}
.handle-text{font-family:"JetBrains Mono",monospace;font-size:16px;color:#71717a}
.hero-card{position:absolute;top:170px;left:80px;right:80px;background:#161616;border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:40px 44px;display:flex;align-items:center;gap:28px}
.hero-card .ic{width:108px;height:108px;border-radius:22px;background:#fafafa;display:flex;align-items:center;justify-content:center;padding:18px;flex-shrink:0}
.hero-card .ic svg{width:100%;height:100%}
.hero-card .info .name{font-size:54px;font-weight:800;line-height:1;letter-spacing:-1.5px;color:#fafafa;margin-bottom:8px}
.hero-card .info .name em{display:inline-block;background:#c6f04a;color:#0a0a0a;padding:2px 12px;border-radius:8px;font-style:normal}
.hero-card .info .tag{font-size:18px;font-weight:500;color:#a3a3a3;line-height:1.4}
.body-text{position:absolute;top:430px;left:80px;right:80px;font-size:24px;font-weight:400;line-height:1.5;color:#cdd5df}
.body-text em{color:#c6f04a;font-style:normal;font-weight:700}
.bullets{position:absolute;top:600px;left:80px;right:80px;display:flex;flex-direction:column;gap:14px}
.bullet{padding:22px 26px;background:rgba(198,240,74,0.05);border:1px solid rgba(198,240,74,0.15);border-radius:14px;display:flex;align-items:center;gap:18px}
.bullet .ck{width:36px;height:36px;border-radius:10px;background:#c6f04a;color:#0a0a0a;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0}
.bullet .bt{font-size:20px;font-weight:600;color:#fafafa;line-height:1.3}
.metrics{position:absolute;bottom:200px;left:80px;right:80px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.metric{padding:18px 22px;background:rgba(255,255,255,0.04);border-radius:12px;text-align:center}
.metric .v{font-size:32px;font-weight:900;color:#c6f04a;line-height:1;letter-spacing:-1px;margin-bottom:6px}
.metric .l{font-size:13px;font-weight:600;color:#71717a;letter-spacing:0.08em;text-transform:uppercase}
.bottom-row{position:absolute;bottom:80px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.bottom-row .pg{font-family:"JetBrains Mono",monospace;font-size:16px;color:#71717a}
.bottom-row .note{font-size:16px;color:#a3a3a3}
</style></head>
<body>
<div class="outline"></div>
<div class="top-row"><div class="num-pill">{{numLabel}}</div><div class="handle-text">{{handle}}</div></div>
<div class="hero-card">
  <div class="ic">{{iconSvg1}}</div>
  <div class="info">
    <div class="name">{{toolName}} <em>{{toolTag}}</em></div>
    <div class="tag">{{toolTagline}}</div>
  </div>
</div>
<div class="body-text">{{bodyText}}</div>
<div class="bullets">
  <div class="bullet"><div class="ck">✓</div><div class="bt">{{bullet1}}</div></div>
  <div class="bullet"><div class="ck">✓</div><div class="bt">{{bullet2}}</div></div>
  <div class="bullet"><div class="ck">✓</div><div class="bt">{{bullet3}}</div></div>
</div>
<div class="metrics">
  <div class="metric"><div class="v">{{metric1Value}}</div><div class="l">{{metric1Label}}</div></div>
  <div class="metric"><div class="v">{{metric2Value}}</div><div class="l">{{metric2Label}}</div></div>
  <div class="metric"><div class="v">{{metric3Value}}</div><div class="l">{{metric3Label}}</div></div>
</div>
<div class="bottom-row"><div class="pg">{{pageOf}}</div><div class="note">{{footerNote}}</div></div>
</body></html>
