<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#0d1b2a;font-family:"Inter",sans-serif;color:#e2e8f0;-webkit-font-smoothing:antialiased;}
  .grid-lines{position:absolute;inset:0;background-image:linear-gradient(rgba(249,115,22,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(249,115,22,0.04) 1px,transparent 1px);background-size:90px 90px;}
  .left-accent{position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,#f97316 0%,rgba(249,115,22,0.1) 100%);}
  .brand-bar{position:absolute;top:56px;left:72px;right:60px;display:flex;align-items:center;justify-content:space-between;z-index:5;}
  .brand{font-family:"IBM Plex Mono",monospace;font-size:20px;color:#f97316;}
  .page{font-family:"IBM Plex Mono",monospace;font-size:18px;color:rgba(226,232,240,0.3);}
  .step-label{position:absolute;top:148px;left:72px;font-family:"IBM Plex Mono",monospace;font-size:18px;color:rgba(249,115,22,0.7);letter-spacing:0.08em;}
  .num{position:absolute;top:160px;right:50px;font-size:300px;font-weight:900;line-height:0.75;color:transparent;-webkit-text-stroke:2px rgba(249,115,22,0.12);letter-spacing:-8px;}
  .content{position:absolute;top:250px;left:72px;right:72px;}
  .title{font-size:86px;font-weight:900;line-height:0.92;letter-spacing:-2px;margin-bottom:28px;}
  .title-orange{color:#f97316;}
  .border-line{width:72px;height:4px;background:#f97316;border-radius:2px;margin-bottom:28px;}
  .body{font-size:29px;font-weight:400;line-height:1.55;color:rgba(226,232,240,0.7);max-width:820px;margin-bottom:36px;}
  .code-pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:18px;background:rgba(249,115,22,0.1);border:1px solid rgba(249,115,22,0.3);border-radius:8px;padding:8px 18px;color:#f97316;}
  .handle{position:absolute;bottom:60px;left:72px;font-family:"IBM Plex Mono",monospace;font-size:18px;color:rgba(226,232,240,0.25);}
</style></head>
<body>
  <div class="grid-lines"></div>
  <div class="left-accent"></div>
  <div class="brand-bar">
    <div class="brand">{{brand}}</div>
    <div class="page">{{pageOf}}</div>
  </div>
  <div class="step-label">// {{stepLabel}}</div>
  <div class="num">{{number}}</div>
  <div class="content">
    <div class="title">{{titleMain}}<br><span class="title-orange">{{titleOrange}}</span></div>
    <div class="border-line"></div>
    <div class="body">{{body}}</div>
    <div class="code-pill">{{codePill}}</div>
  </div>
  <div class="handle">{{handle}}</div>
</body></html>
