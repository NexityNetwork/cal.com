<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f1f1f1;font-family:"Inter",sans-serif;color:#37474f;-webkit-font-smoothing:antialiased}
.orb{position:absolute;top:140px;right:80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#ffe8b8 22%,#c4541f 58%,#5a2410 100%);box-shadow:0 30px 80px rgba(196,84,31,0.4),inset -36px -42px 60px rgba(0,0,0,0.22)}
.orb::before{content:"";position:absolute;top:18%;left:24%;width:80px;height:54px;background:radial-gradient(ellipse,rgba(255,255,255,0.7) 0%,transparent 70%);border-radius:50%}
.title{position:absolute;top:200px;left:60px;right:380px;font-family:"Barlow Condensed",sans-serif;font-weight:300;font-size:160px;line-height:0.92;letter-spacing:-2px;color:#37474f}
.title .bold{font-weight:800;letter-spacing:-3px}
.author{position:absolute;top:880px;left:60px;display:flex;align-items:center;gap:18px}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;border:2px solid #c4541f;flex-shrink:0}
.author-info .name{font-size:22px;font-weight:500;color:#37474f;line-height:1.2}
.author-info .handle{font-size:18px;font-weight:400;color:#37474f;line-height:1.2}
.bottom{position:absolute;bottom:64px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
.pill{padding:14px 32px;background:#37474f;color:#f1f1f1;border-radius:50px;font-size:18px;font-weight:400}
</style></head>
<body>
<div class="orb"></div>
<div class="title">{{titleLine1}}<br><span class="bold">{{titleBold}}</span><br>{{titleLine3}}</div>
<div class="author">
  <div class="avatar">{{authorInitials}}</div>
  <div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div>
</div>
<div class="bottom"><div class="pill">{{pageOf}}</div><div class="pill">Swipe ⓘ</div></div>
</body></html>
