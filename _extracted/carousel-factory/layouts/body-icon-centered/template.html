<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1350px; overflow: hidden;
    background: #050505;
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .frame {
    position: absolute; inset: 30px;
    border-radius: 32px; border: 1px solid #1c1c1c;
    overflow: hidden; background: #0a0a0a;
  }
  .page-badge {
    position: absolute; top: 56px; left: 56px;
    height: 44px; padding: 0 18px;
    background: #2a0e04;
    border-radius: 22px;
    display: inline-flex; align-items: center;
    color: #ff7a3d;
    font-size: 18px; font-weight: 700;
    letter-spacing: 0.06em; line-height: 1;
  }
  .body-block {
    position: absolute; top: 256px; left: 88px; right: 88px;
    display: flex; flex-direction: column; gap: 32px;
  }
  .body-title {
    color: #ffffff;
    font-size: 64px; font-weight: 700;
    line-height: 1.1; letter-spacing: -1.2px;
  }
  .body-text {
    color: #a8a8a8;
    font-size: 36px; font-weight: 400;
    line-height: 1.35;
  }
  .icon-hero {
    position: absolute; top: 800px; left: 50%;
    transform: translateX(-50%);
    width: 360px; height: 360px;
    border-radius: 50%;
    border: 1.5px solid #2a2a2a;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-hero svg { width: 200px; height: 200px; }
</style>
</head>
<body>
  <div class="frame">
    <div class="page-badge">{{pageNumber}}</div>

    <div class="body-block">
      <div class="body-title">{{title}}</div>
      <div class="body-text">{{body}}</div>
    </div>

    <div class="icon-hero">
      {{iconSvgInline}}
    </div>
  </div>
</body>
</html>
