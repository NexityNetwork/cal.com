<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#ff5722;font-family:"Inter",sans-serif;color:#0a0a0a;-webkit-font-smoothing:antialiased}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,0.06) 1px,transparent 1px);background-size:3px 3px;opacity:0.4;pointer-events:none}
.tag-strip{position:absolute;top:80px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.tag-pill{display:inline-block;padding:14px 26px;background:#0a0a0a;color:#ff5722;border-radius:50px;font-size:22px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase}
.num{font-size:22px;font-weight:700;color:#0a0a0a;letter-spacing:0.04em}
.headline-block{position:absolute;top:180px;left:80px;right:80px}
.eyebrow{font-family:"Fraunces",serif;font-style:italic;font-size:42px;font-weight:400;color:#0a0a0a;margin-bottom:14px}
.headline{font-size:128px;font-weight:900;line-height:0.88;letter-spacing:-4px;color:#0a0a0a}
.headline .accent{color:#fff8f0}
.body-card{position:absolute;top:680px;left:80px;right:80px;background:#0a0a0a;border-radius:30px;padding:50px 56px;color:#fff8f0}
.body-card .lbl{display:inline-block;padding:8px 18px;background:#ff5722;color:#0a0a0a;border-radius:50px;font-size:18px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:22px}
.body-card .body{font-size:36px;font-weight:500;line-height:1.4;letter-spacing:-0.4px}
.body-card .body em{font-family:"Fraunces",serif;font-style:italic;font-weight:400;color:#ff7a3c}
.stat-row{position:absolute;bottom:230px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;padding:24px 32px;background:rgba(0,0,0,0.08);border-radius:22px}
.stat-row .lbl-s{font-size:18px;font-weight:600;color:#0a0a0a;letter-spacing:0.08em;text-transform:uppercase}
.stat-row .val{font-size:42px;font-weight:900;color:#0a0a0a;letter-spacing:-1px}
.bottom-row{position:absolute;bottom:80px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;color:#0a0a0a}
.bottom-row .pg{font-size:22px;font-weight:600}
.bottom-row .swipe{font-size:22px;font-weight:600}
</style></head>
<body>
<div class="grain"></div>
<div class="tag-strip"><div class="tag-pill">{{tag}}</div><div class="num">{{slideNum}}</div></div>
<div class="headline-block">
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="headline">{{shoutLine1}}<br><span class="accent">{{shoutLine2}}</span></div>
</div>
<div class="body-card">
  <div class="lbl">{{bodyLabel}}</div>
  <div class="body">{{bodyText}}</div>
</div>
<div class="stat-row">
  <div><div class="lbl-s">{{statLabel1}}</div><div class="val">{{statValue1}}</div></div>
  <div><div class="lbl-s">{{statLabel2}}</div><div class="val">{{statValue2}}</div></div>
  <div><div class="lbl-s">{{statLabel3}}</div><div class="val">{{statValue3}}</div></div>
</div>
<div class="bottom-row"><div class="pg">{{pageOf}}</div><div class="swipe">{{swipeNote}} →</div></div>
</body></html>
