<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#e2ffed;font-family:"Inter",sans-serif;color:#37474f;-webkit-font-smoothing:antialiased}
.title{position:absolute;top:180px;left:60px;right:60px;font-family:"Barlow Condensed",sans-serif;font-weight:300;font-size:160px;line-height:0.92;letter-spacing:-2px;color:#37474f;max-height:620px;overflow:hidden}
.title .bold{font-weight:800;letter-spacing:-3px;display:inline-block}
.author{position:absolute;top:880px;left:60px;display:flex;align-items:center;gap:18px}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;border:2px solid #4ed086;flex-shrink:0}
.author-info .name{font-size:22px;font-weight:500;color:#37474f;line-height:1.2}
.author-info .handle{font-size:18px;font-weight:400;color:#37474f;line-height:1.2}
.bottom{position:absolute;bottom:64px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
.pill{padding:14px 32px;background:#37474f;color:#f1f1f1;border-radius:50px;font-size:18px;font-weight:400;display:inline-flex;align-items:center;gap:10px}
</style></head>
<body>
<div class="title">{{titleLine1}}<br>{{titleLine2}}<br><span class="bold">{{titleBold}}</span></div>
<div class="author">
  <div class="avatar">{{authorInitials}}</div>
  <div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div>
</div>
<div class="bottom">
  <div class="pill">{{pageOf}}</div>
  <div class="pill">Swipe ⓘ</div>
</div>
</body></html>
