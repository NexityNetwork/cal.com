<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#d1f5d8;font-family:"Inter",sans-serif;color:#1f3a30;-webkit-font-smoothing:antialiased}
.title{position:absolute;top:240px;left:80px;right:80px;font-family:"Barlow Condensed",sans-serif;font-weight:300;font-size:160px;line-height:0.92;letter-spacing:-2px;color:#1f3a30}
.title .accent{font-weight:800;color:#1f3a30}
.author{position:absolute;top:760px;left:80px;display:flex;align-items:center;gap:18px}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;border:2px solid #2dad6b;flex-shrink:0}
.author-info .name{font-size:24px;font-weight:700;color:#1f3a30;line-height:1.2}
.author-info .handle{font-size:18px;font-weight:500;color:#5a7a6e;line-height:1.2}
.bottom{position:absolute;bottom:60px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.page-pill{padding:14px 28px;background:#2dad6b;color:#fff;border-radius:50px;font-size:20px;font-weight:600;letter-spacing:0.04em}
.swipe-pill{padding:14px 32px;background:#2dad6b;color:#fff;border-radius:50px;font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
</style></head>
<body>
<div class="title">{{titleLine1}}<br>{{titleLine2}}<br><span class="accent">{{titleAccent}}</span></div>
<div class="author"><div class="avatar">{{authorInitials}}</div><div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div></div>
<div class="bottom"><div class="page-pill">{{pageOf}}</div><div class="swipe-pill">Swipe ⟶</div></div>
</body></html>
