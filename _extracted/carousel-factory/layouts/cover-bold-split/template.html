<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#f7f5ef;font-family:"Inter",sans-serif;color:#2c2c2c;-webkit-font-smoothing:antialiased;}
  /* Diagonal split: cream on left, dark slate on right */
  .split-right{position:absolute;top:0;right:0;width:480px;height:100%;background:#4a4a4a;clip-path:polygon(0 18%,100% 0,100% 100%,30% 100%);}
  /* Dotted circle decoration top-left */
  .dot-circle{position:absolute;top:40px;left:40px;width:280px;height:280px;border-radius:50%;
    background-image:radial-gradient(circle,#2c2c2c 2.5px,transparent 3px);
    background-size:24px 24px;}
  /* Display title */
  .display{position:absolute;top:280px;left:80px;width:680px;
    font-family:"Oswald",sans-serif;font-weight:700;
    font-size:148px;line-height:0.94;letter-spacing:-0.005em;
    color:#2c2c2c;text-transform:uppercase;}
  /* Handle pill */
  .handle-pill{position:absolute;left:80px;bottom:140px;
    height:78px;padding:0 36px;
    background:#f7f5ef;border:1.5px solid #2c2c2c;border-radius:42px;
    display:inline-flex;align-items:center;gap:18px;
    font-size:30px;font-weight:500;color:#2c2c2c;}
  .handle-pill::before,.handle-pill::after{content:"✱";font-size:24px;}
  /* Swipe pill on dark side */
  .swipe-pill{position:absolute;right:60px;bottom:80px;
    height:64px;padding:0 22px;
    background:#f7f5ef;border-radius:32px;
    display:inline-flex;align-items:center;gap:14px;
    font-size:26px;font-weight:500;color:#2c2c2c;}
  .swipe-arrow{display:inline-flex;align-items:center;justify-content:center;width:48px;height:32px;background:#a0a0a0;color:#2c2c2c;font-size:22px;font-weight:700;border-radius:6px;}
</style></head>
<body>
  <div class="split-right"></div>
  <div class="dot-circle"></div>
  <div class="display">{{title}}</div>
  <div class="handle-pill">{{handle}}</div>
  <div class="swipe-pill">Swipe<span class="swipe-arrow">▶</span></div>
</body></html>
