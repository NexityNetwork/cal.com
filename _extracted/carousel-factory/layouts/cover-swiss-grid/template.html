<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,400;1,600;1,800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#f0ede8;font-family:"Inter",sans-serif;color:#111;-webkit-font-smoothing:antialiased}
.frame{position:absolute;inset:0;display:flex;flex-direction:row}
.left-panel{width:232px;background:#d62828;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.left-panel .big-num{font-size:200px;font-weight:900;color:#f0ede8;letter-spacing:-8px;line-height:1;writing-mode:vertical-rl;transform:rotate(180deg);opacity:0.92;padding:20px 0}
.left-panel .accent-line{position:absolute;bottom:80px;left:0;right:0;height:3px;background:rgba(240,237,232,0.3)}
.left-panel .count-label{position:absolute;bottom:50px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;color:rgba(240,237,232,0.6);letter-spacing:0.28em;text-transform:uppercase}
.right-panel{flex:1;padding:48px 56px;display:flex;flex-direction:column;gap:0;background:#f0ede8}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:2px solid #111}
.brand{font-size:12px;font-weight:800;letter-spacing:0.3em;text-transform:uppercase}
.issue-meta{font-size:12px;color:#666;letter-spacing:0.16em;text-transform:uppercase}
.handle{font-size:13px;color:#d62828;font-weight:700}
.headline-section{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:0.28em;color:#d62828;text-transform:uppercase;margin-bottom:18px}
.title{font-size:84px;font-weight:900;line-height:0.93;letter-spacing:-2.5px;color:#111;text-transform:uppercase}
.title .accent{color:#d62828}
.h-rule{height:4px;background:#111;margin:24px 0;width:100%}
.subtitle{font-family:"Playfair Display",serif;font-size:22px;color:#3d3d38;line-height:1.48;font-style:italic;max-width:700px}
.lower-section{display:flex;flex-direction:column;gap:16px;margin-top:auto}
.tag-row{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:9px 16px;border:1.5px solid #111;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:#111}
.chip.red{background:#d62828;border-color:#d62828;color:#f0ede8}
.author-row{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:2px solid #111}
.author-info .nm{font-size:14px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase}
.author-info .rl{font-size:11px;color:#666;letter-spacing:0.08em;margin-top:2px}
.pg{font-size:22px;font-weight:900;color:#d62828;letter-spacing:0.02em}
</style></head>
<body>
<div class="frame">
  <div class="left-panel">
    <div class="big-num">{{heroNum}}</div>
    <div class="count-label">{{countLabel}}</div>
  </div>
  <div class="right-panel">
    <div class="top-bar">
      <div class="brand">{{brandTag}}</div>
      <div class="issue-meta">{{issueMeta}}</div>
      <div class="handle">{{handle}}</div>
    </div>
    <div class="headline-section">
      <div class="eyebrow">{{eyebrow}}</div>
      <div class="title">{{titleLine1}}<br><span class="accent">{{titleAccent}}</span> {{titleLine2}}</div>
      <div class="h-rule"></div>
      <div class="subtitle">{{subtitle}}</div>
    </div>
    <div class="lower-section">
      <div class="tag-row">
        <div class="chip red">{{tag1}}</div>
        <div class="chip">{{tag2}}</div>
        <div class="chip">{{tag3}}</div>
      </div>
      <div class="author-row">
        <div class="author-info">
          <div class="nm">{{authorName}}</div>
          <div class="rl">{{authorRole}}</div>
        </div>
        <div class="pg">{{pageOf}}</div>
      </div>
    </div>
  </div>
</div>
</body></html>
