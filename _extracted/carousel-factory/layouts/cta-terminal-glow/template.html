<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Fraunces:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0e14;font-family:"Inter",sans-serif;color:#d6e2eb;-webkit-font-smoothing:antialiased}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(80,200,150,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(80,200,150,0.04) 1px,transparent 1px);background-size:32px 32px}
.glow{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:80%;height:60%;border-radius:50%;background:radial-gradient(circle,rgba(80,200,150,0.22) 0%,transparent 65%);pointer-events:none}
.frame{position:absolute;inset:24px;border:1px solid rgba(80,200,150,0.18);border-radius:18px;padding:40px 56px 50px;display:flex;flex-direction:column;gap:24px;background:rgba(10,14,20,0.6);text-align:center}
.top-row{display:flex;justify-content:space-between;align-items:center;text-align:left}
.tag{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;background:rgba(80,200,150,0.12);border:1px solid rgba(80,200,150,0.4);color:#5fd9a8;border-radius:6px;font-family:"JetBrains Mono",monospace;font-size:16px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase}
.tag::before{content:"●";color:#5fd9a8;font-size:12px}
.handle{font-family:"JetBrains Mono",monospace;font-size:18px;color:#7d8a96;font-weight:600}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px}
.intro{font-family:"Fraunces",serif;font-style:italic;font-size:32px;color:#7d8a96;line-height:1.3}
.title{font-size:128px;font-weight:900;line-height:0.95;letter-spacing:-3.5px;color:#f0f5f7}
.title .accent{color:#5fd9a8;text-shadow:0 0 30px rgba(80,200,150,0.5)}
.title em{font-family:"Fraunces",serif;font-style:italic;font-weight:400;color:#7d8a96}
.recap{display:inline-flex;align-items:center;gap:16px;padding:18px 26px;background:rgba(80,200,150,0.06);border:1px solid rgba(80,200,150,0.22);border-radius:10px}
.recap .l{font-family:"JetBrains Mono",monospace;font-size:14px;color:#7d8a96;letter-spacing:0.12em;text-transform:uppercase;font-weight:700}
.recap .chips{display:flex;gap:10px}
.recap .chip{width:44px;height:44px;border-radius:9px;background:#0a0e14;border:1px solid rgba(80,200,150,0.3);display:flex;align-items:center;justify-content:center;padding:7px}
.recap .chip svg{width:100%;height:100%}
.body{font-size:24px;color:#a8b6c0;line-height:1.45;max-width:840px;font-weight:500}
.body em{color:#5fd9a8;font-style:normal;font-weight:700}
.btn-row{display:flex;justify-content:center;gap:16px;margin-top:6px}
.btn-primary{display:inline-flex;align-items:center;gap:12px;padding:22px 40px;background:#5fd9a8;color:#050810;border-radius:8px;font-size:22px;font-weight:800;letter-spacing:-0.3px}
.btn-primary::after{content:"→"}
.btn-ghost{padding:22px 32px;background:#101720;border:1px solid rgba(80,200,150,0.3);color:#5fd9a8;border-radius:8px;font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:700;letter-spacing:0.06em}
.bottom-row{display:flex;justify-content:space-between;align-items:center;margin-top:4px;text-align:left}
.bottom-row .pg{padding:12px 22px;background:#101720;border:1px solid rgba(80,200,150,0.3);color:#5fd9a8;border-radius:6px;font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:700;letter-spacing:0.08em}
.bottom-row .signoff{font-family:"Fraunces",serif;font-style:italic;font-size:18px;color:#7d8a96}
</style></head>
<body>
<div class="grid-bg"></div>
<div class="glow"></div>
<div class="frame">
  <div class="top-row"><div class="tag">{{brandTag}}</div><div class="handle">{{handle}}</div></div>
  <div class="center">
    <div class="intro">{{intro}}</div>
    <div class="title">{{ctaLine1}} <span class="accent">{{ctaAccent}}</span><br><em>{{ctaItalic}}</em></div>
    <div class="recap">
      <div class="l">{{recapLabel}}</div>
      <div class="chips">
        <div class="chip">{{iconSvg1}}</div>
        <div class="chip">{{iconSvg2}}</div>
        <div class="chip">{{iconSvg3}}</div>
        <div class="chip">{{iconSvg4}}</div>
        <div class="chip">{{iconSvg5}}</div>
        <div class="chip">{{iconSvg6}}</div>
      </div>
    </div>
    <div class="body">{{ctaBody}}</div>
    <div class="btn-row">
      <div class="btn-primary">{{btnPrimary}}</div>
      <div class="btn-ghost">{{btnGhost}}</div>
    </div>
  </div>
  <div class="bottom-row">
    <div class="pg">{{pageOf}}</div>
    <div class="signoff">{{signoff}}</div>
  </div>
</div>
</body></html>
