<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#fafafa;font-family:"Inter",sans-serif;color:#1d1d1d;-webkit-font-smoothing:antialiased}
.badge{position:absolute;top:65px;left:75px;width:92px;height:50px;background:#3457d5;border-radius:1000px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Geist",sans-serif;font-size:24px;font-weight:700}
.handle{position:absolute;top:70px;right:75px;font-family:"Geist",sans-serif;font-size:32px;font-weight:500;color:#4b5563}
.title{position:absolute;top:250px;left:75px;right:75px;font-family:"Inter",sans-serif;font-size:64px;font-weight:600;line-height:1.15;color:#1d1d1d;letter-spacing:-1.2px}
.body{position:absolute;top:430px;left:75px;right:75px;font-family:"Inter",sans-serif;font-size:48px;font-weight:500;line-height:1.4;color:#4b5563}
.callout{position:absolute;bottom:200px;left:75px;right:75px;padding:34px 38px;background:#eaeefe;border-left:6px solid #3457d5;border-radius:18px}
.callout .lbl{font-size:22px;font-weight:700;color:#3457d5;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:12px}
.callout .body{position:static;font-size:32px;font-weight:500;color:#1d1d1d;line-height:1.4}
.cta-row{position:absolute;bottom:85px;left:75px;right:75px;display:flex;justify-content:space-between;align-items:center}
.handle-foot{font-family:"Geist",sans-serif;font-size:24px;color:#4b5563;font-weight:500}
.arrow-circle{width:54px;height:54px;background:#3457d5;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
</style></head>
<body>
<div class="badge">{{number}}</div>
<div class="handle">{{handle}}</div>
<div class="title">{{title}}</div>
<div class="body">{{body}}</div>
<div class="callout"><div class="lbl">{{calloutLabel}}</div><div class="body">{{calloutBody}}</div></div>
<div class="cta-row"><div class="handle-foot">{{pageOf}}</div><div class="arrow-circle">→</div></div>
</body></html>
