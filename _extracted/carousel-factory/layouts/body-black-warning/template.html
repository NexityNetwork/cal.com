<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#000;font-family:"Inter",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.author{position:absolute;top:60px;left:80px;display:flex;align-items:center;gap:14px}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,{{avatarBg1}},{{avatarBg2}});display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.author-info .name{font-size:18px;font-weight:700;line-height:1.2}
.author-info .handle{font-size:14px;color:rgba(255,255,255,0.4);line-height:1.2}
.page{position:absolute;top:80px;right:80px;font-size:18px;font-weight:600;color:rgba(255,255,255,0.4)}
.num-circle{position:absolute;top:200px;left:80px;width:88px;height:88px;border:2px solid #ff4757;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"DM Serif Display",serif;font-style:italic;font-size:46px;color:#ff4757}
.title{position:absolute;top:340px;left:80px;right:80px;font-family:"DM Serif Display",serif;font-style:italic;font-size:88px;line-height:1;letter-spacing:-1.5px;color:#fff}
.title .accent{color:#ff4757}
.divider{position:absolute;top:660px;left:80px;width:80px;height:4px;background:#ff4757;border-radius:2px}
.body{position:absolute;top:700px;left:80px;right:80px;font-size:30px;font-weight:400;line-height:1.55;color:rgba(255,255,255,0.7);max-width:920px}
.quote{position:absolute;bottom:200px;left:80px;right:80px;font-family:"DM Serif Display",serif;font-style:italic;font-size:34px;line-height:1.35;color:#fff;padding-left:24px;border-left:4px solid #ff4757}
.swipe{position:absolute;bottom:80px;right:80px;font-size:22px;color:#ff4757;font-weight:600}
</style></head>
<body>
<div class="author"><div class="avatar">{{authorInitials}}</div><div class="author-info"><div class="name">{{authorName}}</div><div class="handle">{{handle}}</div></div></div>
<div class="page">{{pageOf}}</div>
<div class="num-circle">{{number}}</div>
<div class="title">{{titleLine1}} <span class="accent">{{titleAccent}}</span></div>
<div class="divider"></div>
<div class="body">{{body}}</div>
<div class="quote">{{quote}}</div>
<div class="swipe">{{handle}} →</div>
</body></html>
