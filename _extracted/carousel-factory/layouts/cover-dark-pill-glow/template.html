<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,wght@1,400;1,600;1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a;font-family:"Inter",sans-serif;color:#f5f5f5;-webkit-font-smoothing:antialiased}
.outline{position:absolute;inset:24px;border:1px solid rgba(255,255,255,0.05);border-radius:32px;pointer-events:none}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.025) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.tag-pill{position:absolute;top:64px;right:64px;display:inline-flex;align-items:center;gap:8px;padding:10px 22px;background:rgba(255,87,34,0.08);border:1px solid rgba(255,87,34,0.4);border-radius:50px;color:#ff7a3c;font-size:18px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase}
.tag-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:#ff7a3c;box-shadow:0 0 12px #ff7a3c}
.center{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;display:flex;flex-direction:column;align-items:center}
.main-pill{display:inline-flex;align-items:center;padding:38px 80px;border-radius:90px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.12);position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);}
.main-pill::before{content:"";position:absolute;inset:-20px;border-radius:110px;background:radial-gradient(ellipse at 75% 50%,rgba(255,87,34,0.45) 0%,transparent 55%);filter:blur(20px);z-index:-1;pointer-events:none}
.pill-text{font-family:"Inter",sans-serif;font-size:96px;font-weight:600;line-height:1;letter-spacing:-2.5px;white-space:nowrap}
.pill-left{color:#ffffff}
.pill-right{color:#ff7a3c;margin-left:24px;text-shadow:0 0 24px rgba(255,122,60,0.6),0 0 40px rgba(255,87,34,0.4)}
.sub{margin-top:48px;font-family:"Inter",sans-serif;font-size:42px;font-weight:500;letter-spacing:-0.6px;color:#cdd5df}
.sub .fade{background:linear-gradient(90deg,#cdd5df 60%,#ff7a3c 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.bottom-row{position:absolute;bottom:84px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;color:#525252;font-size:18px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase}
.indicator{display:inline-flex;align-items:center;gap:12px;color:#9ca3af}
.arrow-pulse{display:inline-block;width:42px;height:42px;border-radius:50%;background:#ff7a3c;color:#0a0a0a;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;box-shadow:0 0 24px rgba(255,122,60,0.55)}
</style></head>
<body>
<div class="outline"></div>
<div class="dots"></div>
<div class="tag-pill">{{tag}}</div>
<div class="center">
  <div class="main-pill">
    <span class="pill-text pill-left">{{pillLeft}}</span><span class="pill-text pill-right">{{pillRight}}</span>
  </div>
  <div class="sub"><span class="fade">{{subline}}</span></div>
</div>
<div class="bottom-row"><div>{{pageOf}}</div><div class="indicator"><span>swipe</span><span class="arrow-pulse">→</span></div></div>
</body></html>
