<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">
<style>
  .cover-title {
    position: absolute;
    top: 480px;
    left: 88px;
    width: 880px;
    color: #c7c7c7;
    font-size: 64px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -1.4px;
  }
  .cover-title .accent { color: #ff5e1a; }

  .play-stack {
    position: absolute;
    bottom: -40px;
    right: 80px;
    width: 540px;
    height: 540px;
  }
  .play-tri { position: absolute; inset: 0; }
  .echo-1 { transform: translateX(-50px);  opacity: 0.55; filter: blur(4px); }
  .echo-2 { transform: translateX(-130px); opacity: 0.30; filter: blur(12px); }
  .echo-3 { transform: translateX(-240px); opacity: 0.15; filter: blur(24px); }
</style>
</head>
<body>
  <div class="frame">
    <div class="page-badge">01</div>

    <div class="cover-title">
      How to move like a<br>
      20-person team<span class="accent">.</span>
    </div>

    <div class="play-stack">
      <svg class="play-tri echo-3" viewBox="0 0 540 540" xmlns="http://www.w3.org/2000/svg">
        <polygon points="0,40 540,300 0,540" fill="#ff5e1a"/>
      </svg>
      <svg class="play-tri echo-2" viewBox="0 0 540 540" xmlns="http://www.w3.org/2000/svg">
        <polygon points="0,40 540,300 0,540" fill="#ff5e1a"/>
      </svg>
      <svg class="play-tri echo-1" viewBox="0 0 540 540" xmlns="http://www.w3.org/2000/svg">
        <polygon points="0,40 540,300 0,540" fill="#ff5e1a"/>
      </svg>
      <svg class="play-tri" viewBox="0 0 540 540" xmlns="http://www.w3.org/2000/svg">
        <polygon points="0,40 540,300 0,540" fill="#ff5e1a"/>
      </svg>
    </div>
  </div>
</body>
</html>
